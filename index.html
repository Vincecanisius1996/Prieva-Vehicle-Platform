<html lang="nl">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    /* PRIEVA huisstijl: blauwverloop #0D9EBF → #056A7F, zwart woordmerk, Montserrat */
    --brand:#0d9ebf; --brand-2:#056a7f;
    --navy:#12333d; --navy-2:#0b2830; --ink:#16232b; --muted:#67808c;
    --line:#e2e9ed; --bg:#f3f8fa; --card:#ffffff; --accent:#0d9ebf; --radius:12px;
    --green:#1f8a5b; --green-soft:#e4f4ec; --blue:#056a7f; --blue-soft:#e1f1f5;
    --amber:#b9791a; --amber-soft:#fbf0dc; --red:#c0392b; --red-soft:#fdecec;
    --slate:#5b6b7b; --slate-soft:#eef2f6;
    --shadow:0 1px 2px rgba(9,50,63,.06),0 8px 24px rgba(9,50,63,.08);
    --leonie:#7c3aed; --sjoerd:#0f9488; --vince:#475569; --floris:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .demo-bar{background:var(--blue-soft);color:var(--brand-2);text-align:center;font-size:12.5px;padding:6px 12px;font-weight:600;border-bottom:1px solid #cfe6ec}
  header.top{background:linear-gradient(120deg,var(--brand-2),var(--brand));color:#fff;padding:0 22px;display:flex;align-items:center;gap:22px;height:62px;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(5,106,127,.3)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:1.5px}
  .logo{width:30px;height:34px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.22))}
  .brand small{display:block;font-size:10px;font-weight:600;color:#d3edf3;letter-spacing:1.4px;margin-top:1px}
  nav.main{display:flex;gap:4px;margin-left:6px}
  nav.main button{background:transparent;border:0;color:#e3f4f8;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s;text-transform:uppercase;letter-spacing:.6px}
  nav.main button:hover{background:rgba(255,255,255,.09);color:#fff}
  nav.main button.active{background:rgba(255,255,255,.16);color:#fff}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .search{position:relative}
  .search input{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;padding:8px 12px 8px 32px;font-size:13.5px;width:200px;outline:none}
  .search input::placeholder{color:#a9c4dc}
  .search svg{position:absolute;left:10px;top:9px;opacity:.7}
  .avatar{width:34px;height:34px;border-radius:50%;background:#2c5a80;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.2)}
  main{max-width:1160px;margin:0 auto;padding:24px 22px 70px}
  .page-title{font-size:21px;font-weight:800;margin:0 0 3px;letter-spacing:.4px;text-transform:uppercase}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:750;margin-top:5px;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card h3{margin:0;padding:14px 18px;font-size:15px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-body{padding:14px 18px}

  .banner{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--radius);margin-bottom:20px;border:1px solid #c5dcef;background:linear-gradient(180deg,#f2f8fd,#e9f2fb)}
  .banner .bi{width:42px;height:42px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;flex:none;box-shadow:0 3px 10px rgba(43,108,176,.35)}
  .banner .bt{font-weight:700;font-size:15px} .banner .bs{font-size:13px;color:var(--muted);margin-top:2px}
  .btn{border:0;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
  .btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px rgba(13,158,191,.35)} .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--navy)} .btn-ghost:hover{background:#f2f6fa}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .banner .sp{margin-left:auto;display:flex;gap:8px}

  .groupwrap{display:flex;flex-direction:column;gap:18px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .grp-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
  .grp-head .gt{font-weight:750;font-size:15px}
  .grp-head .gcount{font-size:12px;background:var(--slate-soft);color:var(--slate);padding:2px 9px;border-radius:999px;font-weight:700}
  .grp-head .gdate{font-size:12.5px;color:var(--muted);font-weight:600}
  .grp-head .sp{margin-left:auto}
  .grp-head.batch{background:linear-gradient(180deg,#eef6ff,#e6f0fa)}
  .grp-head.batch .gt{color:var(--navy)}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tbody tr{transition:background .12s} tbody tr:hover{background:#f7fafd} tbody tr:last-child td{border-bottom:0}
  .veh-cell{display:flex;align-items:center;gap:11px;cursor:pointer}
  .thumb{width:44px;height:33px;border-radius:6px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f8,#dde6ef);border:1px solid var(--line);color:#8aa0b4}
  .veh-cell .nm{font-weight:650;font-size:13.5px} .veh-cell .id{font-size:11.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--slate-soft);color:var(--slate)}
  .tag-imp{background:var(--blue-soft);color:var(--blue)} .tag-nl{background:var(--slate-soft);color:var(--slate)}
  .note{font-size:11.5px;color:var(--muted)}
  .agechip{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:999px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-komende{background:var(--blue-soft);color:var(--blue)} .b-lopende{background:var(--green-soft);color:var(--green)}
  .segbar{display:flex;gap:3px;align-items:center}
  .seg{width:14px;height:8px;border-radius:2px;background:var(--slate-soft)}
  .seg.done{background:var(--green)} .seg.current{background:var(--blue)} .seg.todo{background:#cdd8e2} .seg.nvt{background:#eef2f6}
  .phase-lab{font-size:12.5px;font-weight:600}
  .funnel{display:flex;flex-direction:column;gap:8px}
  .fn{display:flex;align-items:center;gap:12px}
  .fn .fl{width:150px;font-size:12.5px;color:var(--ink);font-weight:600;flex:none}
  .fn .track{flex:1;height:22px;background:var(--slate-soft);border-radius:6px;overflow:hidden}
  .fn .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy-2));border-radius:6px;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-size:11.5px;font-weight:700;padding-right:7px;min-width:22px}
  .fn .fc{width:26px;text-align:right;font-weight:700;font-size:13px;flex:none}
  .cols{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .person-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .person-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .pav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
  .person-head .pn{font-weight:700;font-size:14.5px} .person-head .pc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .todo{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0} .todo:hover{background:#f7fafd}
  .todo .tk{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue)}
  .todo .body{min-width:0;flex:1;cursor:pointer} .todo .act{font-weight:650;font-size:13.5px}
  .todo .veh{font-size:12px;color:var(--muted)}
  select.assign{border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:12px;background:#fff;color:var(--ink);cursor:pointer}
  .chk{display:inline-flex;cursor:pointer;position:relative;align-items:center}
  .chk input{position:absolute;opacity:0;width:0;height:0}
  .chk .box{width:24px;height:24px;border-radius:7px;border:2px solid #cdd8e2;background:#fff;display:grid;place-items:center;transition:.15s}
  .chk .box:after{content:"✓";color:#fff;font-size:15px;font-weight:800;opacity:0;transform:scale(.5);transition:.15s;line-height:1}
  .chk input:checked + .box{background:var(--green);border-color:var(--green)}
  .chk input:checked + .box:after{opacity:1;transform:scale(1)}
  .chk:hover .box{border-color:var(--green)}
  tr.row-arrived{background:#f3fbf6} tr.row-arrived:hover{background:#eaf7f0}
  .arr-lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
  .pbar{height:8px;border-radius:5px;background:var(--slate-soft);overflow:hidden}
  .pfill{height:100%;background:linear-gradient(90deg,var(--green),#2fae74);border-radius:5px}
  .need{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:999px}
  .route-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .rbg-ja{background:var(--green-soft);color:var(--green)} .rbg-nee{background:var(--blue-soft);color:var(--blue)}
  .tstep{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
  .tstep:last-child{border-bottom:0}
  .tstep .h{font-weight:650;font-size:13.5px}
  .tstep.todo .h{color:var(--muted);font-weight:600}
  .tstep.current .h{color:var(--navy)}
  .tstep .d{font-size:12px;color:var(--muted)}
  .tnum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;border:2px solid #eddcb8;background:var(--amber-soft);color:var(--amber)}
  .tnum.done{background:var(--green);border-color:var(--green);color:#fff}
  .route-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .rb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;font-weight:700;font-size:12.5px;cursor:pointer;transition:.12s}
  .rb.ja{border-color:#bfe6d1;color:var(--green)} .rb.ja:hover{background:var(--green-soft)}
  .rb.nee{border-color:#cfe0f1;color:var(--blue)} .rb.nee:hover{background:var(--blue-soft)}
  .rb.active-ja{background:var(--green);color:#fff;border-color:var(--green)}
  .rb.active-nee{background:var(--blue);color:#fff;border-color:var(--blue)}
  .undo-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
  .undo-btn:hover:not(:disabled){background:rgba(255,255,255,.24)}
  .undo-btn:disabled{opacity:.4;cursor:default}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 14px 11px 16px;border-radius:11px;box-shadow:0 8px 30px rgba(15,47,76,.4);display:flex;align-items:center;gap:14px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:92vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast .tundo{background:var(--accent);border:0;color:#fff;font-weight:700;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .toast .tx{background:transparent;border:0;color:#c4d6e6;font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
  .empty{padding:38px;text-align:center;color:var(--muted)}
  .empty .eb{font-size:30px;margin-bottom:8px;opacity:.5}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:14px}
  .det-head{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
  .hero{width:250px;height:170px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#e8eef4,#d3deea);border:1px solid var(--line);color:#8aa0b4}
  .det-title h1{margin:0 0 4px;font-size:24px;letter-spacing:-.3px}
  .det-title .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600}
  .chip b{color:var(--muted);font-weight:600}
  .det-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .spec{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .spec .k{color:var(--muted);font-size:13px} .spec .v{font-weight:650;font-size:13.5px;text-align:right}
  .plist{padding:2px 0}
  .pstep{display:flex;gap:12px;align-items:flex-start}
  .pstep .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
  .pstep .pt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted)}
  .pstep.done .pt{background:var(--green);border-color:var(--green);color:#fff}
  .pstep.current .pt{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-soft)}
  .pstep.nvt .pt{background:#f4f7fa;border-color:#e3e9ef;color:#c2ccd6}
  .pstep .ln{width:2px;flex:1;background:var(--line);margin:2px 0}
  .pstep.done .ln{background:var(--green)}
  .pstep .ct{padding-bottom:14px;flex:1}
  .pstep .h{font-weight:650;font-size:13.5px} .pstep.nvt .h{color:var(--muted);font-weight:500}
  .pstep .d{font-size:12px;color:var(--muted)}
  .owner-box{display:flex;align-items:center;gap:10px;padding:12px 16px}
  .infobar{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:10px;font-size:13.5px;margin-top:4px;background:var(--blue-soft);border:1px solid #c5dcef;color:#215883}
  .infobar .ai{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-weight:800;background:#cfe1f2;color:var(--blue)}
  .muted{color:var(--muted)}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px}
  .ptile{position:relative;width:100%;aspect-ratio:4/3;border:2px dashed #cdd8e2;border-radius:10px;display:grid;place-items:center;cursor:pointer;background:#f7fafd;overflow:hidden;transition:.15s}
  .ptile:hover{border-color:var(--blue);background:#eef5fb}
  .ptile.has{border-style:solid;border-color:var(--green);background:#fff}
  .ptile img{width:100%;height:100%;object-fit:cover}
  .ptile .pcam{font-size:22px;opacity:.55}
  .ptile .padd{position:absolute;bottom:6px;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .ptile .pcheck{position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:0 1px 4px rgba(16,40,64,.3)}
  .ptile .premove{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(192,57,43,.94);color:#fff;border:0;font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
  .plabel{font-size:12px;font-weight:650;margin-top:6px;line-height:1.25}
  .preq{font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.2px}
  .popt{font-size:10px;font-weight:700;color:var(--slate);background:var(--slate-soft);padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.2px}
  .pgroup-h{font-size:11.5px;font-weight:750;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 9px;display:flex;align-items:center;gap:9px}
  .pgroup-h .gc{font-size:11px;background:var(--slate-soft);color:var(--slate);padding:1px 8px;border-radius:999px;font-weight:700}
  .pinstr{font-size:11px;color:var(--muted);line-height:1.3;margin-top:2px}
  .add-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
  .add-btn:hover{background:rgba(255,255,255,.26)}
  .modal-ov{position:fixed;inset:0;background:rgba(15,47,76,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .modal-ov.show{display:flex}
  .modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,47,76,.4);width:100%;max-width:430px;overflow:hidden;animation:pop .15s ease}
  @keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .modal h3{margin:0;padding:15px 18px;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-weight:750}
  .modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:13px}
  .modal label{font-size:12.5px;font-weight:650;color:var(--slate);display:block;margin-bottom:5px}
  .modal input[type=text],.modal select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.5px;background:#fff;color:var(--ink);outline:none}

  {id:"TB-198-D",vin:"—",kenteken:"TB-198-D",merk:"Volkswagen",model:"Polo",uitv:"6R 1.2 Easyline",kleur:"Wit",brandstof:"Benzine",transm:"Handgeschakeld",reg:"12-04-2010",km:180000,inkoopdatum:"—",lev:"Inruil",importAuto:false,batch:null,note:"Inruil (Marcel Otten)",status:"komende"},
  {id:"X-204-GF",vin:"—",kenteken:"X-204-GF",merk:"Opel",model:"Corsa",uitv:"F 1.2",kleur:"Wit",brandstof:"Benzine",transm:"Handgeschakeld",reg:"18-08-2020",km:60800,inkoopdatum:"—",lev:"Inruil",importAuto:false,batch:null,note:"Inruil (Emily Paul) — telefonisch verkocht",status:"komende"},
];
// De velden die NIET uit de catalogus komen maar tijdens het traject ontstaan. Eén definitie, want
// dit is nodig voor zowel de terugvallijst hierboven als de rijen die loadVehicles() ophaalt.
function initVeh(v){ v.owner=null; v.klaar=0; v.route=null; v.photos={}; v.subtasks=[]; v.arrivedAt=null; v.taxAt=null; }
V.forEach(initVeh);
let subUid=1;
let globalTodos=[]; let gtUid=1;
let currentUser=null; let adPhotos={}; let fotoState={car:null}; let taxState={car:null};
// Staat het automatisch uitlezen aan op de server? Zo niet, dan tonen we de knop niet — een knop die
// alleen "staat uit" kan zeggen, is erger dan geen knop.
let kanUitlezen=false;
let activityLog=[];

/* ===== Helpers ===== */
const km = n => (n==null?"—":n.toLocaleString("nl-NL")+" km");
const euro = n => (n==null||n===""?"—":"€ "+Number(n).toLocaleString("nl-NL",{minimumFractionDigits:2,maximumFractionDigits:2}));
const statusLabel = {komende:"Komende",lopende:"Lopende"};
function stepList(v){
  if(!v.importAuto) return TAIL.slice();
  // Taxatie (JA/NEE) is losgekoppeld: staat niet meer als stap in de rij, maar wordt apart gezet
  // (kan al vóór de foto's). Zonder keuze tonen we alleen de foto-stappen; de rest volgt na de keuze.
  let L=IMPORT_BASE.slice();
  if(v.route==='JA') L=L.concat(ROUTE_JA,TAIL);
  else if(v.route==='NEE') L=L.concat(ROUTE_NEE,TAIL);
  return L;
}
function steps(v){
  const L=stepList(v); const done=v.klaar||0;
  return {arr:L.map((st,i)=>({label:st.label,cat:st.cat,decision:!!st.decision,state:i<done?'done':(i===done?'current':'todo'),i})),
    currentIdx: done<L.length?done:null, done:Math.min(done,L.length), total:L.length, list:L};
}
function currentAction(v){
  if(v.status!=='lopende')return null;
  const s=steps(v);
  if(s.currentIdx!=null){ const st=s.list[s.currentIdx]; return {actie:(ACTIEVERB[st.label]||st.label),cat:st.cat}; }
  // foto-stappen klaar maar taxatie-route nog niet gekozen → de keuze is de volgende actie
  if(v.importAuto && !v.route) return {actie:"BPM Taxatie kiezen: JA of NEE",decision:true,cat:"BPM Taxatie"};
  return null;
}
function pav(name){const k=PKEY[name]; return `<span class="pav" style="background:var(--${k})">${initials(name)}</span>`;}
function badge(s){return `<span class="badge b-${s}">${statusLabel[s]}</span>`;}
function carIcon(){return `<svg width="20" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11h1a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 11-4 0H9a2 2 0 11-4 0H4a1 1 0 01-1-1v-3a1 1 0 011-1h1z"/></svg>`;}

let state={view:"vandaag",q:""};
const app=document.getElementById("app");

/* ===== Server-opslag (backend). Valt terug op lokaal als de API er niet is. ===== */
let apiOk=false, saveT=null;
// stateOk = "de voortgang is echt ingelezen". Zolang dat niet gelukt is, mag er NIETS terug naar de
// server: V staat dan nog op de beginwaarden (alles 'komende', geen foto's, geen subtaken) en één
// klik zou dat over de database heen schrijven.
let stateOk=false;
function buildState(){const vehicles={}; V.forEach(v=>{vehicles[v.id]={status:v.status,klaar:v.klaar,route:v.route,owner:v.owner,subtasks:v.subtasks,photos:v.photos,arrivedAt:v.arrivedAt||null,taxAt:v.taxAt||null};}); return {vehicles,subUid,globalTodos,gtUid,activityLog};}
async function loadState(){
  stateOk=false;   // opnieuw inlezen: tot het gelukt is mag er niets terug naar de server
  try{ const r=await fetch("/api/state",{cache:"no-store"}); if(!r.ok)return; const s=await r.json(); apiOk=true;
    if(s&&s.vehicles){ V.forEach(v=>{const d=s.vehicles[v.id]; if(d){ if(d.status)v.status=d.status; if(typeof d.klaar==="number")v.klaar=d.klaar; v.route=d.route||null; v.owner=d.owner||null; v.subtasks=Array.isArray(d.subtasks)?d.subtasks:[]; v.photos=d.photos||{}; v.arrivedAt=d.arrivedAt||null; v.taxAt=d.taxAt||null; }});
      if(typeof s.subUid==="number")subUid=Math.max(subUid,s.subUid);
      if(Array.isArray(s.globalTodos))globalTodos=s.globalTodos;
      if(Array.isArray(s.activityLog))activityLog=s.activityLog;
      if(typeof s.gtUid==="number")gtUid=Math.max(gtUid,s.gtUid); }
    stateOk=true;   // pas hier: alles is zonder fout ingelezen, vanaf nu mag er opgeslagen worden
  }catch(_){ /* geen backend: lokaal verder */ }
}
/* Catalogus uit de database. Mislukt dit op welke manier dan ook, dan blijft de terugvallijst V
   staan — een lege lijst zou een lege app opleveren, en dat is erger dan een verouderde lijst. */
async function loadVehicles(){ if(!apiOk)return;
  try{ const r=await fetch("/api/vehicles",{cache:"no-store"}); if(!r.ok)return;
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length)return;
    if(!rows.every(x=>x&&typeof x.id==="string"&&x.id))return;
    // In place vervangen, niet herwijzen: V is const en wordt overal bij naam gebruikt.
    V.length=0; rows.forEach(r2=>{ V.push(r2); initVeh(r2); });
  }catch(_){ /* geen backend of onleesbaar antwoord: terugvallijst blijft staan */ }
}
function scheduleSave(){ if(!apiOk||!stateOk)return; clearTimeout(saveT); saveT=setTimeout(()=>{ fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildState())}).catch(()=>{}); },400); }
function match(v){const q=state.q.toLowerCase(); return !q || (v.merk+" "+v.model+" "+v.uitv+" "+v.kenteken+" "+v.id).toLowerCase().includes(q);}

/* ===== Ongedaan maken (undo) ===== */
const history=[];
function pushUndo(label,undoFn){history.push({label,undoFn}); if(history.length>50)history.shift(); updateUndoUI(); showToast(label,true); scheduleSave();}
function undoLast(){ if(!history.length)return; const e=history.pop(); e.undoFn(); updateUndoUI(); rerender(); showToast("Ongedaan gemaakt: "+e.label,false); scheduleSave();}
function updateUndoUI(){const b=document.getElementById("undoBtn"); if(!b)return; if(history.length){b.disabled=false; b.title="Ongedaan maken: "+history[history.length-1].label;} else {b.disabled=true; b.title="Niets om ongedaan te maken";}}
let toastT=null;
function showToast(msg,withUndo){
  let t=document.getElementById("toast"); if(!t){t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);}
  t.innerHTML=`<span>${msg}</span>${withUndo?`<button class="tundo" onclick="undoLast()">Ongedaan maken</button>`:""}<button class="tx" onclick="hideToast()" title="Sluiten">×</button>`;
  t.classList.add("show"); if(toastT)clearTimeout(toastT); toastT=setTimeout(hideToast,6000);
}
function hideToast(){const t=document.getElementById("toast"); if(t)t.classList.remove("show");}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault(); undoLast();}});

/* ===== Activiteitenlog: wie vinkte wat af, en hoelang stond het open ===== */
function ageStr(ts){ if(!ts)return ''; const d=Date.now()-ts; const m=Math.floor(d/60000); if(m<1)return 'net'; if(m<60)return m+' min'; const h=Math.floor(m/60); if(h<24)return h+' u'; return Math.floor(h/24)+' d'; }
function fmtDate(ts){ if(!ts)return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}-${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function logActivity(action,text,vehicleId){ activityLog.push({ts:Date.now(),by:(currentUser&&currentUser.name)||'?',action,text:text||'',vehicleId:vehicleId||null}); if(activityLog.length>2000)activityLog.shift(); }
function isAdmin(){ return currentUser&&currentUser.role==='admin'; }

/* ===== Vandaag ===== */

    if(x.sub){const s=x.sub,v=x.v;
      return `<div class="todo"><span class="tk" style="background:var(--accent)"></span><div class="body" onclick="openVeh('${v.id}')"><div class="act">${s.text} <span class="tag" style="background:var(--amber-soft);color:var(--amber)">Extra</span></div><div class="veh">${v.merk} ${v.model} · ${v.kenteken!=='—'?v.kenteken:v.vin}${ageChip(s.createdAt)}</div></div><select class="assign" onchange="assignSubtask('${v.id}',${s.id},this.value)">${opts}</select></div>`;}

  function personCard(name,list){const disp=name==="_"?"Niet toegewezen":name; const av=name==="_"?`<span class="pav" style="background:var(--slate)">?</span>`:pav(name);
    return `<div class="person-card"><div class="person-head">${av}<span class="pn">${disp}</span><span class="pc">${list.length} ta${list.length===1?'ak':'ken'}</span></div>${list.length?list.map(todoRow).join(""):`<div class="empty" style="padding:16px">Geen open taken</div>`}</div>`;}

  app.innerHTML=`

      : `<div class="card"><div class="empty"><div class="eb">📥</div>Nog geen open taken. Vink onderaan een auto op binnen, of voeg met <b>＋ To-do</b> rechtsboven een losse taak toe.</div></div>`}

      <div class="kpi"><div class="bar" style="background:var(--slate)"></div><div class="lab">Niet toegewezen</div><div class="val">${groups["_"].length}</div><div class="sub">nog niemand op</div></div>
    </div>
    <div class="banner">
      <div class="bi">📋</div>
      <div><div class="bt">Afvinken bij binnenkomst</div>
        <div class="bs">Je weet nog niet precies welke van de verwachte auto's morgen komen — vink ze aan zodra ze er zijn. Elke vink start stap 1 (RDW-foto's) en zet de to-do in gang.</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><h3>Verwacht binnenkort — aanvinken zodra binnen <span class="btn btn-ghost btn-sm" onclick="go('komende')">Alle komende →</span></h3>
      <div class="card-body" style="padding:0 4px">${verwacht.length?komTable(verwacht):`<div class="empty">Alle verwachte auto's zijn aangevinkt.</div>`}</div></div>
  `;

    </tr>`;}).join("")}</tbody></table>`;

function renderKomende(){
  const all=V.filter(v=>match(v));
  // De transportpartijen komen uit de gegevens zelf. Stond hier vast op 13-08 en 14-08; een auto met
  // een andere transportdatum viel toen in géén enkele groep en was daarmee onzichtbaar op deze pagina.
  const partijen=[...new Set(all.filter(v=>v.batch).map(v=>v.batch))].sort((a,b)=>{
    const d=s=>{const m=/^(\d{1,2})-(\d{1,2})/.exec(s||""); return m?Number(m[2])*100+Number(m[1]):9999;};
    return d(a)-d(b)||String(a).localeCompare(String(b));
  });
  const overigImp=all.filter(v=>!v.batch&&v.importAuto), overigNl=all.filter(v=>!v.batch&&!v.importAuto);

  const grp=(title,date,list)=>!list.length?"":`

      <span class="sp gdate">${binnen(list)}/${list.length} binnen</span>

      ${grp("Overig / inruil (NL)","",overigNl)}
    </div>`;
}

/* ===== Lopende ===== */
function catOf(v){const s=steps(v); if(s.currentIdx==null)return null; return s.list[s.currentIdx].cat;}
function renderLopende(){
  const lop=V.filter(v=>v.status==="lopende"&&match(v));
  const allLop=V.filter(v=>v.status==="lopende");
  const perCat=CATS.map(c=>allLop.filter(v=>catOf(v)===c).length);
  const maxc=Math.max(1,...perCat);
  if(!allLop.length){
    app.innerHTML=`<h1 class="page-title">Lopende auto's</h1><p class="page-sub">Auto's die binnen zijn en het traject doorlopen.</p>
      <div class="card"><div class="empty"><div class="eb">📥</div><div style="font-weight:650;color:var(--ink);margin-bottom:4px">Nog geen auto's in traject</div>Zodra de batch van 13-08 binnenkomt, markeer je dat op <b onclick="go('komende')" style="cursor:pointer;color:var(--blue)">Komende</b> of <b onclick="go('vandaag')" style="cursor:pointer;color:var(--blue)">Vandaag</b> — dan verschijnen ze hier met stap 1 (RDW Foto's) open.</div></div>`;
    return;
  }

/* ===== Foto's verkleinen vóór uploaden =====
   Camerafoto's zijn ~6200x4700 (29 megapixel, ~4 MB) terwijl advertentiesites rond de 1600 px tonen.
   Terugschalen naar 2560 px scheelt een factor 7 in opslag én in back-up, zonder dat je op een scherm
   verschil ziet. Het houdt uploads bovendien ruim onder de 30 MB-grens van nginx — daarboven mislukt
   een upload nu stil, want de foutafhandeling in de app slikt dat.
   Gaat er iets mis (onbekend formaat zoals HEIC, geen canvas, te weinig geheugen), dan gaat het
   originele bestand alsnog ongewijzigd naar de server. Verkleinen mag nooit een upload kosten. */
const FOTO_MAX=2560;          /* langste zijde in pixels */
const FOTO_KWALITEIT=0.92;    /* JPEG-kwaliteit */
const FOTO_MIN_BYTES=600*1024;/* kleiner dan dit blijft onaangeroerd */
function leesBestand(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>rej(r.error||new Error('lezen mislukt')); r.readAsDataURL(f); }); }
async function verkleinFoto(f){
  if(!/^image\//.test(f.type||''))return null;      /* geen afbeelding (bv. PDF): niet aankomen */
  if(f.size<FOTO_MIN_BYTES)return null;             /* al klein genoeg */
  if(typeof createImageBitmap!=='function')return null;
  let bron=null,eerst=null;
  try{
    /* imageOrientation:'from-image' — anders komen telefoonfoto's gedraaid binnen, want een canvas
       hercodeert zonder EXIF en daarmee verdwijnt de rotatievlag. */
    try{ eerst=await createImageBitmap(f,{imageOrientation:'from-image'}); }
    catch(_){ eerst=await createImageBitmap(f); }
    const lang=Math.max(eerst.width,eerst.height);
    if(lang<=FOTO_MAX)return null;                  /* afmeting is al goed: niet opnieuw comprimeren */
    const s=FOTO_MAX/lang, dw=Math.max(1,Math.round(eerst.width*s)), dh=Math.max(1,Math.round(eerst.height*s));
    bron=eerst;
    /* Laat de decoder zelf schalen als dat kan: dat scheelt een canvas van 29 megapixel, wat op
       iOS Safari tegen de maximale canvasgrootte aan loopt en dan een leeg beeld oplevert. */
    try{ const g=await createImageBitmap(f,{imageOrientation:'from-image',resizeWidth:dw,resizeHeight:dh,resizeQuality:'high'});
         if(g.width===dw&&g.height===dh){ eerst.close(); eerst=null; bron=g; } else { g.close(); } }catch(_){}
    const cv=document.createElement('canvas'); cv.width=dw; cv.height=dh;
    const ctx=cv.getContext('2d'); if(!ctx)return null;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,dw,dh);  /* PNG met transparantie wordt anders zwart */
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    /* Moest het toch via canvas, dan stapsgewijs halveren: in één keer meer dan 2x verkleinen geeft
       kartelranden op fijne details (grille, velgen, letters op een kentekenbewijs). */
    let src=bron,w=bron.width,h=bron.height;
    while(w>dw*2){
      const nw=Math.max(dw,Math.round(w/2)),nh=Math.max(dh,Math.round(h/2));
      const n=document.createElement('canvas'); n.width=nw; n.height=nh;
      const nc=n.getContext('2d'); if(!nc)return null;
      nc.imageSmoothingEnabled=true; nc.imageSmoothingQuality='high'; nc.drawImage(src,0,0,nw,nh);
      src=n; w=nw; h=nh;
    }
    ctx.drawImage(src,0,0,dw,dh);
    const url=cv.toDataURL('image/jpeg',FOTO_KWALITEIT);
    if(!/^data:image\/jpeg;base64,/.test(url))return null;
    if(url.length*0.75>=f.size)return null;         /* groter geworden: dan is het origineel beter */
    return url;
  }catch(_){ return null; }
  finally{ try{ if(eerst)eerst.close(); }catch(_){} try{ if(bron&&bron!==eerst&&bron.close)bron.close(); }catch(_){} }
}
async function leesFoto(f){ const k=await verkleinFoto(f); return k!==null?k:await leesBestand(f); }
/* ===== Foto's per stap: Voertuig→RDW Foto's, Documentatie→Papieren Foto's ===== */
function grpReqCount(v,g){return g.items.filter(p=>p.req&&v.photos[p.key]).length;}
function grpReqTotal(g){return g.items.filter(p=>p.req).length;}
let photoUp={};
async function setPhotoData(id,key,dataUrl){const v=V.find(x=>x.id===id); if(!v)return; const prev=v.photos[key]; v.photos[key]=dataUrl; if(apiOk)photoUp[id+'|'+key]=1; rerender();
  if(apiOk){ try{ const res=await fetch("/api/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,key,dataUrl})}); if(res.ok){const j=await res.json(); if(j&&j.url)v.photos[key]=j.url;} }catch(_){} delete photoUp[id+'|'+key]; }
  pushUndo(`${v.merk} ${v.model} — foto: ${PHOTO_BY_KEY[key].label}`, ()=>{ if(prev)v.photos[key]=prev; else delete v.photos[key]; });
  rerender();}
async function setPhoto(id,key,input){ const f=input.files&&input.files[0]; input.value=""; if(!f)return; let d=null; try{ d=await leesFoto(f); }catch(_){} if(d)setPhotoData(id,key,d); }
/* Sleep-bak: meerdere foto's tegelijk, dan per stuk naar het juiste vakje slepen */
let photoTray={}; let dragTray=null; let photoTrayLoading={};
async function addToTray(vid,gname,input){ const files=[...input.files]; input.value=""; if(!files.length)return; const k=vid+'|'+gname; if(!photoTray[k])photoTray[k]=[]; let pending=files.length; photoTrayLoading[k]=files.length; rerender();
  /* Eén voor één, niet allemaal tegelijk: een reeks van 29-megapixelfoto's parallel verkleinen kan de
     tab het geheugen uit werken. De teller loopt hoe dan ook af, ook als er één stuk is. */
  for(const f of files){ let d=null; try{ d=await leesFoto(f); }catch(_){}
    if(d)photoTray[k].push(d); if(--pending===0)delete photoTrayLoading[k]; else photoTrayLoading[k]=pending; rerender(); } }
function removeTray(vid,gname,idx){ const k=vid+'|'+gname; if(photoTray[k])photoTray[k].splice(idx,1); rerender(); }
function clearTray(vid,gname){ const k=vid+'|'+gname; const arr=photoTray[k]; if(!arr||!arr.length)return; if(!window.confirm(arr.length+" foto"+(arr.length===1?'':"'s")+" uit de bak weghalen?"))return; photoTray[k]=[]; rerender(); }
function clearGroupPhotos(id,gi){ const v=V.find(x=>x.id===id); if(!v)return; const g=PHOTO_GROUPS[gi]; const filled=g.items.filter(p=>v.photos[p.key]); if(!filled.length)return; if(!window.confirm("Alle "+filled.length+" foto"+(filled.length===1?'':"'s")+" van “"+g.step+"” wissen? Dit kan met Ongedaan worden teruggezet."))return; const prev={}; filled.forEach(p=>{prev[p.key]=v.photos[p.key]; delete v.photos[p.key];}); pushUndo(`${v.merk} ${v.model} — ${g.step}: alle foto's gewist`, ()=>{Object.assign(v.photos,prev);}); rerender(); }
function trayDragStart(ev,vid,gname,idx){ dragTray={k:vid+'|'+gname,idx}; try{ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain','x');}catch(_){} }
function slotDrop(ev,id,key){ ev.preventDefault(); if(!dragTray)return; const arr=photoTray[dragTray.k]; if(!arr)return; const dataUrl=arr[dragTray.idx]; const dt=dragTray; dragTray=null; if(!dataUrl)return; arr.splice(dt.idx,1); setPhotoData(id,key,dataUrl); }
function backToKomend(id){const v=V.find(x=>x.id===id); if(!v)return; const ps=v.status,pk=v.klaar,pr=v.route,pa=v.arrivedAt;
  v.status='komende'; v.klaar=0; v.route=null; v.arrivedAt=null;

/* ===== Auto verwijderen (alleen admin) =====
   De enige onomkeerbare handeling in PVP, vandaar een eigen scherm met de gegevens erin in plaats van

  ov.innerHTML=`<div class="modal">
    <h3>Auto verwijderen <button class="mclose" onclick="sluitVerwijderen()" title="Sluiten">×</button></h3>
    <div class="mb">
      ${waarschuwing?`<div class="waarschuwing"><b>Let op — hier is al aan gewerkt.</b><br>${waarschuwing}</div>`:''}

async function verwijderAuto(id, tochWeg){
  const v=V.find(x=>x.id===id); if(!v)return;
  if(!apiOk){const f=document.getElementById('del-fout'); if(f)f.textContent="Geen verbinding met de server."; return;}
  const knop=document.getElementById('del-ok'); if(knop){knop.disabled=true; knop.textContent="Bezig…";}
  try{
    const r=await fetch("/api/vehicle-del",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id, tochWeg:tochWeg===true})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){ sluitVerwijderen(); vraagVerwijderen(id,true,j.waarschuwing); return; }
    if(!r.ok){ const f=document.getElementById('del-fout'); if(f)f.textContent=j.error||"Verwijderen mislukt."; if(knop){knop.disabled=false; knop.textContent="Definitief verwijderen";} return; }
    // Uit het geheugen halen. De gekoppelde to-do's moeten mee: putState() schrijft die tabel
    // helemaal opnieuw uit wat de frontend stuurt, dus wat hier blijft staan komt zo weer terug.
    const i=V.indexOf(v); if(i>-1)V.splice(i,1);
    for(let k=globalTodos.length-1;k>=0;k--) if(globalTodos[k].vehicleId===id)globalTodos.splice(k,1);
    delete adPhotos[id];
    logActivity('Auto verwijderd', `${j.naam||id} (${v.kenteken&&v.kenteken!=='—'?v.kenteken:v.vin})`, null);
    scheduleSave();
    sluitVerwijderen();
    showToast(j.autoboekRij?`Auto verwijderd — staat nog op rij ${j.autoboekRij} van het Autoboek`:"Auto verwijderd",false);
    go('komende');
  }catch(_){ const f=document.getElementById('del-fout'); if(f)f.textContent="Geen verbinding met de server."; if(knop){knop.disabled=false; knop.textContent="Definitief verwijderen";} }
}

function addSubtask(id){const v=V.find(x=>x.id===id); if(!v)return; const inp=document.getElementById('subin-'+id); if(!inp)return;
  const t=inp.value.trim(); if(!t)return; const st={id:subUid++,text:t,owner:v.owner||null,done:false,createdAt:Date.now()}; v.subtasks.push(st);
  pushUndo(`${v.merk} ${v.model} — extra taak toegevoegd: ${t}`, ()=>{const i=v.subtasks.indexOf(st); if(i>-1)v.subtasks.splice(i,1);});
  rerender();}
function toggleSubtask(id,sid,checked){const v=V.find(x=>x.id===id); if(!v)return; const st=v.subtasks.find(s=>s.id===sid); if(!st)return;
  const pv=st.done, pda=st.doneAt, pdb=st.doneBy; st.done=checked;
  if(checked){ st.doneAt=Date.now(); st.doneBy=(currentUser&&currentUser.name)||'?'; logActivity('Extra taak afgevinkt',`${st.text} (${v.merk} ${v.model})`,id); }
  else { st.doneAt=null; st.doneBy=null; }
  pushUndo(`${v.merk} ${v.model} — extra taak ${checked?'afgevinkt':'heropend'}: ${st.text}`, ()=>{st.done=pv; st.doneAt=pda; st.doneBy=pdb;}); rerender();}
function assignSubtask(id,sid,val){const v=V.find(x=>x.id===id); if(!v)return; const st=v.subtasks.find(s=>s.id===sid); if(!st)return;
  const po=st.owner; st.owner=val||null;
  pushUndo(`${v.merk} ${v.model} — extra taak toegewezen aan ${st.owner||'niemand'}`, ()=>{st.owner=po;}); rerender();}
function delSubtask(id,sid){const v=V.find(x=>x.id===id); if(!v)return; const i=v.subtasks.findIndex(s=>s.id===sid); if(i<0)return; const st=v.subtasks[i];
  v.subtasks.splice(i,1);
  pushUndo(`${v.merk} ${v.model} — extra taak verwijderd: ${st.text}`, ()=>{v.subtasks.splice(i,0,st);}); rerender();}

   Autoboek, en dat liep aantoonbaar uiteen. Zie PVP-autoboek-koppeling-voorstel.md.

   het kenteken als er geen VIN is) staat pas vast als het formulier is ingevuld. */
let nieuweDocs=[];   // [{name,dataUrl}] — in het geheugen tot er een id is

// Datums in PVP zijn tekst in de vorm dd-mm-jjjj. Accepteer wat mensen typen en maak er dat van.
function normDatum(s){
  s=(s||"").trim(); if(!s)return "";
  let m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s);        // 2021-05-20
  if(m)return `${String(m[3]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}-${m[1]}`;
  m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s);          // 20-5-2021 / 20/05/21
  if(m){const j=m[3].length===2?"20"+m[3]:m[3]; return `${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}-${j}`;}
  return s;   // niet herkend: laten staan, de gebruiker ziet het zelf terug
}

/* ===== Stukken laten uitlezen =====

   storing maar een signaal — dan mist die informatie in de aangeleverde stukken. */
const UITLEES_VELDEN=[["vin","na-vin"],["kenteken","na-kenteken"],["merk","na-merk"],["model","na-model"],
  ["uitv","na-uitv"],["kleur","na-kleur"],["brandstof","na-brandstof"],["transm","na-transm"],
  ["reg","na-reg"],["km","na-km"],["inkoopdatum","na-inkoopdatum"],["factuurnr","na-factuurnr"],
  ["inkoopprijs","na-inkoopprijs"],["note","na-note"]];

  brandstof:"Brandstof",transm:"Transmissie",reg:"1e toelating",km:"Km-stand",inkoopdatum:"Datum inkoop",
  factuurnr:"Factuurnummer",inkoopprijs:"Inkoopprijs",note:"Notitie",lev:"Leverancier",batch:"Transportdatum"};

const ALTIJD_ZELF=["lev","batch"];
let uitleesBezig=false;
async function autoUitlezen(){
  if(!nieuweDocs.length){showToast("Voeg eerst documenten toe",false);return;}
  if(uitleesBezig)return;                       // twee keer tegelijk kost dubbel en levert niets extra's
  const vak=document.getElementById('na-uitlees'); if(!vak)return;
  uitleesBezig=true;
  vak.innerHTML=`<div class="muted" style="font-size:12.5px">Stukken lezen… (dit duurt 5 tot 20 seconden)</div>`;

    const r=await fetch("/api/uitlezen",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({docs:nieuweDocs.map(d=>({name:d.name,dataUrl:d.dataUrl}))})});

      const c=document.getElementById('na-import'); if(c){c.checked=j.velden.importAuto; c.dataset.hand="1";}
    }
    leeg.push(...ALTIJD_ZELF);
    const bron=v=>(j.bronnen&&j.bronnen[v])?` <span class="muted" style="font-weight:400">(${j.bronnen[v]})</span>`:'';
    vak.innerHTML=`
      <div style="font-size:12.5px;line-height:1.7">
        <div style="color:#1a7f37;font-weight:650">✓ ${gevuld.length} veld(en) ingevuld uit ${j.gebruikt.length} stuk(ken)</div>
        ${gevuld.length?`<div class="muted">${gevuld.map(v=>`${UITLEES_NAMEN[v]||v}${bron(v)}`).join(' · ')}</div>`:''}
        ${j.onzeker&&j.onzeker.length?`<div style="color:#b26a00;margin-top:5px"><b>Nakijken:</b> ${j.onzeker.map(v=>UITLEES_NAMEN[v]||v).join(', ')} — de stukken spreken elkaar tegen</div>`:''}
        ${leeg.length?`<div style="color:#c0392b;margin-top:5px"><b>Niet gevonden:</b> ${leeg.map(v=>UITLEES_NAMEN[v]||v).join(', ')} — vul zelf aan of voeg een document toe</div>`:''}
        ${j.overgeslagen&&j.overgeslagen.length?`<div class="muted" style="margin-top:5px">Overgeslagen: ${j.overgeslagen.join(', ')}</div>`:''}
        ${j.verbruik?`<div class="muted" style="margin-top:5px;font-size:11.5px">${j.verbruik.in.toLocaleString('nl-NL')} tokens gelezen · circa ${(j.verbruik.in*3/1e6+j.verbruik.uit*15/1e6).toFixed(2).replace('.',',')} dollar</div>`:''}
      </div>`;
  }catch(_){ vak.innerHTML=`<div class="fout">Geen verbinding met de server.</div>`; }
  finally{ uitleesBezig=false; }
}

async function opslaanAuto(){
  const w=id=>{const e=document.getElementById(id); return e?e.value.trim():"";};
  const fout=document.getElementById('na-fout');
  const body={
    vin:w('na-vin'), kenteken:w('na-kenteken'), merk:w('na-merk'), model:w('na-model'), uitv:w('na-uitv'),
    kleur:w('na-kleur'), brandstof:w('na-brandstof'), transm:w('na-transm'), reg:normDatum(w('na-reg')),
    km:w('na-km'), lev:w('na-lev'), inkoopdatum:normDatum(w('na-inkoopdatum')), batch:w('na-batch'),
    note:w('na-note'), factuurnr:w('na-factuurnr'), inkoopprijs:w('na-inkoopprijs'),
    importAuto:!!(document.getElementById('na-import')||{}).checked
  };
  if(!body.vin&&!body.kenteken){fout.textContent="Vul een VIN of een kenteken in — daar hangt de auto aan vast."; return;}
  if(!apiOk){fout.textContent="Geen verbinding met de server; toevoegen kan nu niet."; return;}
  const knop=document.getElementById('na-opslaan'); knop.disabled=true; knop.textContent="Bezig…"; fout.textContent="";
  try{
    const r=await fetch("/api/vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409){fout.textContent="Deze auto staat al in PVP."; knop.disabled=false; knop.textContent="Toevoegen »"; return;}
    if(!r.ok){fout.textContent="Opslaan mislukt — probeer het opnieuw."; knop.disabled=false; knop.textContent="Toevoegen »"; return;}
    const antwoord=await r.json(); const id=antwoord.id;
    let mislukt=0;
    for(const d of nieuweDocs){
      try{ const u=await fetch("/api/vehicledoc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,dataUrl:d.dataUrl,name:d.name})}); if(!u.ok)mislukt++; }
      catch(_){ mislukt++; }
    }
    // Opnieuw inlezen in dezelfde volgorde als bij het opstarten: eerst de catalogus, dan de voortgang.
    // loadVehicles() zet de runtime-velden terug op leeg, dus loadState() moet er direct achteraan.
    await loadVehicles(); await loadState();
    logActivity('Auto toegevoegd',[body.merk,body.model].filter(Boolean).join(' ')||id,id);
    scheduleSave();   // logActivity zet het alleen in het geheugen; dit stuurt het naar de server
    closeAutoModal();
    const ab=antwoord.autoboek||{};
    const staart = mislukt ? ` — ${mislukt} document(en) niet geüpload`
                 : ab.status==='ok'   ? " — ook in het Autoboek gezet ✓"
                 : ab.status==='fout' ? " — nog NIET in het Autoboek, zie de auto zelf"
                 : "";
    showToast("Auto toegevoegd"+staart,false);
    go('komende');
  }catch(_){
    fout.textContent="Geen verbinding met de server."; knop.disabled=false; knop.textContent="Toevoegen »";
  }
}

function entriesFromDrop(dt){ return new Promise(resolve=>{ const items=dt.items; if(!items||!items.length||!(items[0].webkitGetAsEntry)){ return resolve([...(dt.files||[])]); }
  const files=[]; let pending=0, done=false;
  const check=()=>{ if(done&&pending===0)resolve(files); };
  const read=entry=>{ if(!entry)return; if(entry.isFile){ pending++; entry.file(f=>{ files.push(f); pending--; check(); }, ()=>{ pending--; check(); }); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const batch=()=>{ pending++; rd.readEntries(ents=>{ pending--; if(ents.length){ ents.forEach(read); batch(); } check(); }, ()=>{ pending--; check(); }); }; batch(); } };
  for(const it of items){ const en=it.webkitGetAsEntry&&it.webkitGetAsEntry(); if(en)read(en); else { const f=it.getAsFile&&it.getAsFile(); if(f)files.push(f); } }
  done=true; check();
});}

  showToast("ZIP maken… ("+arr.length+" foto’s)",false);
  const zip=new JSZip(); const folder=zip.folder(base);
  for(let i=0;i<arr.length;i++){ try{ const r=await fetch(arr[i]); const b=await r.blob(); const ext=(arr[i].split('.').pop()||'jpg').split('?')[0]; folder.file('foto_'+String(i+1).padStart(2,'0')+'.'+ext,b); }catch(_){}}
  const blob=await zip.generateAsync({type:'blob'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=base+'-advertentiefotos.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function delAdPhoto(id,url){ const arr=adList(id).filter(u=>u!==url); adPhotos[id]=arr; adSelSet(id).delete(url);
  if(apiOk){ try{ await fetch("/api/adphotos-set",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,urls:arr})}); }catch(_){}}
  rerenderCurrent(); }
function adGallery(id){ const arr=adList(id); const sel=adSelSet(id); const up=adUp[id]; const selCount=[...sel].filter(u=>arr.includes(u)).length;
  const tiles=arr.map((url,idx)=>{const on=sel.has(url); return `<div class="adtile${on?' sel':''}"><img src="${url}" alt="foto ${idx+1}"><label class="adcheck" title="Selecteren" onclick="event.stopPropagation()"><input type="checkbox" ${on?'checked':''} onchange="toggleAdSel('${id}','${url}',this.checked)"><span class="adcbox"></span></label><a class="addl" href="${url}" target="_blank" download title="Downloaden">⭳</a><button class="premove" title="Verwijderen" onclick="delAdPhoto('${id}','${url}')">×</button></div>`;}).join("");
  const addTile=`<label class="adtile adadd"><input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="addAdPhoto('${id}',this)"><span class="pcam">📷</span><span class="padd">Foto's</span></label>`;
  const progress = up? `<div class="aduploading" id="adprog-${id}"><span class="spin"></span><span>Bezig met uploaden… <b>${up.done}/${up.total}</b> — even wachten, niet nogmaals uploaden.</span></div>` : '';
  const selBar = arr.length? `<div class="adselbar">
        <button class="btn btn-ghost btn-sm" onclick="adSelAll('${id}')">Selecteer alles (${arr.length})</button>
        ${selCount?`<button class="btn btn-ghost btn-sm" onclick="adSelNone('${id}')">Selectie wissen</button>`:''}
        ${selCount?`<button class="btn btn-danger btn-sm" onclick="delAdSelected('${id}')">🗑 Verwijder selectie (${selCount})</button>`:''}
        <span style="flex:1"></span>
        <button class="btn btn-danger-o btn-sm" title="Verwijder alle foto's van deze auto" onclick="delAllAd('${id}')">Alles verwijderen (${arr.length})</button>
      </div>` : '';
  return `<div class="addrop" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="this.classList.remove('drag');dropAd('${id}',event)">
      ${progress}${selBar}
      <div class="adgrid">${tiles}${addTile}</div>
      <div class="adtools">
        <label class="btn btn-ghost btn-sm" title="Kies een hele map; alle foto's erin worden geüpload"><input type="file" webkitdirectory directory multiple style="display:none" onchange="addAdPhoto('${id}',this)">📁 Hele map uploaden</label>
        ${arr.length?`<button class="btn btn-primary btn-sm" onclick="downloadAllAd('${id}')">⭳ Download alle (${arr.length})</button>`:''}
        <span class="note" style="margin:0">of sleep foto's/map hierheen</span>
      </div></div>`;
}
function adGalleryCard(v){ const n=adList(v.id).length;
  return `<div class="card"><h3>Advertentiefoto's <span class="muted" style="font-weight:500;font-size:12.5px">${n} foto${n===1?'':'’s'}</span></h3>
    <div class="card-body">${adGallery(v.id)}
      ${n?`<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="copyAdLinks('${v.id}')">Kopieer links voor advertentie</button>`:''}
      <div class="note" style="margin-top:8px">De fotograaf zet hier de advertentiefoto's; de advertentieagent gebruikt ze voor de Mobilox-advertentie.</div></div></div>`;
}
function copyAdLinks(id){ const links=adList(id).map(u=>location.origin+u).join("\n"); if(navigator.clipboard)navigator.clipboard.writeText(links).catch(()=>{}); showToast("Links gekopieerd ("+adList(id).length+" foto’s)",false); }

/* ===== Fotograaf-weergave ===== */
function renderFoto(){ if(fotoState.car)renderFotoCar(); else renderFotoList(); syncHistory(); }
function renderFotoList(){
  const lop=V.filter(v=>v.status==="lopende");
  const rows=lop.length? lop.map(v=>{ const n=adList(v.id).length;
    return `<div class="fotocar" onclick="openFotoCar('${v.id}')"><div class="thumb">${carIcon()}</div>
      <div style="flex:1;min-width:0"><div class="nm">${v.merk} ${v.model}</div><div class="id">${v.kenteken!=='—'?v.kenteken:v.vin}</div></div>
      <div class="fotocount ${n?'has':''}">${n?`${n} foto${n===1?'':'’s'}`:'nog geen'}</div><span style="color:var(--muted);font-size:20px">›</span></div>`;
  }).join("") : `<div class="empty"><div class="eb">📷</div>Er staan nog geen auto's binnen om te fotograferen.</div>`;
  app.innerHTML=`<h1 class="page-title">Te fotograferen</h1><p class="page-sub">Kies een auto en voeg de advertentiefoto's toe. Ze worden direct bewaard.</p>
    <div class="card"><div style="padding:4px">${rows}</div></div>`;
}
function openFotoCar(id){ fotoState.car=id; renderFoto(); window.scrollTo(0,0); }
function fotoBack(){ fotoState.car=null; renderFoto(); window.scrollTo(0,0); }
function renderFotoCar(){ const v=V.find(x=>x.id===fotoState.car); if(!v){fotoState.car=null;return renderFotoList();}
  const n=adList(v.id).length;
  app.innerHTML=`<div class="back" onclick="fotoBack()">← Alle auto's</div>
    <div class="det-head"><div class="hero"><svg width="64" height="40" viewBox="0 0 24 24" fill="#aebfce">${carIcon().replace('width="20" height="13"','')}</svg></div>
      <div class="det-title" style="flex:1;min-width:260px"><h1>${v.merk} ${v.model}</h1><div class="sub">${v.uitv||''}</div>
        <div class="chips"><span class="chip"><b>Kenteken</b> ${v.kenteken}</span><span class="chip"><b>VIN</b> <span class="mono">${v.vin}</span></span><span class="chip"><b>Km</b> ${km(v.km)}</span></div></div></div>
    <div class="card"><h3>Advertentiefoto's <span class="muted" style="font-weight:500;font-size:12.5px">${n} foto${n===1?'':'’s'}</span></h3>
      <div class="card-body">${adGallery(v.id)}<div class="note" style="margin-top:10px">Maak of kies de foto's voor deze auto. Ze worden direct op de server bewaard.</div></div></div>`;
  window.scrollTo(0,0);
}

/* ===== Login & rollen ===== */
function renderLogin(err){
  app.innerHTML=`<div class="loginwrap"><div class="logincard">
    <div class="loginhead"><svg width="34" height="38" viewBox="0 0 60 68" aria-label="Prieva"><path d="M30 2.5 L53.9 16.3 V43.7 L30 57.5 L6.1 43.7 V16.3 Z" fill="#16232b"/><path d="M30 14.5 L43.2 22.1 V37.3 L30 44.9 L16.8 37.3 V22.1 Z" fill="#0d9ebf"/><circle cx="30" cy="29.7" r="4.3" fill="#ffffff"/></svg>
      <div class="lt">PRIEVA<small>VEHICLE PLATFORM</small></div></div>
    <div class="loginbody">
      <label>Gebruikersnaam</label><input id="lg-user" type="text" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label>Wachtwoord</label><input id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      ${err?`<div class="loginerr">${err}</div>`:''}
      <button class="btn btn-primary" style="width:100%;margin-top:16px;justify-content:center" onclick="doLogin()">Inloggen »</button>
    </div></div></div>`;
  setTimeout(()=>{const el=document.getElementById('lg-user'); if(el)el.focus();},40);
}
async function doLogin(){ const uu=document.getElementById('lg-user'), pp=document.getElementById('lg-pass'); if(!uu||!pp)return;
  const u=uu.value.trim(), p=pp.value; if(!u||!p){renderLogin('Vul gebruikersnaam en wachtwoord in.');return;}
  try{ const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    if(r.ok){ const j=await r.json(); currentUser={name:j.name,role:j.role}; kanUitlezen=!!j.uitlezen; apiOk=true; startFor(); }
    else { renderLogin('Onjuiste gebruikersnaam of wachtwoord.'); }
  }catch(_){ renderLogin('Kan de server niet bereiken.'); }
}
async function logout(){ try{ await fetch("/api/logout",{method:"POST"}); }catch(_){} currentUser=null; location.reload(); }
async function loadStatusFoto(){ if(!apiOk)return; try{ const r=await fetch("/api/status",{cache:"no-store"}); if(r.ok){ const s=await r.json(); if(s&&s.vehicles){ V.forEach(v=>{ const d=s.vehicles[v.id]; if(d&&d.status)v.status=d.status; }); } } }catch(_){} }
async function startFor(){
  // Eerst de catalogus, dan pas de rest: loadState/loadTaxState/loadStatusFoto mappen hun gegevens op
  // bestaande rijen in V, dus een auto die er nog niet in staat zou zijn voortgang verliezen.
  // Boven de rolsplitsing, want alle drie de rollen gebruiken V.
  await loadVehicles();
  const foto=currentUser.role==='foto';
  const tax=currentUser.role==='taxateur';
  const restricted=foto||tax;
  const el=id=>document.getElementById(id);
  if(el('nav'))el('nav').style.display=restricted?'none':'';
  const sc=document.querySelector('.search'); if(sc)sc.style.display=restricted?'none':'';
  if(el('addTodoBtn'))el('addTodoBtn').style.display=restricted?'none':'';
  if(el('addCarBtn'))el('addCarBtn').style.display=restricted?'none':'';
  if(el('undoBtn'))el('undoBtn').style.display=restricted?'none':'';
  if(el('logoutBtn'))el('logoutBtn').style.display='';
  if(el('logboekBtn'))el('logboekBtn').style.display=(currentUser.role==='admin')?'':'none';
  const av=document.querySelector('.avatar'); if(av)av.textContent=(currentUser.name||'?').slice(0,2).toUpperCase();
  const db=document.querySelector('.demo-bar');
  if(db&&foto)db.textContent=(currentUser.name||'Fotograaf')+' · voeg per auto de advertentiefoto’s toe';
  if(db&&tax)db.textContent=(currentUser.name||'S-TAX')+' · auto’s op taxatie · bekijk foto’s en upload het BPM-rapport';
  if(foto){ state.view='foto'; loadAdphotos().then(loadStatusFoto).then(renderFoto); }
  else if(tax){ state.view='tax'; loadTaxState().then(loadBpm).then(renderTax); }
  else { Promise.all([loadState(),loadAdphotos(),loadBpm()]).then(()=>go('vandaag')); }
}
async function boot(){
  try{ const r=await fetch("/api/me",{cache:"no-store"});
    if(r.ok){ currentUser=await r.json(); kanUitlezen=!!currentUser.uitlezen; apiOk=true; startFor(); return; }
    if(r.status===401){ apiOk=true; renderLogin(); return; }
  }catch(_){ /* geen backend bereikbaar → demo/standalone */ }
  currentUser={name:'Demo',role:'team'}; apiOk=false; startFor();
}
function rerender(){
  if(state.view==="vandaag")renderVandaag();
  else if(state.view==="komende")renderKomende();
  else if(state.view==="lopende")renderLopende();
  else if(state.view==="logboek")renderLog();
  else if(state.view.startsWith("veh:"))openVeh(state.view.split(":")[1]);
  updateUndoUI(); syncHistory();
}
function setNav(view){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));}
function go(view){state.view=view; if(["vandaag","komende","lopende","logboek"].includes(view))setNav(view); rerender(); window.scrollTo(0,0);}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value; if(state.view.startsWith("veh:"))go("komende"); else rerender(); document.getElementById("search").focus();});
/* ===== In-app navigatie: browser terug/vooruit blijft binnen PVP ===== */
let lastRouteKey=null, popping=false;
function routeKey(){ if(currentUser&&currentUser.role==='foto')return 'foto:'+(fotoState.car||''); if(currentUser&&currentUser.role==='taxateur')return 'tax:'+(taxState.car||''); return state.view; }
function syncHistory(){ if(popping)return; const k=routeKey(); if(k===lastRouteKey)return; const first=lastRouteKey===null; lastRouteKey=k; try{ window.history[first?'replaceState':'pushState']({k},''); }catch(_){} }
function applyRoute(k){
  if(currentUser&&currentUser.role==='foto'){ fotoState.car=(k&&k.indexOf('foto:')===0)?(k.slice(5)||null):null; renderFoto(); }
  else if(currentUser&&currentUser.role==='taxateur'){ taxState.car=(k&&k.indexOf('tax:')===0)?(k.slice(4)||null):null; renderTax(); }
  else if(!k||["vandaag","komende","lopende","logboek"].includes(k)){ state.view=k||'vandaag'; setNav(state.view); rerender(); window.scrollTo(0,0); }
  else if(k.indexOf('veh:')===0){ state.view=k; openVeh(k.split(':')[1]); }
  else { state.view='vandaag'; rerender(); }
  lastRouteKey=routeKey();
}
window.addEventListener('popstate',e=>{ popping=true; try{ applyRoute(e.state&&e.state.k); }finally{ popping=false; } });
boot();
</script>
