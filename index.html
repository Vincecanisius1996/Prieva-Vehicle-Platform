<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Prieva Vehicle Platform",
  "schemaVersion": 1,
  "description": "Klikbaar prototype van het interne Prieva Vehicle Platform (PVP): dashboard met KPI's en pijplijn, voorraadoverzicht met filters op Komende/Lopende/Verkocht en zoeken, plus een per-voertuig PVP-hub met specs, uitrusting, foto's, documenten (Vehicle Details, schaderapport, inkoopfactuur), statustijdlijn en financiën/marge. Voorbeelddata gebaseerd op echte Prieva-voertuigen.",
  "mcpTools": [],
  "mcpServerNames": []
}
</script>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Prieva Vehicle Platform — Komende auto's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    /* PRIEVA huisstijl: blauwverloop #0D9EBF → #056A7F, zwart woordmerk, Montserrat */
    --brand:#0d9ebf; --brand-2:#056a7f;
    --navy:#12333d; --navy-2:#0b2830; --ink:#16232b; --muted:#617a86;
    --line:#e2e9ed; --bg:#f3f8fa; --card:#ffffff; --accent:#0d9ebf; --brand-text:#0081a2; --radius:12px;
    --green:#1c8758; --green-soft:#e4f4ec; --blue:#056a7f; --blue-soft:#e1f1f5;
    --amber:#a86809; --amber-soft:#fbf0dc; --red:#c0392b; --red-soft:#fdecec;
    --slate:#5b6b7b; --slate-soft:#eef2f6;
    --shadow:0 1px 2px rgba(9,50,63,.06),0 8px 24px rgba(9,50,63,.08);
    --leonie:#7c3aed; --sjoerd:#0f9488; --vince:#475569; --floris:#2563eb;
  }
  *{box-sizing:border-box}
  body{margin:0;line-height:1.5;font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .demo-bar{background:var(--blue-soft);color:var(--brand-2);text-align:center;font-size:12px;padding:6px 12px;font-weight:600;border-bottom:1px solid #cfe6ec}
  header.top{background:linear-gradient(120deg,var(--brand-2),var(--brand));color:#fff;padding:0 22px;display:flex;align-items:center;gap:22px;height:62px;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(5,106,127,.3)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:1.5px}
  .logo{width:30px;height:34px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.22))}
  .brand small{display:block;font-size:11px;font-weight:600;color:#d3edf3;letter-spacing:1.4px;margin-top:1px}
  nav.main{display:flex;gap:4px;margin-left:6px}
  nav.main button{background:transparent;border:0;color:#e3f4f8;font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s;text-transform:uppercase;letter-spacing:.6px}
  nav.main button:hover{background:rgba(255,255,255,.09);color:#fff}
  nav.main button.active{background:rgba(255,255,255,.16);color:#fff}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .search{position:relative}
  .search input{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;padding:8px 12px 8px 32px;font-size:13px;width:200px;outline:none}
  .search input::placeholder{color:#a9c4dc}
  .search svg{position:absolute;left:10px;top:9px;opacity:.7}
  .avatar{width:34px;height:34px;border-radius:50%;background:#2c5a80;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.2)}
  main{max-width:1160px;margin:0 auto;padding:24px 22px 70px}
  .page-title{font-size:21px;font-weight:800;margin:0 0 3px;letter-spacing:.4px;text-transform:uppercase}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 20px;max-width:78ch}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .kpi .val{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:1px}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card h3{margin:0;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-body{padding:14px 18px}

  .banner{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--radius);margin-bottom:20px;border:1px solid #c5dcef;background:linear-gradient(180deg,#f2f8fd,#e9f2fb)}
  .banner .bi{width:42px;height:42px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:21px;flex:none;box-shadow:0 3px 10px rgba(43,108,176,.35)}
  .banner .bt{font-weight:700;font-size:16px} .banner .bs{font-size:13px;color:var(--muted);margin-top:2px}
  .ico{vertical-align:-3px;flex:none}
  :focus-visible{outline:2px solid var(--brand-text);outline-offset:2px;border-radius:6px}
  .btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
  .btn{border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}
  .btn-primary{background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 2px 8px rgba(13,158,191,.35)} .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--navy)} .btn-ghost:hover{background:#f2f6fa}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:10px}
  /* Vingerbediening: de fotograaf werkt op een telefoon. 44px is de gangbare ondergrens; met een
     muis blijft alles zoals het was. */
  @media (pointer:coarse){
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
    .btn-sm{min-height:40px}
    .premove,.pdl,.addl,.dx,.mclose{min-width:34px;min-height:34px}
    .chk{min-width:44px;min-height:44px}
  }
  .banner .sp{margin-left:auto;display:flex;gap:8px}

  .groupwrap{display:flex;flex-direction:column;gap:18px}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .grp-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
  .grp-head .gt{font-weight:700;font-size:16px}
  .grp-head .gcount{font-size:12px;background:var(--slate-soft);color:var(--slate);padding:2px 9px;border-radius:999px;font-weight:700}
  .grp-head .gdate{font-size:12px;color:var(--muted);font-weight:600}
  .grp-head .sp{margin-left:auto}
  .grp-head.batch{background:linear-gradient(180deg,#eef6ff,#e6f0fa)}
  .grp-head.batch .gt{color:var(--navy)}

  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
  tbody tr{transition:background .12s} tbody tr:hover{background:#f7fafd} tbody tr:last-child td{border-bottom:0}
  /* Spiegel van het Autoboek: kolom E t/m P naast elkaar. Dertien kolommen passen op geen enkel
     scherm, dus de pagina mag breder én de tabel scrolt binnen zijn eigen kader — nooit de pagina
     zelf, want dan raak je de navigatie kwijt. */
  main.breed{max-width:1680px}
  /* De tabel moet in één keer passen: geen horizontaal schuiven. Daarom table-layout:fixed met
     vaste kolombreedtes, en waarden die AFBREKEN in plaats van afgekapt worden — een tekst met
     een beletselteken erachter is net zo goed onzichtbaar. De wrap blijft als vangnet staan voor
     een heel smal scherm; op een laptop komt hij niet in beeld. */
  .tabelwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.boek{table-layout:fixed;width:100%}
  table.boek thead th{padding:8px 9px;font-size:10px;letter-spacing:.3px}
  table.boek tbody td{padding:7px 9px;font-size:12px;line-height:1.35;white-space:normal;vertical-align:top;overflow-wrap:anywhere}
  table.boek .mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:-.3px}
  table.boek .num{text-align:right;font-variant-numeric:tabular-nums}
  table.boek .leeg{color:var(--muted)}
  /* Klikbare kolomkop om op te sorteren. Het pijltje staat er ALTIJD, ook ongesorteerd — anders
     ziet niemand dat er iets te klikken valt, en dan is de functie er wel maar bestaat hij niet. */
  table.boek thead th.sorteerkop{cursor:pointer;user-select:none;white-space:nowrap}
  table.boek thead th.sorteerkop:hover{color:var(--blue)}
  table.boek thead th.sorteerkop.aan{color:var(--blue)}
  .sorteerpijl{margin-left:4px;font-size:9px;opacity:.4}
  .sorteerkop.aan .sorteerpijl{opacity:1}
  .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .filterbar .fl{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .fchip{font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;white-space:nowrap}
  .fchip:hover{border-color:var(--rand-sterk,var(--blue));color:var(--ink)}
  .fchip.aan{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
  .fchip .n{opacity:.65;font-weight:700;margin-left:5px}
  .veh-cell{display:flex;align-items:center;gap:11px;cursor:pointer}
  .thumb{width:44px;height:33px;border-radius:6px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f8,#dde6ef);border:1px solid var(--line);color:#8aa0b4}
  .veh-cell .nm{font-weight:600;font-size:13px} .veh-cell .id{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--slate-soft);color:var(--slate)}
  .tag-imp{background:var(--blue-soft);color:var(--blue)} .tag-nl{background:var(--slate-soft);color:var(--slate)}
  .note{font-size:11px;color:var(--muted)}
  .agechip{display:inline-block;font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:999px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .b-komende{background:var(--blue-soft);color:var(--blue)} .b-lopende{background:var(--green-soft);color:var(--green)}
  .b-gemeld{background:var(--amber-soft);color:var(--amber)}
  .segbar{display:flex;gap:3px;align-items:center}
  .seg{width:14px;height:8px;border-radius:6px;background:var(--slate-soft)}
  .seg.done{background:var(--green)} .seg.current{background:var(--blue)} .seg.todo{background:#cdd8e2} .seg.nvt{background:#eef2f6}
  .phase-lab{font-size:12px;font-weight:600}
  .funnel{display:flex;flex-direction:column;gap:8px}
  .fn{display:flex;align-items:center;gap:12px}
  .fn .fl{width:150px;font-size:12px;color:var(--ink);font-weight:600;flex:none}
  .fn .track{flex:1;height:22px;background:var(--slate-soft);border-radius:6px;overflow:hidden}
  .fn .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy-2));border-radius:6px;display:flex;align-items:center;justify-content:flex-end;color:#fff;font-size:11px;font-weight:700;padding-right:7px;min-width:22px}
  .fn .fc{width:26px;text-align:right;font-weight:700;font-size:13px;flex:none}
  /* Eindstand onder de stappen: geen fase meer, dus met een scheiding en in het groen van de
     Verkoopklaar-badge, zodat je meteen ziet dat het geen knelpunt is maar afgerond werk. */
  .fn-eind{margin-top:5px;padding-top:11px;border-top:1px dashed var(--line)}
  .fn-eind .fl{color:var(--green)} .fn-eind .fc{color:var(--green)}
  .fn-eind .fill{background:linear-gradient(90deg,#2aa06b,var(--green))}
  .fn-gemeld .fl{color:var(--amber)} .fn-gemeld .fc{color:var(--amber)}
  .fn-gemeld .fill{background:linear-gradient(90deg,#d99420,var(--amber))}
  .cols{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .person-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .person-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .pav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
  .person-head .pn{font-weight:700;font-size:14px} .person-head .pc{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .todo{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0} .todo:hover{background:#f7fafd}
  .todo .tk{width:8px;height:8px;border-radius:50%;flex:none;background:var(--blue)}
  .todo .body{min-width:0;flex:1;cursor:pointer} .todo .act{font-weight:600;font-size:13px}
  .todo .veh{font-size:12px;color:var(--muted)}
  select.assign{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;background:#fff;color:var(--ink);cursor:pointer}
  .chk{display:inline-flex;cursor:pointer;position:relative;align-items:center}
  .chk input{position:absolute;opacity:0;width:0;height:0}
  .chk .box{width:24px;height:24px;border-radius:6px;border:2px solid #cdd8e2;background:#fff;display:grid;place-items:center;transition:.15s}
  .chk .box:after{content:"✓";color:#fff;font-size:16px;font-weight:800;opacity:0;transform:scale(.5);transition:.15s;line-height:1}
  .chk input:checked + .box{background:var(--green);border-color:var(--green)}
  .chk input:checked + .box:after{opacity:1;transform:scale(1)}
  .chk:hover .box{border-color:var(--green)}
  tr.row-arrived{background:#f3fbf6} tr.row-arrived:hover{background:#eaf7f0}
  .arr-lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green)}
  .pbar{height:8px;border-radius:6px;background:var(--slate-soft);overflow:hidden}
  .pfill{height:100%;background:linear-gradient(90deg,var(--green),#2fae74);border-radius:6px}
  .need{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:1px 7px;border-radius:999px}
  .route-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .rbg-ja{background:var(--green-soft);color:var(--green)} .rbg-nee{background:var(--blue-soft);color:var(--blue)}
  .tstep{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line)}
  .tstep:last-child{border-bottom:0}
  .tstep .h{font-weight:600;font-size:13px}
  .tstep.todo .h{color:var(--muted);font-weight:600}
  .tstep.current .h{color:var(--navy)}
  .tstep .d{font-size:12px;color:var(--muted)}
  .tnum{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;border:2px solid #eddcb8;background:var(--amber-soft);color:var(--amber)}
  .tnum.done{background:var(--green);border-color:var(--green);color:#fff}
  .route-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .rb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 13px;font-weight:700;font-size:12px;cursor:pointer;transition:.12s}
  .rb.ja{border-color:#bfe6d1;color:var(--green)} .rb.ja:hover{background:var(--green-soft)}
  .rb.nee{border-color:#cfe0f1;color:var(--blue)} .rb.nee:hover{background:var(--blue-soft)}
  .rb.active-ja{background:var(--green);color:#fff;border-color:var(--green)}
  .rb.active-nee{background:var(--blue);color:#fff;border-color:var(--blue)}
  .undo-btn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .undo-btn:hover:not(:disabled){background:rgba(255,255,255,.24)}
  .undo-btn:disabled{opacity:.4;cursor:default}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 14px 11px 16px;border-radius:10px;box-shadow:0 8px 30px rgba(15,47,76,.4);display:flex;align-items:center;gap:14px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:92vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast .tundo{background:var(--accent);border:0;color:#fff;font-weight:700;font-size:12px;padding:6px 11px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .toast .tx{background:transparent;border:0;color:#c4d6e6;font-size:18px;cursor:pointer;line-height:1;padding:0 2px}
  .empty{padding:38px;text-align:center;color:var(--muted)}
  .empty .eb{font-size:26px;margin-bottom:8px;opacity:.5}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:13px;cursor:pointer;margin-bottom:14px}
  .det-head{display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
  .hero{width:250px;height:170px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#e8eef4,#d3deea);border:1px solid var(--line);color:#8aa0b4}
  .det-title h1{margin:0 0 4px;font-size:26px;letter-spacing:-.3px}
  .det-title .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12px;font-weight:600}
  .chip b{color:var(--muted);font-weight:600}
  .det-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .spec{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .spec .k{color:var(--muted);font-size:13px} .spec .v{font-weight:600;font-size:13px;text-align:right}
  .plist{padding:2px 0}
  .pstep{display:flex;gap:12px;align-items:flex-start}
  .pstep .rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
  .pstep .pt{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--muted)}
  .pstep.done .pt{background:var(--green);border-color:var(--green);color:#fff}
  .pstep.current .pt{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 0 4px var(--blue-soft)}
  .pstep.nvt .pt{background:#f4f7fa;border-color:#e3e9ef;color:#c2ccd6}
  .pstep .ln{width:2px;flex:1;background:var(--line);margin:2px 0}
  .pstep.done .ln{background:var(--green)}
  .pstep .ct{padding-bottom:14px;flex:1}
  .pstep .h{font-weight:600;font-size:13px} .pstep.nvt .h{color:var(--muted);font-weight:500}
  .pstep .d{font-size:12px;color:var(--muted)}
  .owner-box{display:flex;align-items:center;gap:10px;padding:12px 16px}
  .infobar{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:10px;font-size:13px;margin-top:4px;background:var(--blue-soft);border:1px solid #c5dcef;color:#215883}

const inkoopSleutel = v => { const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(v.inkoopdatum||""); return m?Number(m[3]+m[2]+m[1]):0; };
const nieuwsteEerst = (a,b) => inkoopSleutel(b)-inkoopSleutel(a) || String(a.merk||"").localeCompare(String(b.merk||""));
/* In welke fase staat een auto. Eén definitie, want de filterchips en het sorteren moeten het over

   krijgen daarom een eigen sleutel. */
const faseVan = v => { const a=currentAction(v); return a?a.cat:(v.status==='lopende'?'__klaar':'__gemeld'); };
/* Sorteren op status. De volgorde is die van het traject zelf: CATS staat al op volgorde van stap 1

   factuur' staat daar nog achter: die auto is het traject helemaal uit. */
const FASE_ORDE=[...CATS,'__klaar','__gemeld'];
const faseIndex = v => { const i=FASE_ORDE.indexOf(faseVan(v)); return i<0?FASE_ORDE.length:i; };

// alleen de fases uit elkaar trekt en niet ook nog de volgorde daarbinnen omgooit.
const opStatusOp   = (a,b) => faseIndex(a)-faseIndex(b) || nieuwsteEerst(a,b);

  const s=boekSorteer[pagina];

    :'Klik om te sorteren op status, van stap 1 naar ✓ Verkoopklaar';
  return `<th class="sorteerkop ${s?'aan':''}" onclick="zetSorteer('${pagina}')" title="${esc(uitleg)}">${label}<span class="sorteerpijl">${pijl}</span></th>`;
}

const boekFilter={komende:"alles",lopende:"alles",verkocht:"alles"};

  const totaal=groepen.reduce((n,g)=>n+g.lijst.length,0);

  return `<div class="filterbar"><span class="fl">Status</span>${chip("alles","Alle",totaal)}${groepen.map(g=>chip(g.sleutel,g.label,g.lijst.length)).join("")}</div>`;

  let L=IMPORT_BASE.slice();

  truck:    '<path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  mail:     '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  zoek:     '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  map:      '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
};
function ico(naam, maat){
  const d = ICONEN[naam] || ''; const m = maat || 16;
  return `<svg class="ico" width="${m}" height="${m}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
function carIcon(){return `<svg width="20" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.5-4.5A2 2 0 018.4 5h7.2a2 2 0 011.9 1.5L19 11h1a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 11-4 0H9a2 2 0 11-4 0H4a1 1 0 01-1-1v-3a1 1 0 011-1h1z"/></svg>`;}

let state={view:"vandaag",q:""};
const app=document.getElementById("app");

/* ===== Server-opslag (backend). Valt terug op lokaal als de API er niet is. ===== */
let apiOk=false, saveT=null;
// stateOk = "de voortgang is echt ingelezen". Zolang dat niet gelukt is, mag er NIETS terug naar de
// server: V staat dan nog op de beginwaarden (alles 'komende', geen foto's, geen subtaken) en één
// klik zou dat over de database heen schrijven.
let stateOk=false;
function buildState(){const vehicles={}; V.forEach(v=>{vehicles[v.id]={status:v.status,klaar:v.klaar,route:v.route,owner:v.owner,subtasks:v.subtasks,photos:v.photos,arrivedAt:v.arrivedAt||null,taxAt:v.taxAt||null};}); return {vehicles,subUid,globalTodos,gtUid,activityLog};}
/* Hoe de achtergrondtaken erbij staan (Mobilox-agent, agenda). Alleen zichtbaar als er iets mis is:
   een groen vinkje dat het goed gaat leest niemand, een melding dat het beeld uren oud is wel. */
let agents=[];
async function loadState(){
  stateOk=false;   // opnieuw inlezen: tot het gelukt is mag er niets terug naar de server
  try{ const r=await fetch("/api/state",{cache:"no-store"}); if(!r.ok)return; const s=await r.json(); apiOk=true;
    if(s&&s.vehicles){ V.forEach(v=>{const d=s.vehicles[v.id]; if(d){ if(d.status)v.status=d.status; if(typeof d.klaar==="number")v.klaar=d.klaar; v.route=d.route||null; v.owner=d.owner||null; v.subtasks=Array.isArray(d.subtasks)?d.subtasks:[]; v.photos=d.photos||{}; v.arrivedAt=d.arrivedAt||null; v.taxAt=d.taxAt||null; }});
      if(typeof s.subUid==="number")subUid=Math.max(subUid,s.subUid);
      if(Array.isArray(s.globalTodos))globalTodos=s.globalTodos;
      if(Array.isArray(s.activityLog))activityLog=s.activityLog;
      if(typeof s.gtUid==="number")gtUid=Math.max(gtUid,s.gtUid);
      if(Array.isArray(s.agents))agents=s.agents; }
    stateOk=true;   // pas hier: alles is zonder fout ingelezen, vanaf nu mag er opgeslagen worden
  }catch(_){ /* geen backend: lokaal verder */ }
}
/* Catalogus uit de database. Mislukt dit op welke manier dan ook, dan blijft de terugvallijst V
   staan — een lege lijst zou een lege app opleveren, en dat is erger dan een verouderde lijst. */
async function loadVehicles(){ if(!apiOk)return;
  try{ const r=await fetch("/api/vehicles",{cache:"no-store"}); if(!r.ok)return;
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length)return;
    if(!rows.every(x=>x&&typeof x.id==="string"&&x.id))return;
    // In place vervangen, niet herwijzen: V is const en wordt overal bij naam gebruikt.
    //
    // De voortgang van een auto die we al kenden gaat MEE. Eerder kreeg elke rij initVeh(), en dan
    // stond alles in het geheugen op leeg tot loadState() eroverheen kwam. Werd loadVehicles() ergens
    // aangeroepen zonder loadState() erachter — dat gebeurde in arrive() — dan schreef de
    // eerstvolgende klik die lege waarden over de database. Op 20-08-2026 kostte dat de fase, foto's,
    // subtaken en eigenaren van 64 auto's. Eén vergeten aanroep mag dat niet kunnen doen.
    const vorige={}; V.forEach(v=>{ vorige[v.id]={owner:v.owner,klaar:v.klaar,route:v.route,
      photos:v.photos,subtasks:v.subtasks,arrivedAt:v.arrivedAt,taxAt:v.taxAt}; });
    V.length=0; rows.forEach(r2=>{ V.push(r2); const p=vorige[r2.id]; if(p)Object.assign(r2,p); else initVeh(r2); });
  }catch(_){ /* geen backend of onleesbaar antwoord: terugvallijst blijft staan */ }
}
// Weigert de server de opslag (vangrail tegen massale wissing), dan mag dat niet stil gebeuren:
// je zit dan met een browser waarvan het geheugen niet klopt en je wijzigingen komen niet aan.
function scheduleSave(){ if(!apiOk||!stateOk)return; clearTimeout(saveT); saveT=setTimeout(()=>{
  fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildState())})
    .then(r=>{ if(r.status===409){ stateOk=false;
      showToast("Opslaan geweigerd — deze pagina loopt niet meer gelijk met de server. Ververs de pagina (⌘R) voordat je verder werkt.",false); } })
    .catch(()=>{}); },400); }
function match(v){const q=state.q.toLowerCase(); return !q || (v.merk+" "+v.model+" "+v.uitv+" "+v.kenteken+" "+v.id).toLowerCase().includes(q);}

/* ===== Ongedaan maken (undo) ===== */
const history=[];
function pushUndo(label,undoFn){history.push({label,undoFn}); if(history.length>50)history.shift(); updateUndoUI(); showToast(label,true); scheduleSave();}
function undoLast(){ if(!history.length)return; const e=history.pop(); e.undoFn(); updateUndoUI(); rerender(); showToast("Ongedaan gemaakt: "+e.label,false); scheduleSave();}
function updateUndoUI(){const b=document.getElementById("undoBtn"); if(!b)return; if(history.length){b.disabled=false; b.title="Ongedaan maken: "+history[history.length-1].label;} else {b.disabled=true; b.title="Niets om ongedaan te maken";}}
let toastT=null;
function showToast(msg,withUndo){
  let t=document.getElementById("toast"); if(!t){t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);}
  t.innerHTML=`<span>${msg}</span>${withUndo?`<button class="tundo" onclick="undoLast()">Ongedaan maken</button>`:""}<button class="tx" onclick="hideToast()" title="Sluiten">×</button>`;
  t.classList.add("show"); if(toastT)clearTimeout(toastT); toastT=setTimeout(hideToast,6000);
}
function hideToast(){const t=document.getElementById("toast"); if(t)t.classList.remove("show");}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault(); undoLast();}});

/* ===== Activiteitenlog: wie vinkte wat af, en hoelang stond het open ===== */
function ageStr(ts){ if(!ts)return ''; const d=Date.now()-ts; const m=Math.floor(d/60000); if(m<1)return 'net'; if(m<60)return m+' min'; const h=Math.floor(m/60); if(h<24)return h+' u'; return Math.floor(h/24)+' d'; }
function fmtDate(ts){ if(!ts)return '—'; const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${p(d.getDate())}-${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function logActivity(action,text,vehicleId){ activityLog.push({ts:Date.now(),by:(currentUser&&currentUser.name)||'?',action,text:text||'',vehicleId:vehicleId||null}); if(activityLog.length>2000)activityLog.shift(); }
function isAdmin(){ return currentUser&&currentUser.role==='admin'; }

/* ===== Vandaag ===== */
function renderVandaag(){
  const kom=V.filter(v=>v.status==="komende");
  const lop=V.filter(v=>v.status==="lopende");
  const acties=lop.map(v=>({v,a:currentAction(v)})).filter(x=>x.a);
  const subs=[]; lop.forEach(v=>v.subtasks.filter(s=>!s.done).forEach(s=>subs.push({v,sub:s})));
  const gopen=globalTodos.filter(t=>!t.done).map(t=>({gt:t}));
  const openCount=acties.length+subs.length+gopen.length;
  const verwacht=V.filter(v=>v.status==="komende"&&v.batch); // transport gepland, nog niet binnen
  const groups={}; PEOPLE.forEach(p=>groups[p]=[]); groups["_"]=[];
  acties.forEach(x=>{(groups[x.v.owner]||groups["_"]).push(x);});
  subs.forEach(x=>{(groups[x.sub.owner]||groups["_"]).push(x);});
  gopen.forEach(x=>{(groups[x.gt.owner]||groups["_"]).push(x);});
  const rank=z=>z.gt?2:(z.sub?1:0);
  Object.values(groups).forEach(g=>g.sort((a,b)=>{const ra=rank(a),rb=rank(b); if(ra!==rb)return ra-rb; if(ra===0)return steps(a.v).currentIdx-steps(b.v).currentIdx; return 0;}));

  function todoRow(x){
    const person=x.gt?x.gt.owner:(x.sub?x.sub.owner:x.v.owner);
    const opts=['<option value="">— toewijzen</option>'].concat(PEOPLE.map(p=>`<option value="${p}" ${person===p?'selected':''}>${p}</option>`)).join("");
    const ageChip=ts=>{const a=ageStr(ts); return a?` · <span class="agechip" title="Staat zo lang open">⏱ ${a} open</span>`:'';};
    if(x.gt){const t=x.gt; const veh=t.vehicleId?V.find(v=>v.id===t.vehicleId):null;
      const sub=veh?`${veh.merk} ${veh.model} · ${veh.kenteken!=='—'?veh.kenteken:veh.vin}`:'Algemene taak';
      return `<div class="todo"><label class="chk" title="Afvinken"><input type="checkbox" onchange="toggleGlobalTodo(${t.id},this.checked)"><span class="box"></span></label><div class="body" ${veh?`onclick="openVeh('${veh.id}')" style="cursor:pointer"`:'style="cursor:default"'}><div class="act">${t.text} <span class="tag" style="background:var(--blue-soft);color:var(--blue)">Los</span></div><div class="veh">${sub}${ageChip(t.createdAt)}</div></div><select class="assign" onchange="assignGlobalTodo(${t.id},this.value)">${opts}</select></div>`;}
    if(x.sub){const s=x.sub,v=x.v;
      return `<div class="todo"><span class="tk" style="background:var(--accent)"></span><div class="body" onclick="openVeh('${v.id}')"><div class="act">${s.text} <span class="tag" style="background:var(--amber-soft);color:var(--amber)">Extra</span></div><div class="veh">${v.merk} ${v.model} · ${v.kenteken!=='—'?v.kenteken:v.vin}${ageChip(s.createdAt)}</div></div><select class="assign" onchange="assignSubtask('${v.id}',${s.id},this.value)">${opts}</select></div>`;}
    const v=x.v,a=x.a;
    return `<div class="todo"><span class="tk"></span><div class="body" onclick="openVeh('${v.id}')"><div class="act">${a.actie}</div><div class="veh">${v.merk} ${v.model} · ${v.kenteken!=='—'?v.kenteken:v.vin}${ageChip(v.arrivedAt)}</div></div><select class="assign" onchange="assign('${v.id}',this.value)">${opts}</select></div>`;}
  function personCard(name,list){const disp=name==="_"?"Niet toegewezen":name; const av=name==="_"?`<span class="pav" style="background:var(--slate)">?</span>`:pav(name);
    return `<div class="person-card"><div class="person-head">${av}<span class="pn">${disp}</span><span class="pc">${list.length} ta${list.length===1?'ak':'ken'}</span></div>${list.length?list.map(todoRow).join(""):`<div class="empty" style="padding:16px">Geen open taken</div>`}</div>`;}

  app.innerHTML=`
    <h1 class="page-title">Vandaag</h1>
    <p class="page-sub">Je dagelijkse leidraad: hieronder staan alle open taken. Verder onderaan vink je auto's aan zodra ze binnen zijn.</p>
    ${(()=>{const nr=(bpmData.notifs||[]).filter(n=>!n.seen); if(!nr.length)return ''; return `<div class="banner" style="border-color:#bfe6d1;background:linear-gradient(180deg,#eefaf3,#e3f5ea)">
      <div class="bi" style="background:var(--green)">${ico("doc",18)}</div>
      <div style="flex:1"><div class="bt">${nr.length} nieuw BPM-taxatierapport${nr.length===1?'':'en'} van S-TAX</div>
        <div class="bs">${nr.slice(0,4).map(n=>{const vv=V.find(x=>x.id===n.id);return (vv?`${vv.merk} ${vv.model}`:'Auto')+' · '+fmtDate(n.ts);}).join(' — ')}</div></div>
      <button class="btn btn-ghost btn-sm" onclick="markBpmSeen()">Gezien</button></div>`;})()}
    ${agentBanner()}
    ${afleverPaneel()}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 4px 12px">
      <h3 style="margin:0;font-size:16px">To-do — per persoon <span class="agechip" style="color:var(--accent);background:var(--blue-soft)">${openCount} open</span></h3>
      ${isAdmin()?`<button class="btn btn-ghost btn-sm" onclick="go('logboek')">${ico("logboek")} Logboek</button>`:''}
    </div>
    ${(lop.length||gopen.length)? `<div class="cols">${personCard("Leonie",groups["Leonie"])}${personCard("Sjoerd",groups["Sjoerd"])}${personCard("Vince",groups["Vince"])}${personCard("Floris",groups["Floris"])}</div>${groups["_"].length?`<div style="margin-top:16px">${personCard("_",groups["_"])}</div>`:""}`
      : `<div class="card"><div class="empty"><div class="eb">${ico("inbox",26)}</div>Nog geen open taken. Vink onderaan een auto op binnen, of voeg met <b>${ico("plus")} To-do</b> rechtsboven een losse taak toe.</div></div>`}
    <div style="margin-top:22px">${garantiePaneel()}</div>
    <div class="kpis" style="margin-top:22px">
      <div class="kpi"><div class="bar" style="background:var(--blue)"></div><div class="lab">Komende</div><div class="val">${kom.length}</div><div class="sub">nog niet binnen</div></div>
      <div class="kpi"><div class="bar" style="background:var(--green)"></div><div class="lab">Binnengekomen</div><div class="val">${lop.length}</div><div class="sub">aangevinkt</div></div>
      <div class="kpi"><div class="bar" style="background:var(--accent)"></div><div class="lab">Open taken</div><div class="val">${openCount}</div><div class="sub">stap te zetten</div></div>
      <div class="kpi"><div class="bar" style="background:var(--slate)"></div><div class="lab">Niet toegewezen</div><div class="val">${groups["_"].length}</div><div class="sub">nog niemand op</div></div>
    </div>
    <div class="banner">
      <div class="bi">${ico("taken",21)}</div>
      <div><div class="bt">Afvinken bij binnenkomst</div>
        <div class="bs">Je weet nog niet precies welke van de verwachte auto's morgen komen — vink ze aan zodra ze er zijn. Elke vink start stap 1 (RDW-foto's) en zet de to-do in gang.</div></div>
    </div>
    <div class="card" style="margin-bottom:18px"><h3>Verwacht binnenkort — aanvinken zodra binnen <span class="btn btn-ghost btn-sm" onclick="go('komende')">Alle komende →</span></h3>
      <div class="card-body" style="padding:0 4px">${verwacht.length?komTable(verwacht):`<div class="empty">Alle verwachte auto's zijn aangevinkt.</div>`}</div></div>
    ${agentRegel()}
  `;
}

/* Eén regel onderaan Vandaag met wanneer de koppelingen voor het laatst rondkwamen. De banner
   bovenaan schreeuwt alleen als er iets stuk is; dit is de stille variant, voor als je je afvraagt
   hoe vers het beeld is. Bewust klein en onderaan: het is geen werk, het is een geruststelling. */
function agentRegel(){
  if(!agents.length) return '';
  const nu=Date.now();
  const oud=t=>{ if(!t) return 'nog nooit'; const m=Math.round((nu-t)/60000);
    return m<2?'zojuist':m<90?m+' min geleden':Math.round(m/60)+' uur geleden'; };
  return `<div class="note" style="text-align:right;margin:0 4px 6px">${
    agents.map(a=>`${AGENT_NAMEN[a.naam]||a.naam}: ${a.ok===false?'<b>loopt vast</b> — laatst gelukt '+oud(a.geluktTs):'bijgewerkt '+oud(a.geluktTs)}`).join(' · ')}</div>`;
}
/* ===== Logboek (alleen admin: Vince & Floris) ===== */
function renderLog(){
  if(!isAdmin()){ go('vandaag'); return; }
  const rows=activityLog.slice().reverse();
  const body=rows.length? rows.map(e=>{const veh=e.vehicleId?V.find(v=>v.id===e.vehicleId):null;
    return `<tr><td class="note" style="white-space:nowrap">${fmtDate(e.ts)}</td><td><span style="display:inline-flex;align-items:center;gap:6px">${PEOPLE.includes(e.by)?pav(e.by):''}<span style="font-weight:600">${e.by}</span></span></td><td>${e.action}</td><td>${e.text||(veh?`${veh.merk} ${veh.model}`:'')}</td></tr>`;
  }).join("") : `<tr><td colspan="4" class="empty">Nog geen activiteit gelogd.</td></tr>`;
  app.innerHTML=`
    <div class="back" onclick="go('vandaag')">← Terug naar Vandaag</div>
    <h1 class="page-title">Logboek</h1><p class="page-sub">Wie heeft wat wanneer afgevinkt. Alleen zichtbaar voor admins (Vince & Floris). Nieuwste bovenaan.</p>
    <div class="card"><div class="card-body" style="padding:0 4px"><table><thead><tr><th style="width:120px">Wanneer</th><th style="width:150px">Wie</th><th>Actie</th><th>Taak / auto</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
}

/* ===== Komende ===== */
function komTable(list){
  if(!list.length) return `<div class="empty">Geen auto's.</div>`;
  // Klikken op de regel opent de auto; de vinkjescel houdt de klik tegen, anders opent de auto
  // telkens als je iemand binnen meldt.
  return `<div class="tabelwrap"><table class="boek">${boekColgroup([46],[168])}<thead><tr>
    <th>Binnen</th>${boekKoppen()}<th>Status</th>
  </tr></thead><tbody>${list.slice().sort(nieuwsteEerst).map(v=>{
    const arrived=v.status==='lopende';
    return `<tr class="${arrived?'row-arrived':''}" onclick="openVeh('${v.id}')" style="cursor:pointer">
      <td onclick="event.stopPropagation()"><label class="chk" title="Aanvinken zodra binnen"><input type="checkbox" ${arrived?'checked':''} onchange="arrive('${v.id}',this.checked)"><span class="box"></span></label></td>
      ${boekCellen(v)}
      <td>${arrived?`<span class="arr-lab">✓ Binnen — stap 1 loopt</span>`
                   :`<span class="tag ${v.importAuto?'tag-imp':'tag-nl'}">${v.importAuto?'Import':'NL / inruil'}</span>${v.autoboekStatus==='fout'?` <span class="tag" style="background:var(--red-soft);color:var(--red)">Autoboek mislukt</span>`:''}`}</td>
    </tr>`;}).join("")}</tbody></table></div>`;
}
function renderKomende(){
  const all=V.filter(v=>match(v));
  // De transportpartijen komen uit de gegevens zelf. Stond hier vast op 13-08 en 14-08; een auto met
  // een andere transportdatum viel toen in géén enkele groep en was daarmee onzichtbaar op deze pagina.
  const partijen=[...new Set(all.filter(v=>v.batch).map(v=>v.batch))].sort((a,b)=>{
    const d=s=>{const m=/^(\d{1,2})-(\d{1,2})/.exec(s||""); return m?Number(m[2])*100+Number(m[1]):9999;};
    return d(a)-d(b)||String(a).localeCompare(String(b));
  });
  const overigImp=all.filter(v=>!v.batch&&v.importAuto), overigNl=all.filter(v=>!v.batch&&!v.importAuto);
  // Een auto die binnen is, hoort hier niet meer te staan: hij staat vanaf dat moment bij Lopende.
  // Bleef hij staan, dan groeide deze lijst eindeloos door met afgevinkte regels.
  const openstaand=l=>l.filter(v=>v.status==="komende");
  const binnen=l=>l.filter(v=>v.status==="lopende").length;
  const grp=(title,date,groep)=>{
    const lijst=openstaand(groep); if(!lijst.length)return "";
    const al=binnen(groep);
    return `<div class="grp"><div class="grp-head ${date?'batch':''}">
      <span class="gt">${title}</span><span class="gcount">${lijst.length}</span>${date?`<span class="gdate">${date}</span>`:""}
      <span class="sp gdate">${al?`${al} al binnen`:'nog niemand binnen'}</span>
    </div><div style="padding:0 4px">${komTable(lijst)}</div></div>`;
  };
  const groepen=[
    ...partijen.map(p=>grp(`Transport gepland ${p}`,"verwacht",all.filter(v=>v.batch===p))),
    grp("Overig import — nog geen transportdatum","",overigImp),
    grp("Overig / inruil (NL)","",overigNl),
  ].join("");
  const nogOpen=openstaand(all).length;
  app.innerHTML=`
    <h1 class="page-title">Komende auto's</h1>
    <p class="page-sub">Nieuw ingekocht? Voeg hem toe met <b>${ico("plus")} Auto</b> rechtsboven. <b>Vink een auto aan zodra hij binnen is</b> — hij verdwijnt dan uit deze lijst en verhuist naar Lopende, waar de to-do voor stap 1 (RDW Foto's) gaat lopen.</p>
    <div class="groupwrap">
      ${groepen || `<div class="empty">${state.q?`Geen komende auto's die op “${state.q}” passen.`:`Geen komende auto's meer — alles is binnen. Nieuw ingekocht? Gebruik <b>${ico("plus")} Auto</b> rechtsboven.`}</div>`}
    </div>
    ${inruilPaneel()}`;
}

/* ===== Inruilauto's uit Mobilox =====
   De agent legt elke inruil vast die hij op een verkoopovereenkomst tegenkomt. Sinds 23-08-2026 maakt
   hij een nieuwe inruil zelf aan bij Komende; de regels van vóór die datum liggen er nog, en die
   zaten in een tabel waar geen scherm bij hoorde. Hier staan ze, met per regel één knop.

   Overnemen gaat langs hetzelfde /api/vehicle als de knop Auto rechtsboven — dus met dezelfde
   controle op dubbelen en dezelfde regel naar het Autoboek. Een tweede manier om een auto aan te
   maken zou daar vroeg of laat van afwijken. */
let inruilen=[];
async function loadInruil(){ if(!apiOk)return;
  try{ const r=await fetch("/api/inruil",{cache:"no-store"}); if(r.ok){ const d=await r.json(); if(d&&Array.isArray(d.gevallen))inruilen=d.gevallen; } }catch(_){}
}

// Zelfde groepering als in mobilox/inruil.js, zodat het scherm hetzelfde kenteken toont als PVP straks opslaat.
function kentekenNet(ruw){
  const k=String(ruw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(k.length!==6) return k;
  const g=k.match(/[A-Z]+|[0-9]+/g)||[];
  if(g.length===3) return g.join('-');
  if(g.length===2){ const [a,b]=g;
    if(a.length===2&&b.length===4) return `${a}-${b.slice(0,2)}-${b.slice(2)}`;
    if(a.length===4&&b.length===2) return `${a.slice(0,2)}-${a.slice(2)}-${b}`; }
  return k;
}
async function inruilDoe(id,actie,pvpId){
  try{
    const r=await fetch("/api/inruil",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,actie,pvpId})});
    if(!r.ok){ showToast("Actie mislukt",false); return false; }
    await loadInruil(); rerenderCurrent(); return true;
  }catch(_){ showToast("Geen verbinding met de server",false); return false; }
}
async function inruilOvernemen(id){
  const g=inruilen.find(x=>x.id===id); if(!g)return;
  const woorden=String(g.omschrijving||'').trim().split(/\s+/);
  const body={ kenteken:kentekenNet(g.kenteken), vin:g.vin||'', merk:woorden[0]||'', model:woorden[1]||'',
    uitv:woorden.slice(2).join(' '), km:g.km!=null?String(g.km):'', inkoopprijs:g.prijs!=null?String(g.prijs):'',
    lev:'Inruil', importAuto:false, note:'Inruil, overgenomen uit Mobilox' };
  if(!body.kenteken&&!body.vin){ showToast("Deze regel heeft geen kenteken en geen chassisnummer",false); return; }
  try{
    const r=await fetch("/api/vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){ await inruilDoe(id,'overgenomen',j.id); showToast("Stond al in PVP — regel afgehandeld",true); return; }
    if(!r.ok){ showToast("Overnemen mislukt",false); return; }
    await inruilDoe(id,'overgenomen',j.id);
    await loadVehicles(); await loadState();
    logActivity('Inruil overgenomen',[body.merk,body.model].filter(Boolean).join(' ')||j.id,j.id); scheduleSave();
    const ab=j.autoboek||{};
    showToast("Bij Komende gezet"+(ab.status==='ok'?" — ook in het Autoboek ✓":ab.status==='fout'?" — NIET in het Autoboek":""),true);
    rerenderCurrent();
  }catch(_){ showToast("Geen verbinding met de server",false); }
}

  // waren én voor een auto die nog op de taxatiekeuze wacht; die vielen dus buiten elke balk — bij

  // bron als de kolom Voortgang in de tabel hiernaast, en de eindstanden staan er los onder.
  const catVan=v=>{const a=currentAction(v); return a?a.cat:null;};

  // faseVan() staat bovenin: de chips en het sorteren moeten dezelfde fase bedoelen.
  const groepen=[...CATS.map(c=>({sleutel:c,label:c,lijst:lop.filter(v=>faseVan(v)===c)})),

                 {sleutel:'__gemeld',label:'Wacht op factuur',lijst:lop.filter(v=>faseVan(v)==='__gemeld')}]

        ${CATS.map((c,i)=>`<div class="fn"><div class="fl">${c}</div><div class="track"><div class="fill" style="width:${Math.round(perCat[i]/maxc*100)}%;${perCat[i]===0?'background:transparent':''}">${perCat[i]||''}</div></div><div class="fc">${perCat[i]}</div></div>`).join("")}
        <div class="fn fn-eind"><div class="fl">✓ Verkoopklaar</div><div class="track"><div class="fill" style="width:${Math.round(klaarAantal/maxc*100)}%;${klaarAantal===0?'background:transparent':''}">${klaarAantal||''}</div></div><div class="fc">${klaarAantal}</div></div>

function arrive(id,checked){const v=V.find(x=>x.id===id); if(!v)return;
  const ps=v.status, pk=v.klaar, pr=v.route, pa=v.arrivedAt;
  v.status=(checked===false)?"komende":"lopende"; v.klaar=0; v.route=null;
  if(v.status==='lopende'){ v.arrivedAt=Date.now(); logActivity('Auto binnengekomen','',v.id); }
  else { v.arrivedAt=null; }
  pushUndo(`${v.merk} ${v.model} ${v.status==='lopende'?'op binnen gezet':'teruggezet naar komende'}`, ()=>{v.status=ps; v.klaar=pk; v.route=pr; v.arrivedAt=pa;});
  rerender();
  // Binnengekomen? Dan verhuist de regel in het Autoboek van Komende naar Lopende. Apart van het
  // opslaan, zodat de klik meteen doorgaat; het resultaat komt bij de auto te staan.
  if(v.status==='lopende'&&apiOk){
    fetch("/api/binnengekomen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})
      .then(r=>r.ok?r.json():null).then(j=>{
        if(!j)return; const ab=j.autoboek||{};
        if(ab.status==='fout'){ showToast("Autoboek niet bijgewerkt — zie de auto",false); }
        // Altijd in dit paar: loadVehicles() gevolgd door loadState(). Zie loadVehicles().
        loadVehicles().then(loadState).then(()=>{ if(state.view!=='veh:'+id)rerenderCurrent(); });
      }).catch(()=>{});
  }}
function assign(id,val){const v=V.find(x=>x.id===id); if(!v)return;
  const po=v.owner; v.owner=val||null;

    `1e toelating: ${v.reg||'-'}\nKm-stand: ${v.km!=null?v.km.toLocaleString('nl-NL')+' km':'-'}\n\n`+

/* ===== Foto's verkleinen vóór uploaden =====
   Camerafoto's zijn ~6200x4700 (29 megapixel, ~4 MB) terwijl advertentiesites rond de 1600 px tonen.
   Terugschalen naar 2560 px scheelt een factor 7 in opslag én in back-up, zonder dat je op een scherm
   verschil ziet. Het houdt uploads bovendien ruim onder de 30 MB-grens van nginx — daarboven mislukt
   een upload nu stil, want de foutafhandeling in de app slikt dat.
   Gaat er iets mis (onbekend formaat zoals HEIC, geen canvas, te weinig geheugen), dan gaat het
   originele bestand alsnog ongewijzigd naar de server. Verkleinen mag nooit een upload kosten. */
const FOTO_MAX=2560;          /* langste zijde in pixels */
const FOTO_KWALITEIT=0.92;    /* JPEG-kwaliteit */
const FOTO_MIN_BYTES=600*1024;/* kleiner dan dit blijft onaangeroerd */
function leesBestand(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=()=>rej(r.error||new Error('lezen mislukt')); r.readAsDataURL(f); }); }
async function verkleinFoto(f){
  if(!/^image\//.test(f.type||''))return null;      /* geen afbeelding (bv. PDF): niet aankomen */
  if(f.size<FOTO_MIN_BYTES)return null;             /* al klein genoeg */
  if(typeof createImageBitmap!=='function')return null;
  let bron=null,eerst=null;
  try{
    /* imageOrientation:'from-image' — anders komen telefoonfoto's gedraaid binnen, want een canvas
       hercodeert zonder EXIF en daarmee verdwijnt de rotatievlag. */
    try{ eerst=await createImageBitmap(f,{imageOrientation:'from-image'}); }
    catch(_){ eerst=await createImageBitmap(f); }
    const lang=Math.max(eerst.width,eerst.height);
    if(lang<=FOTO_MAX)return null;                  /* afmeting is al goed: niet opnieuw comprimeren */
    const s=FOTO_MAX/lang, dw=Math.max(1,Math.round(eerst.width*s)), dh=Math.max(1,Math.round(eerst.height*s));
    bron=eerst;
    /* Laat de decoder zelf schalen als dat kan: dat scheelt een canvas van 29 megapixel, wat op
       iOS Safari tegen de maximale canvasgrootte aan loopt en dan een leeg beeld oplevert. */
    try{ const g=await createImageBitmap(f,{imageOrientation:'from-image',resizeWidth:dw,resizeHeight:dh,resizeQuality:'high'});
         if(g.width===dw&&g.height===dh){ eerst.close(); eerst=null; bron=g; } else { g.close(); } }catch(_){}
    const cv=document.createElement('canvas'); cv.width=dw; cv.height=dh;
    const ctx=cv.getContext('2d'); if(!ctx)return null;
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,dw,dh);  /* PNG met transparantie wordt anders zwart */
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    /* Moest het toch via canvas, dan stapsgewijs halveren: in één keer meer dan 2x verkleinen geeft
       kartelranden op fijne details (grille, velgen, letters op een kentekenbewijs). */
    let src=bron,w=bron.width,h=bron.height;
    while(w>dw*2){
      const nw=Math.max(dw,Math.round(w/2)),nh=Math.max(dh,Math.round(h/2));
      const n=document.createElement('canvas'); n.width=nw; n.height=nh;
      const nc=n.getContext('2d'); if(!nc)return null;
      nc.imageSmoothingEnabled=true; nc.imageSmoothingQuality='high'; nc.drawImage(src,0,0,nw,nh);
      src=n; w=nw; h=nh;
    }
    ctx.drawImage(src,0,0,dw,dh);
    const url=cv.toDataURL('image/jpeg',FOTO_KWALITEIT);
    if(!/^data:image\/jpeg;base64,/.test(url))return null;
    if(url.length*0.75>=f.size)return null;         /* groter geworden: dan is het origineel beter */
    return url;
  }catch(_){ return null; }
  finally{ try{ if(eerst)eerst.close(); }catch(_){} try{ if(bron&&bron!==eerst&&bron.close)bron.close(); }catch(_){} }
}
async function leesFoto(f){ const k=await verkleinFoto(f); return k!==null?k:await leesBestand(f); }
/* ===== Foto's per stap: Voertuig→RDW Foto's, Documentatie→Papieren Foto's ===== */
function grpReqCount(v,g){return g.items.filter(p=>p.req&&v.photos[p.key]).length;}
function grpReqTotal(g){return g.items.filter(p=>p.req).length;}
let photoUp={};
async function setPhotoData(id,key,dataUrl){const v=V.find(x=>x.id===id); if(!v)return; const prev=v.photos[key]; v.photos[key]=dataUrl; if(apiOk)photoUp[id+'|'+key]=1; rerender();
  if(apiOk){ try{ const res=await fetch("/api/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,key,dataUrl})}); if(res.ok){const j=await res.json(); if(j&&j.url)v.photos[key]=j.url;} }catch(_){} delete photoUp[id+'|'+key]; }
  pushUndo(`${v.merk} ${v.model} — foto: ${PHOTO_BY_KEY[key].label}`, ()=>{ if(prev)v.photos[key]=prev; else delete v.photos[key]; });
  rerender();}
/* Eén weg voor een bestand naar een vakje, of het nu via de knop of via slepen binnenkomt. Twee
   wegen zouden uiteenlopen — en dat is precies wat er gebeurde: kiezen werkte, slepen niet. */
async function fotoNaarVakje(id,key,f){
  if(!f)return false;
  if(!isImg(f)){ showToast(`“${f.name||'dit bestand'}” lijkt geen foto — overgeslagen`,false); return false; }
  let d=null; try{ d=await leesFoto(f); }catch(_){}
  if(!d){ showToast(`“${f.name||'dit bestand'}” kon niet gelezen worden`,false); return false; }
  setPhotoData(id,key,d); return true;
}
async function setPhoto(id,key,input){ const f=input.files&&input.files[0]; input.value=""; await fotoNaarVakje(id,key,f); }
/* Sleep-bak: meerdere foto's tegelijk, dan per stuk naar het juiste vakje slepen */
let photoTray={}; let dragTray=null; let photoTrayLoading={};
async function addToTray(vid,gname,input){ const files=[...input.files]; input.value=""; await bestandenNaarBak(vid,gname,files); }
/* Foto's in de bak zetten, of ze nu gekozen of gesleept zijn.
   Eén voor één, niet allemaal tegelijk: een reeks van 29-megapixelfoto's parallel verkleinen kan de
   tab het geheugen uit werken. De teller loopt hoe dan ook af, ook als er één stuk is. */
async function bestandenNaarBak(vid,gname,lijst){
  const files=[...(lijst||[])].filter(isImg);
  const geweigerd=[...(lijst||[])].length-files.length;
  if(geweigerd)showToast(`${geweigerd} bestand${geweigerd===1?'':'en'} overgeslagen — dat lijkt geen foto`,false);
  if(!files.length)return;
  const k=vid+'|'+gname; if(!photoTray[k])photoTray[k]=[];
  let pending=files.length; photoTrayLoading[k]=files.length; rerender();
  for(const f of files){ let d=null; try{ d=await leesFoto(f); }catch(_){}
    if(d)photoTray[k].push(d); if(--pending===0)delete photoTrayLoading[k]; else photoTrayLoading[k]=pending; rerender(); }
}
async function bakDrop(ev,vid,gname){ ev.preventDefault(); ev.currentTarget.classList.remove('drag');
  const files=await entriesFromDrop(ev.dataTransfer); await bestandenNaarBak(vid,gname,files); }
function removeTray(vid,gname,idx){ const k=vid+'|'+gname; if(photoTray[k])photoTray[k].splice(idx,1); rerender(); }
function clearTray(vid,gname){ const k=vid+'|'+gname; const arr=photoTray[k]; if(!arr||!arr.length)return; if(!window.confirm(arr.length+" foto"+(arr.length===1?'':"'s")+" uit de bak weghalen?"))return; photoTray[k]=[]; rerender(); }
function clearGroupPhotos(id,gi){ const v=V.find(x=>x.id===id); if(!v)return; const g=PHOTO_GROUPS[gi]; const filled=g.items.filter(p=>v.photos[p.key]); if(!filled.length)return; if(!window.confirm("Alle "+filled.length+" foto"+(filled.length===1?'':"'s")+" van “"+g.step+"” wissen? Dit kan met Ongedaan worden teruggezet."))return; const prev={}; filled.forEach(p=>{prev[p.key]=v.photos[p.key]; delete v.photos[p.key];}); pushUndo(`${v.merk} ${v.model} — ${g.step}: alle foto's gewist`, ()=>{Object.assign(v.photos,prev);}); rerender(); }
function trayDragStart(ev,vid,gname,idx){ dragTray={k:vid+'|'+gname,idx}; try{ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain','x');}catch(_){} }
/* Op een vakje kun je twee dingen laten vallen: een foto uit de bak hierboven (binnen de app), of een
   bestand uit de Finder of Verkenner. Dat tweede deed niets terwijl het vakje wél "sleep hierheen"
   zei — je sleepte, er gebeurde niets, en er kwam geen enkele melding. */
async function slotDrop(ev,id,key){
  ev.preventDefault();
  if(dragTray){ const arr=photoTray[dragTray.k]; const dt=dragTray; dragTray=null;
    if(!arr)return; const dataUrl=arr[dt.idx]; if(!dataUrl)return;
    arr.splice(dt.idx,1); setPhotoData(id,key,dataUrl); return; }
  const files=await entriesFromDrop(ev.dataTransfer);
  if(!files.length)return;
  // Eén vakje is één foto. Sleep je er meer, dan gaat de eerste in dit vakje en de rest naar de bak,
  // zodat je ze zelf kunt verdelen — beter dan er stilletjes vier weggooien.
  const gelukt=await fotoNaarVakje(id,key,files[0]);
  if(files.length>1){
    const g=PHOTO_GROUPS.find(x=>x.items.some(p=>p.key===key));
    if(g)await bestandenNaarBak(id,g.group,files.slice(gelukt?1:0));
  }
}
function backToKomend(id){const v=V.find(x=>x.id===id); if(!v)return; const ps=v.status,pk=v.klaar,pr=v.route,pa=v.arrivedAt;
  v.status='komende'; v.klaar=0; v.route=null; v.arrivedAt=null;
  pushUndo(`${v.merk} ${v.model} teruggezet naar Komend`, ()=>{v.status=ps; v.klaar=pk; v.route=pr; v.arrivedAt=pa;});
  go('komende'); }
/* ===== Verkocht =====
   Het sluitstuk van de levensloop: komend → lopend → verkocht. Een auto komt hier pas nadat een
   beheerder de verkoop heeft bevestigd. Terugzetten kan, want per ongeluk bevestigen moet te
   herstellen zijn — maar alleen door een beheerder, en met de regel in het Autoboek erbij. */
function renderVerkocht(){
  const alle=V.filter(v=>v.status==='verkocht');
  // Meest recent bovenaan. verkochtTs is er niet bij auto's die van vóór de bevestigingsknop komen;
  // die vallen dan terug op de inkoopdatum in plaats van allemaal onderaan te belanden.
  const lijst=alle.filter(v=>match(v)).sort((a,b)=>(b.verkochtTs||0)-(a.verkochtTs||0)||nieuwsteEerst(a,b));
  const rij=v=>`<tr onclick="openVeh('${v.id}')" style="cursor:pointer">${boekCellen(v)}
    <td>${v.verkoopFactuurnr||'<span class="leeg">—</span>'}</td>
    <td>${v.verkoopFactuurdatum||'<span class="leeg">—</span>'}</td>
    <td class="num">${euro(v.verkoopprijs)}</td>
    <td><span class="note">${v.verkochtDoor?`bevestigd door ${esc(v.verkochtDoor)}`:''}</span></td>
  </tr>`;
  app.innerHTML=`
    <h1 class="page-title">Verkochte auto's</h1>
    <p class="page-sub">Auto's waarvan de verkoop is bevestigd. De regel staat in het Autoboek bij <b>Verkochte Autos</b>.
      Per ongeluk bevestigd? Open de auto — een beheerder kan hem terugzetten naar Lopende.</p>
    ${lijst.length?`<div class="grp"><div class="grp-head">
        <span class="gt">Verkocht</span><span class="gcount">${lijst.length}</span>
      </div><div style="padding:0 4px"><div class="tabelwrap"><table class="boek">${boekColgroup([],[74,86,92,110])}<thead><tr>
        ${boekKoppen()}<th>Factuur</th><th>Datum verkoop</th><th>Verkoopprijs</th><th>&nbsp;</th>
      </tr></thead><tbody>${lijst.map(rij).join('')}</tbody></table></div></div></div>`
      :`<div class="empty"><div class="eb">${ico("inbox",26)}</div>${state.q?`Geen verkochte auto's die op “${state.q}” passen.`:`Nog geen verkochte auto's.`}</div>`}`;
}
async function zetTerugNaarLopend(id,knop){
  const v=V.find(x=>x.id===id); if(!v||!apiOk)return;
  if(!window.confirm(`${v.merk} ${v.model} terugzetten naar Lopende?\n\nDe verkoopgegevens worden gewist en de regel gaat in het Autoboek terug van Verkochte naar Lopende.`))return;
  knop.disabled=true; knop.textContent="Bezig…";
  try{
    const r=await fetch("/api/verkoop-terug",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ const f=document.getElementById('vk-fout'); if(f)f.textContent=j.error||"Terugzetten mislukt.";
      knop.disabled=false; knop.textContent="Terugzetten naar Lopende"; return; }
    await loadVehicles(); await loadState();
    logActivity('Verkoop teruggedraaid',`${v.merk} ${v.model}`,id);
    scheduleSave();
    const ab=j.autoboek||{};
    showToast(ab.status==='ok'?"Teruggezet naar Lopende — regel verplaatst in het Autoboek ✓"
             :ab.status==='fout'?"Teruggezet — Autoboek NIET bijgewerkt, zie de auto"
             :"Teruggezet naar Lopende",false);
    go('lopende');
  }catch(_){ const f=document.getElementById('vk-fout'); if(f)f.textContent="Geen verbinding met de server."; knop.disabled=false; knop.textContent="Terugzetten naar Lopende"; }
}
/* Verkocht melden vanuit de app. Zelfde endpoint als de koppeling van buiten gebruikt, zodat er maar
   één set regels is: dezelfde controle op dubbele meldingen, hetzelfde spoor in verkoop_meldingen. */
function openVerkochtModal(id){
  const v=V.find(x=>x.id===id); if(!v)return;
  let ov=document.getElementById('vkModal');
  if(!ov){ov=document.createElement('div'); ov.id='vkModal'; ov.className='modal-ov';
    ov.addEventListener('click',e=>{if(e.target===ov)sluitVerkochtModal();}); document.body.appendChild(ov);}
  const d=new Date(), vandaag=`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
  ov.innerHTML=`<div class="modal">
    <h3>Verkocht melden <button class="mclose" onclick="sluitVerkochtModal()" title="Sluiten">×</button></h3>
    <div class="mb">
      <div class="muted" style="font-size:12.5px">${v.merk||''} ${v.model||''} · ${v.kenteken&&v.kenteken!=='—'?v.kenteken:v.vin}</div>
      <div><label>Factuurnummer</label><input type="text" id="vk-nr" autocomplete="off"></div>
      <div><label>Factuurdatum</label><input type="text" id="vk-datum" value="${vandaag}"></div>
      <div><label>Verkoopprijs (€)</label><input type="text" id="vk-prijs"></div>
      <div class="muted" style="font-size:12px">De auto komt op <b>verkocht — factuur volgt</b> te staan. Zodra de factuur in Mobilox staat, gaat hij vanzelf op verkocht en verhuist de regel in het Autoboek.</div>
      <div id="vk-mfout" class="fout"></div>
    </div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="sluitVerkochtModal()">Annuleren</button>
      <button class="btn btn-primary" id="vk-ok" onclick="meldVerkocht('${v.id}')">Melden »</button>
    </div>
  </div>`;
  ov.classList.add('show');
  setTimeout(()=>{const el=document.getElementById('vk-nr'); if(el)el.focus();},40);
}
function sluitVerkochtModal(){const ov=document.getElementById('vkModal'); if(ov)ov.classList.remove('show');}
async function meldVerkocht(id){
  const w=x=>{const e=document.getElementById(x); return e?e.value.trim():"";};
  const fout=document.getElementById('vk-mfout');
  const nr=w('vk-nr');
  if(!nr){fout.textContent="Vul het factuurnummer in."; return;}
  if(!apiOk){fout.textContent="Geen verbinding met de server."; return;}
  const knop=document.getElementById('vk-ok'); knop.disabled=true; knop.textContent="Bezig…"; fout.textContent="";
  try{
    const r=await fetch("/api/verkocht",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({voertuig:id,factuurnummer:nr,factuurdatum:normDatum(w('vk-datum')),verkoopprijs:w('vk-prijs')})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){fout.textContent=j.error||"Melden mislukt."; knop.disabled=false; knop.textContent="Melden »"; return;}
    await loadVehicles(); await loadState();
    sluitVerkochtModal();
    showToast(j.ongewijzigd?"Stond al gemeld op dit factuurnummer":"Gemeld als verkocht — een beheerder bevestigt",false);
    openVeh(id);
  }catch(_){ fout.textContent="Geen verbinding met de server."; knop.disabled=false; knop.textContent="Melden »"; }
}
/* ===== Verkoop =====
   Een verkoopovereenkomst uit Mobilox zet de auto op 'gemeld verkocht'; de factuur zet hem daarna op
   'verkocht' en verhuist de regel in het Autoboek. Er is dus normaal niets te bevestigen — de knop
   hieronder is er voor het geval een verkoop buiten Mobilox om loopt. */
function verkoopCard(v){
  if(v.status!=='gemeld verkocht'&&v.status!=='verkocht')return "";
  const bevestigd=v.status==='verkocht';
  const regel=(k,w)=>`<div class="spec"><span class="k">${k}</span><span class="v">${w||'—'}</span></div>`;
  return `<div class="card"><h3>Verkoop</h3><div class="card-body">
    ${regel("Status", bevestigd
        ? `<span style="color:var(--green)">✓ bevestigd${v.verkochtDoor?` door ${v.verkochtDoor}`:''}</span>`
        : `<span style="color:var(--amber)">verkocht op overeenkomst — factuur volgt</span>`)}
    ${regel("Factuurnummer", v.verkoopFactuurnr ? esc(v.verkoopFactuurnr)+(v.verkoopBron==='overeenkomst'?` <span class="muted" style="font-weight:500">— nummer van de verkoopovereenkomst, de factuur volgt</span>`:'') : null)}
    ${regel("Factuurdatum", v.verkoopFactuurdatum)}
    ${regel("Verkoopprijs", euro(v.verkoopprijs))}
    ${!bevestigd&&isAdmin()?`<button class="btn btn-primary" style="margin-top:12px;width:100%;justify-content:center"
       onclick="bevestigVerkoop('${v.id}',this)">Verkoop bevestigen</button>
      <div class="muted" style="font-size:12px;margin-top:8px">Meestal hoeft dit niet: zodra de factuur in Mobilox staat, doet de agent dit vanzelf. Gebruik deze knop als de verkoop buiten Mobilox om loopt — je hebt er wel een <b>factuurnummer</b> voor nodig.</div>`:''}
    ${!bevestigd&&!isAdmin()?`<div class="muted" style="font-size:12px;margin-top:8px">Zodra de factuur in Mobilox staat, gaat deze auto vanzelf op verkocht.</div>`:''}
    ${bevestigd&&isAdmin()?`<button class="btn btn-ghost btn-sm" style="margin-top:12px;width:100%;justify-content:center"
       onclick="zetTerugNaarLopend('${v.id}',this)">Terugzetten naar Lopende</button>
      <div class="muted" style="font-size:12px;margin-top:8px">Voor als de verkoop per ongeluk is bevestigd. De regel gaat in het Autoboek terug van Verkochte naar Lopende.</div>`:''}
    <div id="vk-fout" class="fout"></div>

}
async function bevestigVerkoop(id,knop){
  if(!apiOk)return;
  const v=V.find(x=>x.id===id); if(!v)return;
  // Een auto gaat pas op verkocht als er een factuurnummer is. Staat er nog een nummer uit de
  // verkoopovereenkomst, dan vraagt hij om het factuurnummer — dat is wat er in het Autoboek komt.
  let nummer=null;
  if(!v.verkoopFactuurnr||v.verkoopBron==='overeenkomst'){
    nummer=window.prompt(`Factuurnummer van ${v.merk} ${v.model}?\n\nEen auto gaat pas op verkocht als de factuur er is. `+
      (v.verkoopFactuurnr?`Nu staat er ${v.verkoopFactuurnr} — dat is het nummer van de verkoopovereenkomst, niet van de factuur.`:''),'');
    if(nummer===null)return;
    nummer=String(nummer).trim();
    if(!nummer){ showToast("Zonder factuurnummer kan de verkoop niet bevestigd worden",false); return; }
  }
  if(!window.confirm(`Verkoop van ${v.merk} ${v.model} bevestigen?\n\nDe auto gaat op verkocht en de regel verhuist in het Autoboek van Lopende naar Verkochte.`))return;
  knop.disabled=true; knop.textContent="Bezig…";
  try{
    const r=await fetch("/api/verkoop-bevestigen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(nummer?{id,factuurnummer:nummer}:{id})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ const f=document.getElementById('vk-fout'); if(f)f.textContent=j.error||"Bevestigen mislukt.";
      knop.disabled=false; knop.textContent="Verkoop bevestigen"; return; }
    // Eerst opnieuw inlezen, dán loggen: loadState() haalt het logboek van de server en zou een regel
    // die hiervóór is toegevoegd meteen weer overschrijven.
    const nr=v.verkoopFactuurnr;
    await loadVehicles(); await loadState();
    logActivity('Verkoop bevestigd',`${v.merk} ${v.model}`+(nr?` — factuur ${nr}`:''),id);
    scheduleSave();
    const ab=j.autoboek||{};
    showToast(ab.status==='ok'?"Verkoop bevestigd — regel verplaatst in het Autoboek ✓"
             :ab.status==='fout'?"Verkoop bevestigd — Autoboek NIET bijgewerkt, zie de auto"
             :"Verkoop bevestigd",false);
    go('lopende');
  }catch(_){ const f=document.getElementById('vk-fout'); if(f)f.textContent="Geen verbinding met de server."; knop.disabled=false; knop.textContent="Verkoop bevestigen"; }
}
/* ===== Auto verwijderen (alleen admin) =====

        ${v.autoboekRij?regel(["Autoboek",`staat op rij ${v.autoboekRij} — die blijft staan`]):''}
      </div>
      <div class="muted" style="font-size:12px">
        De bestanden gaan vannacht naar de prullenbak en blijven daar 30 dagen; terughalen kan dus nog.

async function verwijderAuto(id, tochWeg){
  const v=V.find(x=>x.id===id); if(!v)return;
  if(!apiOk){const f=document.getElementById('del-fout'); if(f)f.textContent="Geen verbinding met de server."; return;}
  const knop=document.getElementById('del-ok'); if(knop){knop.disabled=true; knop.textContent="Bezig…";}
  try{
    const r=await fetch("/api/vehicle-del",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id, tochWeg:tochWeg===true})});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){ sluitVerwijderen(); vraagVerwijderen(id,true,j.waarschuwing); return; }
    if(!r.ok){ const f=document.getElementById('del-fout'); if(f)f.textContent=j.error||"Verwijderen mislukt."; if(knop){knop.disabled=false; knop.textContent="Definitief verwijderen";} return; }
    // Uit het geheugen halen. De gekoppelde to-do's moeten mee: putState() schrijft die tabel
    // helemaal opnieuw uit wat de frontend stuurt, dus wat hier blijft staan komt zo weer terug.
    const i=V.indexOf(v); if(i>-1)V.splice(i,1);
    for(let k=globalTodos.length-1;k>=0;k--) if(globalTodos[k].vehicleId===id)globalTodos.splice(k,1);
    delete adPhotos[id];
    logActivity('Auto verwijderd', `${j.naam||id} (${v.kenteken&&v.kenteken!=='—'?v.kenteken:v.vin})`, null);
    scheduleSave();
    sluitVerwijderen();
    showToast(j.autoboekRij?`Auto verwijderd — staat nog op rij ${j.autoboekRij} van het Autoboek`:"Auto verwijderd",false);
    go('komende');
  }catch(_){ const f=document.getElementById('del-fout'); if(f)f.textContent="Geen verbinding met de server."; if(knop){knop.disabled=false; knop.textContent="Definitief verwijderen";} }
}

function toggleSubtask(id,sid,checked){const v=V.find(x=>x.id===id); if(!v)return; const st=v.subtasks.find(s=>s.id===sid); if(!st)return;
  const pv=st.done, pda=st.doneAt, pdb=st.doneBy; st.done=checked;
  if(checked){ st.doneAt=Date.now(); st.doneBy=(currentUser&&currentUser.name)||'?'; logActivity('Extra taak afgevinkt',`${st.text} (${v.merk} ${v.model})`,id); }
  else { st.doneAt=null; st.doneBy=null; }
  pushUndo(`${v.merk} ${v.model} — extra taak ${checked?'afgevinkt':'heropend'}: ${st.text}`, ()=>{st.done=pv; st.doneAt=pda; st.doneBy=pdb;}); rerender();}
function assignSubtask(id,sid,val){const v=V.find(x=>x.id===id); if(!v)return; const st=v.subtasks.find(s=>s.id===sid); if(!st)return;
  const po=st.owner; st.owner=val||null;

function delSubtask(id,sid){const v=V.find(x=>x.id===id); if(!v)return; const i=v.subtasks.findIndex(s=>s.id===sid); if(i<0)return; const st=v.subtasks[i];

/* ===== Nieuwe auto toevoegen (de plusknop) =====
   PVP is hiermee het invoerpunt voor pas ingekochte auto's; tot nu toe ging dat rechtstreeks in het
   Autoboek, en dat liep aantoonbaar uiteen. Zie PVP-autoboek-koppeling-voorstel.md.
   De documenten worden pas ná het opslaan geüpload: ze horen bij een auto-id, en dat id (de VIN, of
   het kenteken als er geen VIN is) staat pas vast als het formulier is ingevuld. */
let nieuweDocs=[];   // [{name,dataUrl}] — in het geheugen tot er een id is
/* accept="image/*" alleen is niet genoeg: Chrome op de Mac grijst .heic-bestanden dan uit in het
   keuzevenster, want HEIC staat daar niet in de lijst met bekende afbeeldingstypen. De extensies
   er expliciet bij zetten lost dat op, en schaadt niets op andere systemen. */
const FOTO_ACCEPT="image/*,.heic,.heif,.HEIC,.HEIF";
const DOC_ACCEPT="application/pdf,image/*,.heic,.heif,.HEIC,.HEIF";
const BRANDSTOFFEN=["Benzine","Diesel","Elektrisch","PHEV","Hybride","LPG"];
