const km = n => (n==null?"—":n.toLocaleString("nl-NL")+" km");

function stepList(v){
  if(!v.importAuto) return TAIL.slice();
  let L=IMPORT_BASE.concat([DECISION]);
  if(v.route==='JA') L=L.concat(ROUTE_JA,TAIL);
  else if(v.route==='NEE') L=L.concat(ROUTE_NEE,TAIL);
  return L;
}
function steps(v){
  const L=stepList(v); const done=v.klaar||0;
  return {arr:L.map((st,i)=>({label:st.label,cat:st.cat,decision:!!st.decision,state:i<done?'done':(i===done?'current':'todo'),i})),
    currentIdx: done<L.length?done:null, done:Math.min(done,L.length), total:L.length, list:L};
}
function currentAction(v){
  if(v.status!=='lopende')return null;
  const s=steps(v); if(s.currentIdx==null)return null; const st=s.list[s.currentIdx];
  if(st.decision) return {actie:"BPM Taxatie kiezen: JA of NEE",decision:true,cat:st.cat};
  return {actie:(ACTIEVERB[st.label]||st.label),cat:st.cat};
}
function pav(name){const k=PKEY[name]; return `<span class="pav" style="background:var(--${k})">${initials(name)}</span>`;}

/* ===== Ongedaan maken (undo) ===== */
const history=[];
function pushUndo(label,undoFn){history.push({label,undoFn}); if(history.length>50)history.shift(); updateUndoUI(); showToast(label,true);}
function undoLast(){ if(!history.length)return; const e=history.pop(); e.undoFn(); updateUndoUI(); rerender(); showToast("Ongedaan gemaakt: "+e.label,false);}
function updateUndoUI(){const b=document.getElementById("undoBtn"); if(!b)return; if(history.length){b.disabled=false; b.title="Ongedaan maken: "+history[history.length-1].label;} else {b.disabled=true; b.title="Niets om ongedaan te maken";}}
let toastT=null;
function showToast(msg,withUndo){
  let t=document.getElementById("toast"); if(!t){t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t);}
  t.innerHTML=`<span>${msg}</span>${withUndo?`<button class="tundo" onclick="undoLast()">Ongedaan maken</button>`:""}<button class="tx" onclick="hideToast()" title="Sluiten">×</button>`;
  t.classList.add("show"); if(toastT)clearTimeout(toastT); toastT=setTimeout(hideToast,6000);
}
function hideToast(){const t=document.getElementById("toast"); if(t)t.classList.remove("show");}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault(); undoLast();}});

  const rows=lop.map(v=>{const s=steps(v);const pct=s.total?Math.round(s.done/s.total*100):0;
    const st=s.currentIdx==null?null:s.list[s.currentIdx];
    const cur=st==null?`<span class="badge b-lopende">✓ Verkoopklaar</span>`
      :(st.decision?`<span class="phase-lab">BPM Taxatie?</span> <span class="need">keuze nodig</span>`:`<span class="phase-lab">${st.label}</span>`);
    const rb=v.importAuto&&v.route?`<span class="route-badge rbg-${v.route==='JA'?'ja':'nee'}">${v.route}</span>`:'';
    return `<tr><td><div class="veh-cell" onclick="openVeh('${v.id}')"><div class="thumb">${carIcon()}</div><div><div class="nm">${v.merk} ${v.model}</div><div class="id">${v.kenteken!=='—'?v.kenteken:v.vin}</div></div></div></td>
      <td style="min-width:220px"><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div style="margin-top:5px">${cur} <span class="muted" style="font-size:11px">· ${s.done}/${s.total}</span></div></td>
      <td><span class="tag ${v.importAuto?'tag-imp':'tag-nl'}">${v.importAuto?'Import':'NL'}</span> ${rb}</td>
      <td>${v.owner?pav(v.owner):`<span class="pav" style="background:var(--slate)">?</span>`}</td></tr>`;}).join("");
  app.innerHTML=`
    <h1 class="page-title">Lopende auto's</h1><p class="page-sub">Binnengekomen auto's met hun stap in de import/BPM-flow.</p>
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start">
      <div class="card"><div class="card-body" style="padding:0 4px"><table><thead><tr><th>Voertuig</th><th>Voortgang</th><th>Route</th><th>Wie</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div class="card"><h3>Waar staan ze?</h3><div class="card-body"><div class="funnel">
        ${CATS.map((c,i)=>`<div class="fn"><div class="fl">${c}</div><div class="track"><div class="fill" style="width:${Math.round(perCat[i]/maxc*100)}%;${perCat[i]===0?'background:transparent':''}">${perCat[i]||''}</div></div><div class="fc">${perCat[i]}</div></div>`).join("")}
      </div><div style="margin-top:10px;font-size:12px;color:var(--muted)">Toont waar de lopende auto's nu staan in de flow — de langste balk is het knelpunt.</div></div></div>
    </div>`;
}

/* ===== Detail ===== */
function openVeh(id){
  const v=V.find(x=>x.id===id); if(!v)return; state.view="veh:"+id; setNav(v.status==='lopende'?'lopende':'komende');
  const s=steps(v); const act=currentAction(v);
  const specs=[["Kenteken",v.kenteken],["VIN / chassis",`<span class="mono">${v.vin}</span>`],["Merk & model",`${v.merk} ${v.model}`],["Uitvoering",v.uitv],["1e toelating",v.reg],["Km-stand",km(v.km)],["Brandstof",v.brandstof],["Transmissie",v.transm],["Leverancier",v.lev],["Datum inkoop",v.inkoopdatum]];
  const opts=['<option value="">— niemand</option>'].concat(PEOPLE.map(p=>`<option value="${p}" ${v.owner===p?'selected':''}>${p}</option>`)).join("");
  app.innerHTML=`
    <div class="back" onclick="go('${v.status}')">← Terug</div>
    <div class="det-head">
      <div class="hero"><svg width="64" height="40" viewBox="0 0 24 24" fill="#aebfce">${carIcon().replace('width="20" height="13"','')}</svg></div>
      <div class="det-title" style="flex:1;min-width:260px">
        <h1>${v.merk} ${v.model}</h1><div class="sub">${v.uitv}</div>
        <div class="chips">${badge(v.status)}<span class="chip"><b>Km</b> ${km(v.km)}</span><span class="chip"><b>1e reg</b> ${v.reg}</span><span class="chip"><b>Traject</b> ${v.importAuto?'Import (volledig)':'NL (kort)'}</span></div>
        ${v.status==='komende'
          ? `<div class="infobar"><div class="ai">🚚</div><div>${v.note}</div></div><div style="margin-top:10px;display:flex;align-items:center;gap:10px"><label class="chk"><input type="checkbox" onchange="arrive('${v.id}',this.checked)"><span class="box"></span></label><span style="font-weight:650;font-size:13.5px">Binnengekomen — start stap 1</span></div>`
          : (act? `<div class="infobar"><div class="ai">▶</div><div>Nu aan de beurt: <b>${act.actie}</b></div></div>`
                : `<div class="infobar" style="background:var(--green-soft);border-color:#bfe6d1;color:var(--green)"><div class="ai" style="background:#cbecdb;color:var(--green)">✓</div><div><b>Verkoopklaar</b> — alle stappen afgerond</div></div>`)}
      </div>
    </div>
    <div class="det-grid">
      <div style="display:flex;flex-direction:column;gap:18px">
        ${v.status==='lopende'?`<div class="card"><h3>Import/BPM-traject <span class="muted" style="font-weight:500;font-size:12.5px">${s.done}/${s.total} stappen${v.route?` · route ${v.route}`:''}</span></h3><div class="card-body" style="padding:6px 16px 12px">
          ${s.arr.map((st,idx)=>{
            if(st.decision){return `<div class="tstep ${st.state}"><div class="tnum ${st.state==='done'?'done':'cur'}">${st.state==='done'?'✓':'?'}</div><div style="flex:1"><div class="h">BPM Taxatie? ${v.route?`<span class="route-badge rbg-${v.route==='JA'?'ja':'nee'}">gekozen: ${v.route}</span>`:''}</div><div class="route-btns"><button class="rb ja ${v.route==='JA'?'active-ja':''}" onclick="choose('${v.id}','JA')">JA — via S-TAX</button><button class="rb nee ${v.route==='NEE'?'active-nee':''}" onclick="choose('${v.id}','NEE')">NEE — zelf</button></div></div></div>`;}
            return `<div class="tstep ${st.state}"><label class="chk"><input type="checkbox" ${st.state==='done'?'checked':''} onchange="setStep('${v.id}',${idx},this.checked)"><span class="box"></span></label><div style="flex:1"><div class="h">${st.label}</div><div class="d">${st.state==='done'?'Afgerond':st.state==='current'?'Nu aan de beurt':'Nog te doen'}</div></div></div>`;
          }).join("")}
          ${v.importAuto&&!v.route?`<div class="muted" style="font-size:12px;padding:8px 2px 0">Kies bij “BPM Taxatie?” JA of NEE om de vervolgstappen te bepalen.</div>`:''}
        </div></div>`:''}
        ${v.status==='lopende'&&v.importAuto?PHOTO_GROUPS.map(g=>photoCard(v,g)).join(''):''}
        <div class="card"><h3>Specificaties</h3><div class="card-body"><div class="spec-grid">${specs.map(([k,val])=>`<div class="spec"><span class="k">${k}</span><span class="v">${val||'—'}</span></div>`).join("")}</div></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:18px">
        ${v.status==='lopende'?`<div class="card"><h3>Verantwoordelijke</h3><div class="owner-box">${v.owner?pav(v.owner):`<span class="pav" style="background:var(--slate)">?</span>`}<div style="flex:1"><div style="font-weight:650;font-size:13.5px">${v.owner||'Niet toegewezen'}</div><div class="muted" style="font-size:12px">voor huidige fase</div></div><select class="assign" onchange="assign('${v.id}',this.value)">${opts}</select></div></div>`:''}
        <div class="card"><h3>Herkomst</h3><div class="card-body">
          <div class="spec"><span class="k">Bron</span><span class="v">Autoboek · Komende Autos</span></div>
          <div class="spec"><span class="k">Leverancier</span><span class="v">${v.lev}</span></div>
          <div class="spec" style="border-bottom:0"><span class="k">Transport / status</span><span class="v" style="max-width:160px">${v.note}</span></div>
        </div></div>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

/* ===== Acties ===== */
function arrive(id,checked){const v=V.find(x=>x.id===id); if(!v)return;
  const ps=v.status, pk=v.klaar, pr=v.route;
  v.status=(checked===false)?"komende":"lopende"; v.klaar=0; v.route=null;
  pushUndo(`${v.merk} ${v.model} ${v.status==='lopende'?'op binnen gezet':'teruggezet naar komende'}`, ()=>{v.status=ps; v.klaar=pk; v.route=pr;});
  rerender();}
function assign(id,val){const v=V.find(x=>x.id===id); if(!v)return;
  const po=v.owner; v.owner=val||null;
  pushUndo(`${v.merk} ${v.model} toegewezen aan ${v.owner||'niemand'}`, ()=>{v.owner=po;});
  rerender();}
function choose(id,route){const v=V.find(x=>x.id===id); if(!v)return;
  const pr=v.route, pk=v.klaar; v.route=route; v.klaar=DEC_IDX+1;
  pushUndo(`${v.merk} ${v.model} — BPM Taxatie: ${route}`, ()=>{v.route=pr; v.klaar=pk;});
  rerender();}
function setStep(id,i,checked){const v=V.find(x=>x.id===id); if(!v)return;
  const pk=v.klaar; v.klaar = checked? i+1 : i;
  const lbl=stepList(v)[i]?stepList(v)[i].label:'stap';
  pushUndo(`${v.merk} ${v.model} — ${checked?'afgevinkt':'teruggezet'}: ${lbl}`, ()=>{v.klaar=pk;});
  rerender();}
/* ===== Foto's per stap: Voertuig→RDW Foto's, Documentatie→Papieren Foto's ===== */
function grpReqCount(v,g){return g.items.filter(p=>p.req&&v.photos[p.key]).length;}
function grpReqTotal(g){return g.items.filter(p=>p.req).length;}
function setPhoto(id,key,input){const v=V.find(x=>x.id===id); if(!v||!input.files||!input.files[0])return;
  const f=input.files[0]; const r=new FileReader();
  r.onload=e=>{const prev=v.photos[key]; v.photos[key]=e.target.result;
    pushUndo(`${v.merk} ${v.model} — foto toegevoegd: ${PHOTO_BY_KEY[key].label}`, ()=>{ if(prev)v.photos[key]=prev; else delete v.photos[key]; });
    rerender();};
  r.readAsDataURL(f); input.value="";}
function removePhoto(id,key){const v=V.find(x=>x.id===id); if(!v)return; const prev=v.photos[key]; if(!prev)return;
  delete v.photos[key];
  pushUndo(`${v.merk} ${v.model} — foto verwijderd: ${PHOTO_BY_KEY[key].label}`, ()=>{v.photos[key]=prev;});
  rerender();}
function finishPhotoStep(id,stepIdx){const v=V.find(x=>x.id===id); if(!v)return; const pk=v.klaar; v.klaar=Math.max(v.klaar||0,stepIdx+1);
  pushUndo(`${v.merk} ${v.model} — stap afgerond`, ()=>{v.klaar=pk;}); rerender();}
function photoCard(v,g){
  const reqDone=grpReqCount(v,g), reqTot=grpReqTotal(g);
  const optDone=g.items.filter(p=>!p.req&&v.photos[p.key]).length;
  const allReq=reqDone===reqTot, stepDone=(v.klaar||0)>=g.stepIdx+1;
  const slots=g.items.map(p=>{const img=v.photos[p.key]; const inputId=`ph-${v.id}-${p.key}`;
    return `<div class="pslot">
      <div class="ptile ${img?'has':''}" onclick="document.getElementById('${inputId}').click()" title="${img?'Vervangen':'Foto toevoegen'}">
        ${img?`<img src="${img}" alt=""><span class="pcheck">✓</span><button class="premove" title="Verwijderen" onclick="event.stopPropagation();removePhoto('${v.id}','${p.key}')">×</button>`
             :`<span class="pcam">📷</span><span class="padd">Toevoegen</span>`}
      </div>
      <input id="${inputId}" type="file" accept="image/*" capture="environment" style="display:none" onchange="setPhoto('${v.id}','${p.key}',this)">
      <div class="plabel">${p.label} ${p.req?`<span class="preq">verplicht</span>`:`<span class="popt">optioneel</span>`}</div>
      ${p.instr?`<div class="pinstr">${p.instr}</div>`:''}
    </div>`;}).join("");
  return `<div class="card"><h3>${g.step} <span class="muted" style="font-weight:500;font-size:12.5px">${reqDone}/${reqTot} verplicht${optDone?` · ${optDone} extra`:''}</span></h3>
    <div class="card-body">
      <div class="pgrid">${slots}</div>
      ${allReq
        ? (stepDone
            ? `<div class="infobar" style="background:var(--green-soft);border-color:#bfe6d1;color:var(--green);margin-top:12px"><div class="ai" style="background:#cbecdb;color:var(--green)">✓</div><div>Alle verplichte foto's compleet — stap “${g.step}” afgerond.</div></div>`
            : `<button class="btn btn-primary" style="margin-top:12px" onclick="finishPhotoStep('${v.id}',${g.stepIdx})">${g.step} afronden → volgende stap</button>`)
        : `<div class="muted" style="font-size:12px;margin-top:10px">Voeg de ${reqTot} verplichte foto's toe om deze stap af te ronden.</div>`}
      <div class="note" style="margin-top:10px">Demo: foto's worden nu alleen in je browser bewaard (nog niet op een server). Met de database komen ze centraal en gedeeld.</div>
    </div></div>`;
}
function rerender(){
  if(state.view==="vandaag")renderVandaag();
  else if(state.view==="komende")renderKomende();
  else if(state.view==="lopende")renderLopende();
  else if(state.view.startsWith("veh:"))openVeh(state.view.split(":")[1]);
  updateUndoUI();
}
function setNav(view){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));}
function go(view){state.view=view; if(["vandaag","komende","lopende"].includes(view))setNav(view); rerender(); window.scrollTo(0,0);}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value; if(state.view.startsWith("veh:"))go("komende"); else rerender(); document.getElementById("search").focus();});
go("vandaag");
</script>
</body>
</html>
