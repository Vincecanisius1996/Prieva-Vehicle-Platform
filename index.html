// Datums in PVP zijn tekst in de vorm dd-mm-jjjj. Accepteer wat mensen typen en maak er dat van.
function normDatum(s){
  s=(s||"").trim(); if(!s)return "";
  let m=/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/.exec(s);        // 2021-05-20
  if(m)return `${String(m[3]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}-${m[1]}`;
  m=/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})$/.exec(s);          // 20-5-2021 / 20/05/21
  if(m){const j=m[3].length===2?"20"+m[3]:m[3]; return `${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}-${j}`;}
  return s;   // niet herkend: laten staan, de gebruiker ziet het zelf terug
}
function openAutoModal(wijzigId){
  // Eén formulier voor toevoegen én corrigeren. Twee formulieren met dezelfde velden lopen uiteen,
  // en dan mist het ene een veld dat het andere wel heeft.
  const bestaand = wijzigId ? V.find(x=>x.id===wijzigId) : null;
  if(wijzigId && !bestaand){ showToast("Die auto is niet gevonden",false); return; }
  nieuweDocs=[];
  let ov=document.getElementById('autoModal');
  if(!ov){ov=document.createElement('div'); ov.id='autoModal'; ov.className='modal-ov';
    ov.addEventListener('click',e=>{if(e.target===ov)closeAutoModal();});
    // Onthouden wat jij zelf hebt getypt. Een waarde die het uitlezen heeft neergezet mag een volgende,
    // betere uitlezing overschrijven; wat jij intikt niet. Zonder dat onderscheid blijft de eerste,
    // magere lezing staan zodra je er een document bij doet — precies hoe 69.532 km 69.533 werd.
    ov.addEventListener('input',e=>{if(e.target.id&&e.target.id.indexOf('na-')===0)e.target.dataset.bron='hand';});
    document.body.appendChild(ov);}
  const kies=(id,lijst)=>`<select id="${id}"><option value="">—</option>${lijst.map(x=>`<option value="${x}">${x}</option>`).join("")}</select>`;
  const veld=(id,label,extra="",type="text")=>`<div><label>${label}</label><input type="${type}" id="${id}" ${extra}></div>`;
  ov.innerHTML=`<div class="modal wide">
    <h3>${bestaand?'Gegevens wijzigen':'Auto toevoegen'} <button class="mclose" onclick="closeAutoModal()" title="Sluiten">×</button></h3>
    <div class="mb">
      ${bestaand?`<div class="note" style="margin:0 0 4px">Je corrigeert <b>${esc((bestaand.merk||'')+' '+(bestaand.model||''))}</b>. Alleen de velden die je aanpast worden ook in het Autoboek bijgewerkt; de rest blijft daar staan zoals het stond. De interne sleutel van de auto verandert niet.</div>`:''}
      <div class="fsec" ${bestaand?'style="display:none"':''}>Documenten</div>
      <div class="full" ${bestaand?'style="display:none"':''}>
        <div class="drop" id="na-drop" onclick="document.getElementById('na-files').click()">
          Koopovereenkomst, proforma, screenshots — klik of sleep hierheen.<br>
          <span style="font-size:11px">Ze worden bij de auto bewaard en meteen uitgelezen; kijk daarna na wat er is ingevuld.</span>
        </div>
        <input type="file" id="na-files" multiple accept="${DOC_ACCEPT}" style="display:none" onchange="autoDocsKiezen(this.files); this.value='';">
        <div class="doclist" id="na-doclist"></div>
        <div id="na-uitlees" style="margin-top:9px"></div>
      </div>
      <div class="fsec">Identificatie</div>
      <div class="fgrid">
        ${veld('na-vin','VIN / chassisnummer','oninput="autoImportRaden()"')}
        ${veld('na-kenteken','Kenteken','oninput="autoImportRaden()"')}
        <div><label>Traject</label><label style="display:flex;align-items:center;gap:7px;font-weight:500;padding-top:6px">
          <input type="checkbox" id="na-import"> Import (volledig traject)</label></div>
      </div>
      <div class="fsec">Voertuig</div>
      <div class="fgrid">
        ${veld('na-merk','Merk')}
        ${veld('na-model','Model')}
        <div class="full">${veld('na-uitv','Uitvoering')}</div>
        ${veld('na-kleur','Kleur')}
        <div><label>Brandstof</label>${kies('na-brandstof',BRANDSTOFFEN)}</div>
        <div><label>Transmissie</label>${kies('na-transm',TRANSMISSIES)}</div>
        ${veld('na-reg','1e toelating (dd-mm-jjjj)')}
        ${veld('na-km','Km-stand')}
      </div>
      <div class="fsec">Inkoop</div>
      <div class="fgrid">
        ${veld('na-lev','Leverancier')}
        ${veld('na-inkoopdatum','Datum inkoop (dd-mm-jjjj)')}
        ${veld('na-factuurnr','Factuurnummer')}
        ${veld('na-inkoopprijs','Inkoopprijs (€, excl.)')}
        ${veld('na-batch','Transportdatum (dd-mm)')}
        <div class="full">${veld('na-note','Notitie')}</div>
      </div>
      <div id="na-fout" class="fout full"></div>
    </div>
    <div class="mf">
      <button class="btn btn-ghost" onclick="closeAutoModal()">Annuleren</button>
      <button class="btn btn-primary" id="na-opslaan" onclick="${bestaand?`opslaanWijziging('${wijzigId}')`:'opslaanAuto()'}">${bestaand?'Wijzigingen opslaan':'Toevoegen »'}</button>
    </div>
  </div>`;
  const d=document.getElementById('na-drop');
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault(); d.classList.add('over');}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault(); d.classList.remove('over');}));
  d.addEventListener('drop',async ev=>{ ev.preventDefault(); autoDocsKiezen(await entriesFromDrop(ev.dataTransfer)); });
  // Bij corrigeren staat alles al ingevuld; anders zou je het hele formulier moeten overtypen om
  // één kilometerstand recht te zetten.
  if(bestaand){
    const z=(id,w)=>{const e=document.getElementById(id); if(e&&w!==null&&w!==undefined&&w!=='—')e.value=w;};
    z('na-vin',bestaand.vin); z('na-kenteken',bestaand.kenteken); z('na-merk',bestaand.merk);
    z('na-model',bestaand.model); z('na-uitv',bestaand.uitv); z('na-kleur',bestaand.kleur);
    z('na-brandstof',bestaand.brandstof); z('na-transm',bestaand.transm); z('na-reg',bestaand.reg);
    z('na-km',bestaand.km); z('na-lev',bestaand.lev); z('na-inkoopdatum',bestaand.inkoopdatum);
    z('na-batch',bestaand.batch); z('na-note',bestaand.note); z('na-factuurnr',bestaand.factuurnr);
    z('na-inkoopprijs',bestaand.inkoopprijs);
    const imp=document.getElementById('na-import'); if(imp){imp.checked=!!bestaand.importAuto; imp.dataset.hand='1';}
  }
  ov.classList.add('show');
  setTimeout(()=>{const el=document.getElementById(bestaand?'na-km':'na-vin'); if(el)el.focus();},40);
}

/* Corrigeren. Stuurt het hele formulier op; de server bepaalt wat er werkelijk veranderd is en
   werkt alleen díé velden bij — in PVP en in het Autoboek. */
async function opslaanWijziging(id){
  const w=x=>{const e=document.getElementById(x); return e?e.value.trim():"";};
  const fout=document.getElementById('na-fout');
  const body={ id,
    vin:w('na-vin'), kenteken:w('na-kenteken'), merk:w('na-merk'), model:w('na-model'), uitv:w('na-uitv'),
    kleur:w('na-kleur'), brandstof:w('na-brandstof'), transm:w('na-transm'), reg:normDatum(w('na-reg')),
    km:w('na-km'), lev:w('na-lev'), inkoopdatum:normDatum(w('na-inkoopdatum')), batch:w('na-batch'),
    note:w('na-note'), factuurnr:w('na-factuurnr'), inkoopprijs:w('na-inkoopprijs'),
    importAuto:!!(document.getElementById('na-import')||{}).checked };
  if(!body.vin&&!body.kenteken){fout.textContent="Een auto moet een VIN of een kenteken houden."; return;}
  if(!apiOk){fout.textContent="Geen verbinding met de server."; return;}
  const knop=document.getElementById('na-opslaan'); knop.disabled=true; knop.textContent="Bezig…"; fout.textContent="";
  const terug=()=>{knop.disabled=false; knop.textContent="Wijzigingen opslaan";};
  try{
    const r=await fetch("/api/vehicle",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409){fout.textContent="Een andere auto heeft dit VIN of kenteken al."; terug(); return;}
    if(r.status===400){fout.textContent=(j.velden||[]).length?("Controleer: "+j.velden.join(', ')):(j.error||"Er klopt iets niet aan de invoer."); terug(); return;}
    if(!r.ok){fout.textContent="Opslaan mislukt — probeer het opnieuw."; terug(); return;}
    await loadVehicles(); await loadState();
    const n=(j.gewijzigd||[]).length;
    if(n){ logActivity('Gegevens gewijzigd',(j.gewijzigd||[]).join(', '),id); scheduleSave(); }
    closeAutoModal();
    const ab=j.autoboek||{};
    const staart = !n ? "" : ab.status==='ok' ? " — ook in het Autoboek bijgewerkt ✓"
                 : ab.status==='fout' ? " — NIET in het Autoboek, zie de auto zelf"
                 : "";
    showToast(n?`${n} veld${n===1?'':'en'} gewijzigd`+staart:"Er was niets gewijzigd",true);
    if(state.view==='veh:'+id)rerenderCurrent();
  }catch(_){ fout.textContent="Geen verbinding met de server."; terug(); }
}
function closeAutoModal(){const ov=document.getElementById('autoModal'); if(ov)ov.classList.remove('show'); nieuweDocs=[];}
// Import is de regel bij een VIN zonder NL-kenteken; blijft met de hand te wijzigen.
function autoImportRaden(){
  const vin=(document.getElementById('na-vin')||{}).value||"", k=(document.getElementById('na-kenteken')||{}).value||"";
  const c=document.getElementById('na-import'); if(c&&!c.dataset.hand)c.checked=!!vin.trim()&&!k.trim();
}
async function autoDocsKiezen(files){
  for(const f of Array.from(files||[])){
    // Afbeeldingen langs leesFoto (verkleinen), pdf's rechtstreeks — een pdf mag nooit langs een canvas.
    // Eén onleesbaar bestand mag de rest niet tegenhouden.
    try{
      const dataUrl=f.type==='application/pdf' ? await leesBestand(f) : await leesFoto(f);
      if(dataUrl)nieuweDocs.push({name:f.name,dataUrl});
    }catch(_){ showToast(`Kon "${f.name}" niet lezen — overgeslagen`,false); }
  }
  toonDocs();
  // Meteen uitlezen, zonder dat er nog op een knop gedrukt moet worden. Wie twaalf stukken aanlevert,
  // verwacht dat PVP zijn werk doet — een knop die je eerst moet vinden hoort daar niet tussen.
  if(kanUitlezen&&nieuweDocs.length)autoUitlezen();
}
function toonDocs(){
  const el=document.getElementById('na-doclist'); if(!el)return;
  el.innerHTML=nieuweDocs.map((d,i)=>`<div class="docrow"><span>${d.name.toLowerCase().endsWith('.pdf')?ico('doc',15):ico('image',15)}</span><span class="dn">${d.name}</span><button class="dx" onclick="autoDocWeg(${i})" title="Weghalen">×</button></div>`).join("")
    + (nieuweDocs.length&&kanUitlezen?`<button class="btn btn-ghost" style="margin-top:4px;justify-content:center" onclick="autoUitlezen()">Stukken opnieuw lezen</button>`:"");
}
function autoDocWeg(i){nieuweDocs.splice(i,1); toonDocs();}

/* ===== Stukken laten uitlezen =====
   Vult het formulier vóór, maar slaat niets op: jij kijkt het na. Een veld dat leeg blijft is geen
   storing maar een signaal — dan mist die informatie in de aangeleverde stukken. */
const UITLEES_VELDEN=[["vin","na-vin"],["kenteken","na-kenteken"],["merk","na-merk"],["model","na-model"],
  ["uitv","na-uitv"],["kleur","na-kleur"],["brandstof","na-brandstof"],["transm","na-transm"],
  ["reg","na-reg"],["km","na-km"],["inkoopdatum","na-inkoopdatum"],["factuurnr","na-factuurnr"],
  ["inkoopprijs","na-inkoopprijs"],["note","na-note"]];
const UITLEES_NAMEN={vin:"VIN",kenteken:"Kenteken",merk:"Merk",model:"Model",uitv:"Uitvoering",kleur:"Kleur",
  brandstof:"Brandstof",transm:"Transmissie",reg:"1e toelating",km:"Km-stand",inkoopdatum:"Datum inkoop",
  factuurnr:"Factuurnummer",inkoopprijs:"Inkoopprijs",note:"Notitie",lev:"Leverancier",batch:"Transportdatum"};
// Deze twee komen nooit uit de stukken (bewezen op tien echte auto's) — die vraag je gewoon.
const ALTIJD_ZELF=["lev","batch"];
let uitleesBezig=false;
async function autoUitlezen(){
  if(!nieuweDocs.length){showToast("Voeg eerst documenten toe",false);return;}
  if(uitleesBezig)return;                       // twee keer tegelijk kost dubbel en levert niets extra's
  const vak=document.getElementById('na-uitlees'); if(!vak)return;
  uitleesBezig=true;
  vak.innerHTML=`<div class="muted" style="font-size:12px">Stukken lezen… (dit duurt 5 tot 20 seconden)</div>`;
  try{
    const r=await fetch("/api/uitlezen",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({docs:nieuweDocs.map(d=>({name:d.name,dataUrl:d.dataUrl}))})});
    // Een te grote upload komt terug als 413 van nginx, en die geeft geen json. Zonder deze controle
    // zegt de app "geen verbinding met de server", en dan zoek je op de verkeerde plek.
    if(r.status===413){vak.innerHTML=`<div class="fout">De stukken zijn samen te groot om in één keer te lezen. Laat een paar veilingfoto's weg — de gegevens staan toch op de screenshot en in het rapport.</div>`; return;}
    const j=await r.json().catch(()=>null);
    if(!j){vak.innerHTML=`<div class="fout">Onverwacht antwoord van de server.</div>`; return;}
    if(j.uit||j.fout){vak.innerHTML=`<div class="fout">${j.fout||'automatisch uitlezen staat uit'}</div>`; return;}
    const gevuld=[], leeg=[], bijgewerkt=[], botst=[];
    for(const [veld,id] of UITLEES_VELDEN){
      const el=document.getElementById(id); if(!el)continue;
      const w=j.velden?j.velden[veld]:null;
      if(w===null||w===undefined||w===""){ if(!el.value)leeg.push(veld); continue; }
      if(el.value===String(w)) continue;                       // stond er al zo
      if(!el.value){ el.value=String(w); el.dataset.bron='uitlezen'; gevuld.push(veld); continue; }
      if(el.dataset.bron==='uitlezen'){                        // van een vorige, mindere lezing
        bijgewerkt.push([veld,el.value,String(w)]);
        el.value=String(w); continue;
      }
      botst.push([veld,el.value,String(w)]);                   // door jou getypt: blijft staan
    }
    if(j.velden&&typeof j.velden.importAuto==='boolean'){
      const c=document.getElementById('na-import'); if(c){c.checked=j.velden.importAuto; c.dataset.hand="1";}
    }
    leeg.push(...ALTIJD_ZELF);
    const bron=v=>(j.bronnen&&j.bronnen[v])?` <span class="muted" style="font-weight:400">(${j.bronnen[v]})</span>`:'';
    vak.innerHTML=`
      <div style="font-size:12px;line-height:1.7">
        <div style="color:#1a7f37;font-weight:600">✓ ${gevuld.length} veld(en) ingevuld uit ${j.gebruikt.length} stuk(ken)</div>
        ${gevuld.length?`<div class="muted">${gevuld.map(v=>`${UITLEES_NAMEN[v]||v}${bron(v)}`).join(' · ')}</div>`:''}
        ${bijgewerkt.length?`<div style="color:#1a7f37;margin-top:5px"><b>Bijgewerkt:</b> ${bijgewerkt.map(([v,o,n])=>`${UITLEES_NAMEN[v]||v} ${o} → ${n}`).join(' · ')}</div>`:''}
        ${botst.length?`<div style="color:#c0392b;margin-top:5px"><b>Wijkt af van de stukken:</b> ${botst.map(([v,o,n])=>`${UITLEES_NAMEN[v]||v} — jij ${o}, de stukken ${n}`).join(' · ')}. Jouw invoer blijft staan; kijk na welke klopt.</div>`:''}
        ${j.onzeker&&j.onzeker.length?`<div style="color:#b26a00;margin-top:5px"><b>Nakijken:</b> ${j.onzeker.map(v=>UITLEES_NAMEN[v]||v).join(', ')} — de stukken spreken elkaar tegen</div>`:''}
        ${leeg.length?`<div style="color:#c0392b;margin-top:5px"><b>Niet gevonden:</b> ${leeg.map(v=>UITLEES_NAMEN[v]||v).join(', ')} — vul zelf aan of voeg een document toe</div>`:''}
        ${j.overgeslagen&&j.overgeslagen.length?`<div class="muted" style="margin-top:5px">Overgeslagen: ${j.overgeslagen.join(', ')}</div>`:''}
        ${j.verbruik?`<div class="muted" style="margin-top:5px;font-size:11px">${j.verbruik.in.toLocaleString('nl-NL')} tokens gelezen · circa ${(j.verbruik.in*3/1e6+j.verbruik.uit*15/1e6).toFixed(2).replace('.',',')} dollar</div>`:''}
      </div>`;
  }catch(_){ vak.innerHTML=`<div class="fout">Geen verbinding met de server.</div>`; }
  finally{ uitleesBezig=false; }
}
/* Staat deze auto in het Autoboek? Een mislukte schrijfactie mag niet stil verdwijnen — dan ontstaat
   precies het gat tussen PVP en het Autoboek dat we aan het dichten zijn. */
function autoboekCard(v){
  const s=v.autoboekStatus;
  if(!s||s==='uit')return "";                       // koppeling staat uit: niets tonen
  const ok=s==='ok';
  return `<div class="card"><h3>Autoboek</h3><div class="card-body">
    <div class="spec" style="border-bottom:0"><span class="k">Status</span><span class="v" style="max-width:170px">
      ${ok?`<span style="color:#1a7f37">✓ bijgeschreven${v.autoboekRij?` (rij ${v.autoboekRij})`:''}</span>`
          :`<span style="color:#c0392b">✕ nog niet bijgeschreven</span>`}</span></div>
    ${ok?'':`<div class="muted" style="font-size:12px;padding:8px 2px 0">${v.autoboekFout||'onbekende fout'}</div>
      <button class="btn btn-ghost" style="margin-top:9px;width:100%;justify-content:center"
        onclick="autoboekOpnieuw('${v.id}',this)">Opnieuw proberen</button>`}
  </div></div>`;
}
async function autoboekOpnieuw(id,knop){
  if(!apiOk)return; knop.disabled=true; const oud=knop.textContent; knop.textContent="Bezig…";
  try{
    const r=await fetch("/api/autoboek-retry",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});
    const j=r.ok?await r.json():null;
    await loadVehicles(); await loadState();
    showToast(j&&j.autoboek&&j.autoboek.status==='ok'?"In het Autoboek gezet ✓":"Nog steeds niet gelukt",false);
    rerenderCurrent();
  }catch(_){ knop.disabled=false; knop.textContent=oud; showToast("Geen verbinding met de server",false); }
}
// Kaart op de detailpagina met de stukken die bij het toevoegen zijn meegegeven.
function docCard(v){
  const lijst=Array.isArray(v.docs)?v.docs:[];
  if(!lijst.length)return "";
  return `<div class="card"><h3>Inkoopdocumenten</h3><div class="card-body">
    <div class="doclist" style="margin:0">${lijst.map(d=>`<a class="docrow" href="${d.url}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
      <span>${String(d.name||'').toLowerCase().endsWith('.pdf')?ico('doc',15):ico('image',15)}</span><span class="dn">${d.name||'document'}</span><span style="color:var(--muted);font-size:11px">openen ↗</span></a>`).join("")}</div>
  </div></div>`;
}
async function opslaanAuto(){
  const w=id=>{const e=document.getElementById(id); return e?e.value.trim():"";};
  const fout=document.getElementById('na-fout');
  const body={
    vin:w('na-vin'), kenteken:w('na-kenteken'), merk:w('na-merk'), model:w('na-model'), uitv:w('na-uitv'),
    kleur:w('na-kleur'), brandstof:w('na-brandstof'), transm:w('na-transm'), reg:normDatum(w('na-reg')),
    km:w('na-km'), lev:w('na-lev'), inkoopdatum:normDatum(w('na-inkoopdatum')), batch:w('na-batch'),
    note:w('na-note'), factuurnr:w('na-factuurnr'), inkoopprijs:w('na-inkoopprijs'),
    importAuto:!!(document.getElementById('na-import')||{}).checked
  };
  if(!body.vin&&!body.kenteken){fout.textContent="Vul een VIN of een kenteken in — daar hangt de auto aan vast."; return;}
  if(!apiOk){fout.textContent="Geen verbinding met de server; toevoegen kan nu niet."; return;}
  const knop=document.getElementById('na-opslaan'); knop.disabled=true; knop.textContent="Bezig…"; fout.textContent="";
  try{
    const r=await fetch("/api/vehicle",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(r.status===409){fout.textContent="Deze auto staat al in PVP."; knop.disabled=false; knop.textContent="Toevoegen »"; return;}
    if(!r.ok){fout.textContent="Opslaan mislukt — probeer het opnieuw."; knop.disabled=false; knop.textContent="Toevoegen »"; return;}
    const antwoord=await r.json(); const id=antwoord.id;
    let mislukt=0;
    for(const d of nieuweDocs){
      try{ const u=await fetch("/api/vehicledoc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,dataUrl:d.dataUrl,name:d.name})}); if(!u.ok)mislukt++; }
      catch(_){ mislukt++; }
    }
    // Opnieuw inlezen in dezelfde volgorde als bij het opstarten: eerst de catalogus, dan de voortgang.
    // loadVehicles() zet de runtime-velden terug op leeg, dus loadState() moet er direct achteraan.
    await loadVehicles(); await loadState();
    logActivity('Auto toegevoegd',[body.merk,body.model].filter(Boolean).join(' ')||id,id);
    scheduleSave();   // logActivity zet het alleen in het geheugen; dit stuurt het naar de server
    closeAutoModal();
    const ab=antwoord.autoboek||{};
    const staart = mislukt ? ` — ${mislukt} document(en) niet geüpload`
                 : ab.status==='ok'   ? " — ook in het Autoboek gezet ✓"
                 : ab.status==='fout' ? " — nog NIET in het Autoboek, zie de auto zelf"
                 : "";
    showToast("Auto toegevoegd"+staart,false);
    go('komende');
  }catch(_){
    fout.textContent="Geen verbinding met de server."; knop.disabled=false; knop.textContent="Toevoegen »";
  }
}
function addGlobalTodo(){
  const inp=document.getElementById('gt-text'); if(!inp)return; const t=inp.value.trim(); if(!t){inp.focus();return;}
  const owner=document.getElementById('gt-owner').value||null;
  const vehicleId=document.getElementById('gt-veh').value||null;
  const td={id:gtUid++,text:t,owner,vehicleId,done:false,createdAt:Date.now()}; globalTodos.push(td);
  pushUndo(`Algemene to-do toegevoegd: ${t}`, ()=>{const i=globalTodos.indexOf(td); if(i>-1)globalTodos.splice(i,1);});
  closeTodoModal(); if(state.view!=='vandaag')go('vandaag'); else rerender();
}
function toggleGlobalTodo(id,checked){const td=globalTodos.find(x=>x.id===id); if(!td)return; const pv=td.done, pda=td.doneAt, pdb=td.doneBy; td.done=checked;
  if(checked){ td.doneAt=Date.now(); td.doneBy=(currentUser&&currentUser.name)||'?'; logActivity('To-do afgevinkt',td.text,td.vehicleId); }
  else { td.doneAt=null; td.doneBy=null; }
  pushUndo(`Algemene to-do ${checked?'afgevinkt':'heropend'}: ${td.text}`, ()=>{td.done=pv; td.doneAt=pda; td.doneBy=pdb;}); rerender();}
function assignGlobalTodo(id,val){const td=globalTodos.find(x=>x.id===id); if(!td)return; const po=td.owner; td.owner=val||null;

/* ===== Geplande afleveringen (pagina Vandaag) =====
   Wat er nog moet gebeuren vóór een auto de deur uit kan, gesorteerd op de dichtstbijzijnde
   aflevering. Het werk is verdeeld over twee partijen met verschillende deadlines: Carport moet klaar
   zijn ${marge} dagen vóór de aflevering, zodat de poetser daarna nog aan de beurt komt. */
/* ===== Melden als een achtergrondtaak stilstaat =====
   De lijst hieronder is zo actueel als de laatste ronde van de Mobilox-agent. Staat die stil, dan
   klopt het scherm niet meer terwijl het er precies hetzelfde uitziet — en dat is het gevaarlijke
   geval. Alleen tonen als er echt iets mis is, en alleen tijdens de uren dat de taak hoort te lopen:
   een waarschuwing op zondagavond dat er niets is opgehaald is ruis, geen signaal. */
const AGENT_NAMEN={mobilox:'de Mobilox-agent',agenda:'de agenda-koppeling'};
const AGENT_STIL_MIN=45;                 // ruim boven de kwartierronde, zodat één gemiste ronde niet meteen alarmeert
function binnenKantoortijd(d){ const u=d.getHours(); return d.getDay()>=1&&d.getDay()<=6&&u>=7&&u<19; }
function agentBanner(){
  if(!agents.length) return '';
  const nu=Date.now(), werktijd=binnenKantoortijd(new Date());
  const stuk=agents.filter(a=>{
    if(a.ok===false) return true;
    if(!werktijd) return false;
    return !a.geluktTs || (nu-a.geluktTs)>AGENT_STIL_MIN*60000;
  });
  if(!stuk.length) return '';
  const oud=t=>{ if(!t) return 'nog nooit gelukt'; const m=Math.round((nu-t)/60000);
    return m<90?`laatste keer ${m} min geleden`:`laatste keer ${Math.round(m/60)} uur geleden`; };
  return `<div class="banner" style="border-color:#f3d3c9;background:linear-gradient(180deg,#fdf1ec,#fbe7df)">
    <div class="bi" style="background:var(--amber)">${ico("waarschuwing",18)}</div>
    <div style="flex:1"><div class="bt">${stuk.length===1?'Een achtergrondtaak loopt niet':'Achtergrondtaken lopen niet'}</div>
      <div class="bs">${stuk.map(a=>`${AGENT_NAMEN[a.naam]||a.naam}: ${oud(a.geluktTs)}${a.melding&&a.ok===false?' — '+esc(a.melding):''}`).join(' · ')}.
        Wat hieronder staat kan verouderd zijn.</div></div></div>`;
}
// De openstaande werkbon van een auto, als die een afleverdatum heeft. Gebruikt op Lopende en op
// de auto zelf, zodat de afleverdatum niet alleen op de Carport-pagina staat.
function afleverBonVan(vehicleId){
  return [...(carportData.planning||[]),...(carportData.afgemeld||[])]
    .find(b=>b.vehicleId===vehicleId&&b.afleverdatum)||null;
}
/* ===== Voortgang van de taken van één auto =====
   Een ring met het aantal en het percentage. Bewust compact en op één plek gedefinieerd: hij staat in
   de tabel op Lopende, op de afleverkaarten van Vandaag én op de werkbonnen van Carport, en drie
   varianten die net iets anders tellen is precies hoe je mensen aan het rekenen zet. */
function takenVan(vehicleId){
  const v=V.find(x=>x.id===vehicleId);
  const bon=[...(carportData.planning||[]),...(carportData.afgemeld||[])].find(b=>b.vehicleId===vehicleId);
  const carport=(bon&&bon.taken)||[];
  const eigen=(v&&v.subtasks)||[];
  return { carport, eigen, bon: bon||null,
           totaal: carport.length+eigen.length,
           af: carport.filter(t=>t.klaar).length+eigen.filter(t=>t.done).length };
}
function takenRing(af,totaal,titel){
  if(!totaal) return '';
  const pct=Math.round(af/totaal*100);
  const r=9, omtrek=2*Math.PI*r;
  return `<span class="tring${pct===100?' af':''}" title="${esc(titel||`${af} van de ${totaal} taken afgevinkt`)}">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
      <circle class="trbg" cx="12" cy="12" r="${r}"></circle>
      <circle class="trfg" cx="12" cy="12" r="${r}" stroke-dasharray="${omtrek.toFixed(1)}" stroke-dashoffset="${(omtrek*(1-af/totaal)).toFixed(1)}"></circle>
    </svg><b>${af}/${totaal}</b><span class="trpct">${pct}%</span></span>`;
}
/* Een regel van Carport naar de poetser slepen, of terug. Het uitlezen leidt de soort af uit de
   tekst van de overeenkomst en zit er soms naast — "het interieur en exterieur worden grondig
   schoongemaakt" belandde bij Carport. Wie het beter weet, sleept hem. Dat oordeel wordt vastgelegd
   (soort_hand) zodat de agent het de volgende ronde niet terugdraait. */
let taakSleep=null;
function taakSleepStart(ev,id,soort){ taakSleep={id,soort}; try{ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain',String(id));}catch(_){} }
function taakSleepEind(){ taakSleep=null; document.querySelectorAll('.taakkolom.doel').forEach(e=>e.classList.remove('doel')); }
function taakSleepOver(ev,el){ if(!taakSleep)return; ev.preventDefault(); el.classList.add('doel'); }
function taakSleepDrop(ev,el){
  ev.preventDefault(); el.classList.remove('doel');
  const t=taakSleep; taakSleep=null; if(!t)return;
  const naar=el.dataset.kant;
  // Alleen iets doen als de regel écht van kant wisselt. Binnen dezelfde kolom slepen verandert niets,
  // en dan hoeft de soort ook niet overschreven te worden — een APK blijft dan gewoon een APK.
  const soort = naar==='poetser' ? 'poetsen' : (t.soort==='poetsen' ? 'reparatie' : null);
  if(!soort) return;
  carportDoe('/api/carport-taak',{actie:'soort',id:t.id,soort},
    naar==='poetser'?"Naar de poetser verplaatst":"Terug naar Carport verplaatst");
}
let afleverOpen=null;
function afleverKlap(id){ afleverOpen = (afleverOpen===id ? null : id); rerender(); }
function tijdChip(tot, label){
  if(!tot) return `<span class="dl geen">geen datum</span>`;
  const over=tot-Date.now();
  const dag=n=>n===1?'1 dag':n+' dagen', uur=n=>n===1?'1 uur':n+' uur';
  if(over<=0){ const d=Math.ceil(-over/86400000); return `<span class="dl over" title="${esc(label)}">${dag(d)} over tijd</span>`; }
  const d=Math.floor(over/86400000), u=Math.floor((over%86400000)/3600000);
  const kl=d>=5?'ruim':(d>=2?'krap':'nu');
  // "nog 0 dagen 9 uur" leest als een fout. Onder een dag alleen uren, en onder een uur dat zeggen.
  const tekst = d>0 ? (dag(d) + (d<7 ? ' '+uur(u) : '')) : (u>0 ? uur(u) : 'minder dan een uur');
  return `<span class="dl ${kl}" title="${esc(label)}">nog ${tekst}</span>`;
}
const dagUit=d=>{ const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(String(d||'')); return m?Date.UTC(+m[3],+m[2]-1,+m[1]):null; };

function afleverPaneel(){

  const lijst=[...(carportData.planning||[]),...(carportData.afgemeld||[])].filter(b=>b.afleverdatum)

            <label class="chk" title="Afvinken"><input type="checkbox" ${t.klaar?'checked':''} onchange="carportTaakAf(${t.id},this.checked)"><span class="box"></span></label>
            <span class="soort ${t.soort}">${(SOORTEN.find(x=>x[0]===t.soort)||[,t.soort])[1]}</span>
            <span class="tk">${esc(t.tekst)}</span>
            ${t.door==='mobilox'?`<span class="vanwie" title="Uit de verkoopovereenkomst">Overeenkomst</span>`:''}
            ${t.door==='carport'?`<span class="vanwie">Carport</span>`:''}
          </div>`).join(''):`<div class="note" style="margin:0">Niets te doen.</div>`}
      </div>`;
    return `<div class="bon">
      <div class="bon-kop" onclick="afleverKlap(${b.id})" style="cursor:pointer">
        <span class="bon-greep" style="cursor:pointer">${uit?'▾':'▸'}</span>
        <div class="bon-auto"><div class="nm">${esc(a.merk||'')} ${esc(a.model||'')}</div>
          <div class="id">${a.kenteken&&a.kenteken!=='—'?esc(a.kenteken):esc(a.vin||'')} · aflevering ${esc(b.afleverdatum)}</div></div>
        ${tijdChip(aflever,`Aflevering ${b.afleverdatum}`)}
        ${b.status!=='open'?`<span class="badge b-lopende" title="Carport heeft dit werk afgemeld">Carport klaar</span>`:''}
        ${takenRing(tv.af,tv.totaal,`${tv.af} van de ${tv.totaal} taken afgevinkt`)||`<span class="note" style="margin:0">geen taken</span>`}
        ${magPlannen()?`<span onclick="event.stopPropagation()" style="display:flex;gap:6px;align-items:center">
          <input class="inp" id="afl-datum-${b.id}" style="width:118px;padding:4px 8px;font-size:12px" value="${esc(b.afleverdatum||'')}" title="Afleverdatum verzetten" onkeydown="if(event.key==='Enter')afleverDatum(${b.id})">
          <button class="btn btn-ghost btn-sm" onclick="afleverDatum(${b.id})" title="Nieuwe datum opslaan">Verzetten</button>
          <button class="btn btn-primary btn-sm" onclick="afleveren(${b.id})" title="De auto staat bij de klant">Afgeleverd</button>
        </span>`:''}
      </div>
      ${uit?`<div class="bon-body" style="display:flex;gap:26px;flex-wrap:wrap">
        ${takenlijst('Bij Carport',carportTaken,carportTot,`Klaar ${marge} dagen vóór aflevering, zodat de auto nog naar de poetser kan`,'carport')}
        ${takenlijst('Bij de poetser',poetsTaken,aflever,`Vóór de aflevering op ${b.afleverdatum}`,'poetser')}
        ${tv.eigen.length?`<div style="flex:1;min-width:250px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:7px"><span style="font-weight:700;font-size:12px">Bij Prieva</span>

          ${tv.eigen.map(st=>`<div class="taak ${st.done?'af':''}" style="padding:4px 0">

            <span class="tk">${esc(st.text)}</span>${st.owner?`<span class="vanwie">${esc(st.owner)}</span>`:''}

    </div>`;
  };
  return `<div class="card"><h3>Geplande afleveringen <span class="gcount">${lijst.length}</span></h3><div class="card-body">
    <div class="note" style="margin-top:0">De eerstvolgende bovenaan. Klik een auto open om te zien wat er nog ligt — Carport moet ${marge} dagen vóór de aflevering klaar zijn, daarna is de poetser aan de beurt. Staat de auto bij de klant, druk dan op <b>Afgeleverd</b>.</div>
    ${lijst.map(rij).join('')}

/* Wat er de afgelopen twee weken is afgeleverd. Kort zichtbaar en niet langer: dit is er om een
   vergissing meteen te kunnen terugdraaien, niet als archief — dat staat op de Carport-pagina. */
const AFGELEVERD_DAGEN=14;
function afgeleverdPaneel(){
  const grens=Date.now()-AFGELEVERD_DAGEN*86400000;
  const l=(carportData.afgeleverd||[]).filter(b=>(b.afgeleverdTs||0)>=grens);
  if(!l.length) return '';
  // Ingeklapt, want een afgeleverde auto is geen werk meer. Hij staat er alleen voor het geval iemand
  // zich vergist heeft; dan is Terugzetten één klik weg. Uitklappen kost een klik, in beeld staan
  // kost iedereen elke dag ruimte.
  return `<details style="margin:-6px 4px 18px"><summary class="note" style="cursor:pointer">Afgeleverd — ${l.length} de laatste ${AFGELEVERD_DAGEN} dagen</summary>
    <div style="margin-top:8px">
    ${l.map(b=>{const a=b.auto||{};return `<div class="taak af" style="padding:7px 0">
      <span class="tk"><b>${esc(a.merk||'')} ${esc(a.model||'')}</b> · ${esc(a.kenteken&&a.kenteken!=='—'?a.kenteken:a.vin||'')}

/* De drie handelingen rond afleveren. Ze lezen daarna opnieuw in en tekenen de héle pagina opnieuw:
   de aflevering staat op Vandaag én op de Carport-pagina, en die mogen niet uiteenlopen. */
async function afleverDoe(pad,body,melding){
  try{
    const r=await fetch(pad,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ showToast(j.melding||j.error||"Actie mislukt",false); return null; }
    await loadCarport(); rerenderCurrent();
    if(melding)showToast(melding,true);
    return j;
  }catch(_){ showToast("Geen verbinding met de server",false); return null; }
}
function afleveren(id){ afleverDoe('/api/carport-afgeleverd',{id,afgeleverd:true},"Afgeleverd — hij staat nu onder Afgeleverd"); }
function afleverTerug(id){ afleverDoe('/api/carport-afgeleverd',{id,afgeleverd:false},"Teruggezet in de planning"); }
function afleverDatum(id){
  const inp=document.getElementById('afl-datum-'+id); const t=(inp&&inp.value||'').trim();
  if(t&&!/^\d{2}-\d{2}-\d{4}$/.test(t)){ showToast("Datum als dd-mm-jjjj",false); return; }
  afleverDoe('/api/carport-bon',{id,afleverdatum:t||null},"Afleverdatum bijgewerkt");
}

      <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="garantieToevoegen()">Toevoegen</button>
    </details>
    ${af.length?`<details style="margin-top:10px"><summary class="note" style="cursor:pointer">Afgehandeld (${af.length})</summary>
      <div style="margin-top:8px">${af.map(g=>`<div class="taak af"><span class="tk">${esc(g.omschrijving)} · ${esc(g.kenteken||'')} — afgehandeld ${g.afTs?fmtDate(g.afTs):''} door ${esc(g.afDoor||'')}</span>
        <button class="btn btn-ghost btn-sm" onclick="garantieDoe({actie:'afhandelen',id:${g.id},af:false},'Weer op open gezet')">Heropenen</button></div>`).join("")}</div></details>`:''}
  </div></div>`;
}
/* ===== Carport: werkbonnen en planning =====
   De deadline is de gewenste afleverdatum min de marge (standaard 2 dagen), zodat de auto daarna nog
   naar de poetser kan. De server rekent hem uit en stuurt hem mee; hier tonen we alleen. */
let carportData={marge:2,planning:[],afgemeld:[],afgeleverd:[]};
async function loadCarport(){ if(!apiOk)return;
  try{ const r=await fetch("/api/carport",{cache:"no-store"}); if(r.ok){ const d=await r.json();
    if(d&&Array.isArray(d.planning)){ carportData=d; carportData.afgemeld=d.afgemeld||[]; carportData.afgeleverd=d.afgeleverd||[]; } } }catch(_){}
}
function deadlineChip(bon){
  if(!bon.deadline) return `<span class="dl geen" title="Zonder afleverdatum is er niets te plannen. Prieva vult die in.">geen afleverdatum</span>`;
  const dagen=Math.floor((bon.deadline-Date.now())/86400000);
  const dtxt=new Date(bon.deadline).toLocaleDateString("nl-NL");
  const titel=`Gewenste aflevering ${bon.afleverdatum} · klaar op ${dtxt} (${carportData.marge} dagen eerder, voor de poetser)`;
  if(dagen<0) return `<span class="dl over" title="${esc(titel)}">${-dagen} ${-dagen===1?'dag':'dagen'} over tijd</span>`;
  if(dagen===0) return `<span class="dl nu" title="${esc(titel)}">vandaag klaar</span>`;
  const kl=dagen>=5?"ruim":(dagen>=2?"krap":"nu");
  return `<span class="dl ${kl}" title="${esc(titel)}">nog ${dagen} ${dagen===1?'dag':'dagen'}</span>`;
}
// Poetsen is een eigen soort: dat werk gaat naar de poetser, niet naar de werkplaats, en het moet
// pas ná Carport gebeuren. Daarom staat het apart in de takenlijst per auto.
const SOORTEN=[["reparatie","Reparatie"],["apk","APK"],["beurt","Beurt"],["onderdeel","Onderdeel"],["poetsen","Poetsen"]];
const POETSWERK=t=>t.soort==='poetsen';
const magPlannen=()=>currentUser&&(currentUser.role==='team'||currentUser.role==='admin');
const isCarport=()=>currentUser&&currentUser.role==='carport';

/* Werkbonnen staan dicht, met de voortgang op de kop. Bij twaalf bonnen met elk vijf regels werd de
   planning een lijst waarin je moest zoeken; nu zie je in één oogopslag hoe ver elke auto is en klap
   je open wat je nodig hebt. De bon waar je aan werkt onthoudt zijn stand tijdens de sessie. */
let bonOpen={};
function bonKlap(id){ bonOpen[id]=!bonOpen[id]; rerenderCurrent(); }
function bonKaart(bon,sleepbaar){
  const a=bon.auto||{};
  const uit=!!bonOpen[bon.id];
  // Vanaf een werkbon door naar de auto. Alleen voor Prieva: Carport heeft geen autopagina, en tot nu
  // toe moest je het kenteken overtypen in de zoekbalk om van de planning naar het dossier te komen.
  const naarAuto=magPlannen()&&bon.vehicleId
    ? `<button class="btn btn-ghost btn-sm" title="De auto openen in PVP" onclick="event.stopPropagation();openVeh('${bon.vehicleId}')">Naar de auto →</button>` : '';
  const open=bon.taken.filter(t=>!t.klaar).length;
  const taken=bon.taken.length
    ? bon.taken.map(t=>`<div class="taak ${t.klaar?'af':''}">
        <label class="chk" title="Afvinken"><input type="checkbox" ${t.klaar?'checked':''} onchange="carportTaakAf(${t.id},this.checked)"><span class="box"></span></label>
        <span class="soort ${t.soort}">${SOORTEN.find(x=>x[0]===t.soort)?SOORTEN.find(x=>x[0]===t.soort)[1]:t.soort}</span>
        <span class="tk">${esc(t.tekst)}</span>
        ${t.door==='carport'?`<span class="vanwie" title="Door Carport zelf toegevoegd">Carport</span>`:''}
        ${(t.door==='carport'||magPlannen())?`<button class="btn btn-ghost btn-sm" title="Weghalen" onclick="carportTaakWeg(${t.id})">×</button>`:''}
      </div>`).join("")
    : `<div class="note" style="margin:0 0 8px">Nog geen werk op deze bon.</div>`;
  const notities=bon.notities.length
    ? bon.notities.map(n=>`<div class="notitie ${n.soort}">${esc(n.tekst)}
        <div class="wie">${n.soort==='technisch'?'Technisch':'Voor de klant'} · ${esc(n.door)} · ${fmtDate(n.ts)}</div></div>`).join("")
    : '';
  return `<div class="bon" data-bon="${bon.id}" ${sleepbaar?`draggable="true" ondragstart="bonSleepStart(event,${bon.id})" ondragover="bonSleepOver(event,${bon.id})" ondragleave="this.classList.remove('doel')" ondrop="bonSleepDrop(event,${bon.id})" ondragend="bonSleepEind()"`:''}>
    <div class="bon-kop">
      ${sleepbaar?`<span class="bon-greep" title="Sleep om de volgorde te wijzigen">⠿</span>`:''}
      <span class="bon-greep" style="cursor:pointer" title="${uit?'Dichtklappen':'Openklappen — de taken staan erin'}" onclick="bonKlap(${bon.id})">${uit?'▾':'▸'}</span>
      <div class="bon-auto"><div class="nm">${esc(a.merk||'')} ${esc(a.model||'')}</div>
        <div class="id">${a.kenteken&&a.kenteken!=='—'?esc(a.kenteken):esc(a.vin||'')}${a.km!=null?' · '+Number(a.km).toLocaleString("nl-NL")+' km':''}</div></div>
      ${deadlineChip(bon)}
      <span class="note" style="margin:0">${bon.afleverdatum?'aflevering '+esc(bon.afleverdatum):''}</span>
      ${magPlannen()?`<button class="btn btn-ghost btn-sm" onclick="carportDatum(${bon.id},'${esc(bon.afleverdatum||'')}')">Datum</button>`:''}
      ${naarAuto}
      ${takenRing(bon.taken.filter(t=>t.klaar).length,bon.taken.length,`${bon.taken.filter(t=>t.klaar).length} van de ${bon.taken.length} taken afgevinkt`)||`<span class="note" style="margin:0">nog geen werk</span>`}
      <button class="btn btn-primary btn-sm" onclick="carportAfmelden(${bon.id})">Auto staat klaar</button>
    </div>
    <div class="bon-body" style="${uit?'':'display:none'}">
      ${taken}
      <div style="display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <select id="soort-${bon.id}" class="assign">${SOORTEN.map(([w,l])=>`<option value="${w}">${l}</option>`).join("")}</select>
        <input id="taak-${bon.id}" class="inp" style="flex:1;min-width:180px" placeholder="Wat moet er gebeuren?" onkeydown="if(event.key==='Enter')carportTaakBij(${bon.id})">
        <button class="btn btn-ghost btn-sm" onclick="carportTaakBij(${bon.id})">Toevoegen</button>
      </div>
      ${notities?`<div style="margin-top:12px">${notities}</div>`:''}
      <div style="display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <input id="not-${bon.id}" class="inp" style="flex:1;min-width:200px" placeholder="${isCarport()?'Technische notitie…':'Notitie voor de klant…'}" onkeydown="if(event.key==='Enter')carportNotitie(${bon.id})">
        <button class="btn btn-ghost btn-sm" onclick="carportNotitie(${bon.id})">Notitie</button>
      </div>
    </div></div>`;
}

function renderCarport(){
  const p=carportData.planning, af=carportData.afgemeld||[], gel=carportData.afgeleverd||[];
  const eigenVolgorde=p.some(b=>b.volgorde!==null&&b.volgorde!==undefined);
  const gek=p.filter(b=>heeftKenteken(b.auto||{})), ong=p.filter(b=>!heeftKenteken(b.auto||{}));
  const kop=isCarport()
    ? `<h1 class="page-title">Planning</h1><p class="page-sub">Auto's die bij Carport staan, de eerste deadline bovenaan. Sleep om je eigen volgorde te bepalen. Meld een auto af zodra hij klaarstaat. Gekentekend kan compleet af; ongekentekend is voorwerk.</p>`
    : `<h1 class="page-title">Carport</h1><p class="page-sub">Werkbonnen bij Carport. De deadline is ${carportData.marge} dagen vóór de gewenste aflevering, zodat de auto nog naar de poetser kan.</p>`;
  app.innerHTML=kop
    + (magPlannen()?`<div class="card"><h3>Auto op de planning zetten</h3><div class="card-body">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <select id="cp-auto" class="assign" style="min-width:260px">${
            V.filter(v=>v.status==='lopende'&&!p.some(b=>b.vehicleId===v.id))
             .map(v=>`<option value="${v.id}">${esc(v.merk+' '+v.model)} · ${esc(v.kenteken&&v.kenteken!=='—'?v.kenteken:v.vin)}</option>`).join("")||'<option value="">Geen auto beschikbaar</option>'}</select>
          <input id="cp-datum" class="inp" style="width:160px" placeholder="Aflever dd-mm-jjjj">
          <button class="btn btn-primary btn-sm" onclick="carportBonBij()">Op de planning</button>
        </div>
        <div class="note" style="margin-top:8px">De gewenste afleverdatum komt uit de verkoopovereenkomst in Mobilox. Zolang die koppeling er niet is, vul je hem hier in.</div>
      </div></div>`:'')
    // Twee bakken. Een auto met kenteken kan compleet af: alle werk plus APK, en dan in één keer
    // afleveren. Zonder kenteken kan de APK niet, dus daar is alleen voorwerk mogelijk — werk om op
    // te pakken als het rustig is, zodat de auto later sneller de deur uit kan.
    + `<div class="card"><h3>Gekentekend <span class="gcount">${gek.length}</span>${eigenVolgorde?` <button class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="carportVolgordeTerug()">Terug naar deadlinevolgorde</button>`:''}</h3><div class="card-body">
        <div class="note" style="margin-top:0">Compleet af te maken: al het werk plus APK, zodat de auto in één keer afgeleverd kan worden.</div>
        ${gek.length?gek.map(b=>bonKaart(b,true)).join(""):`<div class="empty"><div class="eb">${ico("inbox",26)}</div>Geen gekentekende auto's op de planning.</div>`}
      </div></div>`
    + `<div class="card"><h3>Ongekentekend <span class="gcount">${ong.length}</span></h3><div class="card-body">
        <div class="note" style="margin-top:0">Nog geen kenteken, dus geen APK. Voorwerk dat vast opgepakt kan worden als het rustig is — groot werk hier eerst weghalen scheelt straks doorlooptijd.</div>
        ${ong.length?ong.map(b=>bonKaart(b,true)).join(""):`<div class="empty">Geen ongekentekende auto's op de planning.</div>`}
      </div></div>`
    // Twee logboeken, want het zijn twee momenten. "Afgemeld" is van Carport: het werk is klaar.
    // "Afgeleverd" is van Prieva: de auto staat bij de klant. Daartussen zit soms een week.
    + `<div class="card"><h3>Afgemeld door Carport <span class="gcount">${af.length}</span></h3><div class="card-body" style="padding:0 4px">
        <div class="note" style="margin:8px 4px 0">Werk klaar, auto staat nog hier. Prieva vinkt hem af zodra hij de deur uit is.</div>
        <!-- deze blijft open: hier ligt nog werk, de auto moet nog de deur uit -->
        ${af.length?`<div class="tabelwrap"><table><thead><tr><th>Voertuig</th><th>Aflevering gewenst</th><th>Afgemeld</th><th>Door</th><th>Werk</th></tr></thead><tbody>
          ${af.map(b=>`<tr><td><div class="nm" style="font-weight:600">${esc((b.auto.merk||'')+' '+(b.auto.model||''))}</div><div class="id" style="font-size:11px;color:var(--muted)">${esc(b.auto.kenteken&&b.auto.kenteken!=='—'?b.auto.kenteken:b.auto.vin||'')}</div></td>
            <td>${esc(b.afleverdatum||'—')}</td><td>${b.klaarTs?fmtDate(b.klaarTs):'—'}</td><td>${esc(b.klaarDoor||'—')}</td>
            <td>${b.taken.filter(t=>t.klaar).length}/${b.taken.length} afgevinkt${magPlannen()?` <button class="btn btn-ghost btn-sm" onclick="carportTerug(${b.id})">Terug op planning</button>${b.afleverdatum?` <button class="btn btn-primary btn-sm" onclick="afleveren(${b.id})">Afgeleverd</button>`:''}`:''}</td></tr>`).join("")}
        </tbody></table></div>`:`<div class="empty">Niets afgemeld dat nog op aflevering wacht.</div>`}
      </div></div>`
    // Het logboek van afgeleverde auto's is een archief dat alleen maar groeit. Ingeklapt: wie wil
    // terugkijken klapt hem open, de rest ziet zijn planning zonder eronder te scrollen.
    + `<div class="card"><h3>Afgeleverd <span class="gcount">${gel.length}</span></h3><div class="card-body" style="padding:0 4px">
        <details${gel.length?'':' open'}><summary class="note" style="cursor:pointer;margin:8px 4px">De auto staat bij de klant — logboek openklappen. Dit wordt nooit opgeschoond.</summary>
        ${gel.length?`<div class="tabelwrap"><table><thead><tr><th>Voertuig</th><th>Aflevering gewenst</th><th>Werkelijk afgeleverd</th><th>Door</th><th>Werk</th></tr></thead><tbody>
          ${gel.map(b=>`<tr><td><div class="nm" style="font-weight:600">${esc((b.auto.merk||'')+' '+(b.auto.model||''))}</div><div class="id" style="font-size:11px;color:var(--muted)">${esc(b.auto.kenteken&&b.auto.kenteken!=='—'?b.auto.kenteken:b.auto.vin||'')}</div></td>
            <td>${esc(b.afleverdatum||'—')}</td><td>${esc(b.afgeleverdDatum||'—')}</td><td>${esc(b.afgeleverdDoor||'—')}</td>
            <td>${b.taken.filter(t=>t.klaar).length}/${b.taken.length} afgevinkt${magPlannen()?` <button class="btn btn-ghost btn-sm" onclick="afleverTerug(${b.id})">Terugzetten</button>`:''}</td></tr>`).join("")}
        </tbody></table></div>`:`<div class="empty">Nog niets afgeleverd.</div>`}
        </details>
      </div></div>`;
  syncHistory();
}
/* Acties. Elke actie gaat naar de server en leest daarna opnieuw in: de planning wordt door twee
   partijen tegelijk bewerkt, dus lokaal bijhouden zou binnen een dag uiteenlopen. */
async function carportDoe(pad,body,melding){
  try{
    const r=await fetch(pad,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ showToast(j.melding||j.error||"Actie mislukt",false); return null; }
    await loadCarport(); rerenderCurrent();
    if(melding)showToast(melding,true);
    return j;
  }catch(_){ showToast("Geen verbinding met de server",false); return null; }
}
function carportTaakBij(bonId){
  const inp=document.getElementById('taak-'+bonId), sel=document.getElementById('soort-'+bonId);
  const tekst=(inp&&inp.value||'').trim(); if(!tekst){ if(inp)inp.focus(); return; }
  carportDoe('/api/carport-taak',{actie:'toevoegen',bonId,soort:sel?sel.value:'reparatie',tekst});
}
function carportTaakAf(id,klaar){ carportDoe('/api/carport-taak',{actie:'afvinken',id,klaar}); }
function carportTaakWeg(id){ if(!window.confirm("Deze regel weghalen?"))return; carportDoe('/api/carport-taak',{actie:'weg',id}); }
function carportNotitie(bonId){
  const inp=document.getElementById('not-'+bonId); const tekst=(inp&&inp.value||'').trim();
  if(!tekst){ if(inp)inp.focus(); return; }
  carportDoe('/api/carport-notitie',{bonId,tekst,soort:isCarport()?'technisch':'klant'},"Notitie toegevoegd");
}
function carportBonBij(){
  const sel=document.getElementById('cp-auto'), d=document.getElementById('cp-datum');
  if(!sel||!sel.value){ showToast("Kies eerst een auto",false); return; }
  const datum=(d&&d.value||'').trim();
  if(datum&&!/^\d{2}-\d{2}-\d{4}$/.test(datum)){ showToast("Afleverdatum als dd-mm-jjjj",false); d.focus(); return; }
  carportDoe('/api/carport-bon',{vehicleId:sel.value,afleverdatum:datum||null},"Op de planning gezet");
}
function carportDatum(id,huidig){
  const d=window.prompt("Gewenste afleverdatum (dd-mm-jjjj). Leeg laten haalt hem weg.",huidig||"");
  if(d===null)return;
  const t=d.trim();
  if(t&&!/^\d{2}-\d{2}-\d{4}$/.test(t)){ showToast("Afleverdatum als dd-mm-jjjj",false); return; }
  carportDoe('/api/carport-bon',{id,afleverdatum:t||null},"Afleverdatum bijgewerkt");
}
function carportAfmelden(id){
  const bon=carportData.planning.find(b=>b.id===id); if(!bon)return;
  const open=bon.taken.filter(t=>!t.klaar).length;
  if(open&&!window.confirm(`Er ${open===1?'staat nog 1 regel':'staan nog '+open+' regels'} open. Toch afmelden als klaar?`))return;
  carportDoe('/api/carport-klaar',{id,klaar:true},"Afgemeld — de auto staat nu bij Afgeleverd");
}
function carportTerug(id){ carportDoe('/api/carport-klaar',{id,klaar:false},"Terug op de planning"); }
function carportVolgordeTerug(){ carportDoe('/api/carport-volgorde',{ids:[]},"Weer op deadlinevolgorde"); }
/* Slepen: de hele nieuwe volgorde gaat in één keer naar de server, zodat er geen gaten of dubbele
   nummers kunnen ontstaan als twee mensen tegelijk schuiven. */
let bonSleep=null;
function bonSleepStart(ev,id){ bonSleep=id; try{ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain',String(id));}catch(_){}
  const el=ev.currentTarget; if(el)el.classList.add('sleep'); }
function bonSleepOver(ev,id){ if(bonSleep===null||bonSleep===id)return; ev.preventDefault(); ev.currentTarget.classList.add('doel'); }
function bonSleepEind(){ bonSleep=null; document.querySelectorAll('.bon').forEach(e=>e.classList.remove('sleep','doel')); }
function bonSleepDrop(ev,doelId){
  ev.preventDefault(); ev.currentTarget.classList.remove('doel');
  const van=bonSleep; bonSleepEind(); if(van===null||van===doelId)return;
  const ids=carportData.planning.map(b=>b.id);
  const i=ids.indexOf(van), j=ids.indexOf(doelId);
  if(i<0||j<0)return;
  ids.splice(j,0,ids.splice(i,1)[0]);
  carportDoe('/api/carport-volgorde',{ids});
}
/* ===== Geldigheid van een taxatierapport =====
   Een rapport is 29 dagen geldig vanaf de fysieke opname van de auto door de taxateur (opgave
   Prieva, 19-08-2026: de verzenddagen zijn daar al vanaf getrokken). Op het formulier zelf staat
   "niet meer dan 1 maand voor de datum van goedkeuring door de RDW"; 29 dagen is de strengere
   praktijkregel. Verloopt het rapport, dan moet de auto opnieuw getaxeerd worden.
   Het verloopmoment ligt aan het BEGIN van de dag, 29 dagen na de opname. Bewust niet aan het eind:
   een teller die te veel tijd belooft is erger dan een die een halve dag tekortkomt. */
const BPM_GELDIG_DAGEN=29;
function bpmVerlooptOp(opname){ const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(String(opname||"")); 
  return m?Date.UTC(+m[3],+m[2]-1,+m[1])+BPM_GELDIG_DAGEN*86400000:null; }
function bpmTellerInhoud(opname){
  const eind=bpmVerlooptOp(opname);
  if(!eind) return {klasse:"onbekend",tekst:"opnamedatum onbekend",titel:"De datum van fysieke opname kon niet uit het rapport gelezen worden; de geldigheid is daarom niet te berekenen."};
  const over=eind-Date.now();
  const dag=n=>n===1?"1 dag":n+" dagen", uur=n=>n===1?"1 uur":n+" uur";
  if(over<=0){ const d=Math.ceil(-over/86400000);
    return {klasse:"weg",tekst:"verlopen — "+dag(d)+" te laat",titel:"Opname "+opname+", verlopen op "+new Date(eind).toLocaleDateString("nl-NL")+". De auto moet opnieuw getaxeerd worden."}; }
  const d=Math.floor(over/86400000), u=Math.floor((over%86400000)/3600000);
  const klasse=d>=7?"ruim":(d>=2?"krap":"bijna");
  return {klasse,tekst:"nog "+dag(d)+" "+uur(u),titel:"Fysieke opname "+opname+" · geldig tot "+new Date(eind).toLocaleDateString("nl-NL")+" ("+BPM_GELDIG_DAGEN+" dagen)"};
}
// data-opname erbij, zodat de teller bijgewerkt kan worden zonder de pagina opnieuw op te bouwen —
// dat zou een upload die op dat moment loopt onderbreken.
function bpmTeller(opname){ const t=bpmTellerInhoud(opname);
  return `<span class="bpmteller ${t.klasse}" data-opname="${esc(opname||"")}" title="${esc(t.titel)}">${t.tekst}</span>`; }
setInterval(()=>{ document.querySelectorAll(".bpmteller").forEach(el=>{
  const t=bpmTellerInhoud(el.dataset.opname); el.className="bpmteller "+t.klasse; el.textContent=t.tekst; el.title=t.titel; }); },60000);

/* Eén regel per rapport, gedeeld door de pagina van het team en die van de taxateur — die stonden
   los van elkaar en liepen daardoor uiteen. */
function bpmRapportRegel(vid,rr){
  return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px">
    <span class="docico">${ico("doc",18)}</span>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rr.name)}</div>
      <div class="note">${fmtDate(rr.ts)} · ${esc(rr.by)}${rr.opname?` · opname ${esc(rr.opname)}`:""}${rr.taxateur?` · ${esc(rr.taxateur)}`:""}</div>
    </div>
    ${bpmTeller(rr.opname)}
    <a class="btn btn-ghost btn-sm" href="${rr.url}" target="_blank" download>${ico("download")} Openen</a>
    <button class="btn btn-danger-o btn-sm" title="Verwijderen" onclick="delBpm('${vid}','${rr.url}')">×</button>
  </div>`;

/* De rapporten gaan stuk voor stuk naar de server: zes pdf's van 10 MB in één verzoek loopt tegen
   de 30 MB van nginx aan, en dan verlies je ze allemaal in plaats van één. */
let bpmUitslag=[], bpmBezig=false;
function toonBpmUitslag(){
  const el=document.getElementById('bpmuitslag'); if(!el)return;
  el.innerHTML=bpmUitslag.map(r=>{
    if(r.status==='bezig')return `<div class="bpmrij"><span class="spin"></span><span class="bn">${esc(r.naam)}</span><span class="note">lezen…</span></div>`;
    if(r.status==='geplaatst')return `<div class="bpmrij goed"><span>✓</span><span class="bn">${esc(r.naam)}</span><span class="note">→ ${esc(r.auto)}</span>${bpmTeller(r.opname)}</div>`;
    return `<div class="bpmrij mis"><span>!</span><span class="bn">${esc(r.naam)}</span><span class="note">${esc(r.reden)}</span></div>`;
  }).join('');
}
async function sorteerRapporten(files){
  const alles=[...(files||[])];
  const lijst=alles.filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  if(!lijst.length){ showToast(alles.length?"Alleen pdf-bestanden — er is niets geüpload":"Geen bestanden gekozen",false); return; }
  if(bpmBezig){ showToast("Nog bezig met de vorige stapel — even geduld",false); return; }
  bpmBezig=true; bpmUitslag=lijst.map(f=>({naam:f.name,status:'bezig'})); toonBpmUitslag();
  for(let i=0;i<lijst.length;i++){
    const f=lijst[i];
    try{
      const dataUrl=await leesBestand(f);
      const res=await fetch('/api/bpmreport-sorteer',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:f.name,dataUrl})});
      if(!res.ok){ bpmUitslag[i]={naam:f.name,status:'mis',reden:res.status===413?'bestand te groot voor de server':'uploaden mislukt ('+res.status+')'}; }
      else{
        const j=await res.json();
        if(j.uitkomst==='geplaatst') bpmUitslag[i]={naam:f.name,status:'geplaatst',opname:j.opname,
          auto:`${j.auto.merk} ${j.auto.model} · ${j.auto.kenteken&&j.auto.kenteken!=='—'?j.auto.kenteken:j.vin}`};
        else if(j.uitkomst==='geen-vin') bpmUitslag[i]={naam:f.name,status:'mis',reden:'geen chassisnummer gevonden bij veld 1a — zet dit rapport met de hand bij de auto'};
        else if(j.uitkomst==='onbekende-auto') bpmUitslag[i]={naam:f.name,status:'mis',reden:`chassisnummer ${j.vin} staat niet in PVP`};
        else bpmUitslag[i]={naam:f.name,status:'mis',reden:j.reden||'onbekende fout'};
      }
    }catch(e){ bpmUitslag[i]={naam:f.name,status:'mis',reden:'lezen of versturen mislukt'}; }
    toonBpmUitslag();
  }
  bpmBezig=false;
  const goed=bpmUitslag.filter(r=>r.status==='geplaatst').length;
  await loadBpm();
  rerenderCurrent();
  showToast(goed===lijst.length?`${goed} rapport${goed===1?'':'en'} geplaatst`:`${goed} van de ${lijst.length} geplaatst — kijk de rode regels na`, goed===lijst.length);
}

// Bestandsnaam waar je buiten PVP nog iets aan hebt: merk, kenteken of VIN, wat het voorstelt, en de
// juiste extensie. Zonder die extensie opent het bestand op Windows niet met een dubbelklik.
function fotoNaam(v,p,url){
  const ext=((url||'').split('?')[0].split('.').pop()||'jpg').toLowerCase();
  const sleutel=(v.kenteken&&v.kenteken!=='—')?v.kenteken:v.vin;
  return `${v.merk||''}-${v.model||''}-${sleutel||v.id}-${p.key}`.replace(/[^A-Za-z0-9._-]+/g,'-')+'.'+ext;
}
// Gebruikt door zowel het S-TAX-portaal als de interne weergave; bewust één functie, want twee

async function downloadFotoGroep(id,group){ const v=V.find(x=>x.id===id); if(!v)return; const g=PHOTO_GROUPS.find(x=>x.group===group); if(!g)return; const items=g.items.filter(p=>v.photos[p.key]); if(!items.length)return;
  const base=(`${v.merk}-${v.model}-${v.kenteken!=='—'?v.kenteken:v.vin}-${g.step}`).replace(/[^A-Za-z0-9._-]+/g,'-');
  if(!window.JSZip){ items.forEach((p,i)=>{const a=document.createElement('a');a.href=v.photos[p.key];a.download=base+'-'+(i+1);a.click();}); return; }
  showToast("ZIP maken…",false); const zip=new JSZip(); const folder=zip.folder(base);
  for(let i=0;i<items.length;i++){ try{ const u=v.photos[items[i].key]; const r=await fetch(u); const b=await r.blob(); const ext=(u.split('.').pop()||'jpg').split('?')[0]; folder.file(items[i].key+'.'+ext,b); }catch(_){}}
  const blob=await zip.generateAsync({type:'blob'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=base+'.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function isImg(f){ return /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name||''); }
let adUp={};
async function uploadAdFiles(id,fileList){ const files=[...fileList].filter(isImg); if(!files.length)return;
  if(adUp[id]){ showToast("Er wordt al geüpload voor deze auto — even wachten…",false); return; }
  adUp[id]={done:0,total:files.length}; rerenderCurrent();
  showToast("Uploaden… ("+files.length+" foto"+(files.length===1?'':'’s')+")",false);
  for(const f of files){

    if(dataUrl){

      else { if(!adPhotos[id])adPhotos[id]=[]; adPhotos[id].push(dataUrl); }

function entriesFromDrop(dt){ return new Promise(resolve=>{ const items=dt.items; if(!items||!items.length||!(items[0].webkitGetAsEntry)){ return resolve([...(dt.files||[])]); }
  const files=[]; let pending=0, done=false;
  const check=()=>{ if(done&&pending===0)resolve(files); };
  const read=entry=>{ if(!entry)return; if(entry.isFile){ pending++; entry.file(f=>{ files.push(f); pending--; check(); }, ()=>{ pending--; check(); }); }
    else if(entry.isDirectory){ const rd=entry.createReader(); const batch=()=>{ pending++; rd.readEntries(ents=>{ pending--; if(ents.length){ ents.forEach(read); batch(); } check(); }, ()=>{ pending--; check(); }); }; batch(); } };
  for(const it of items){ const en=it.webkitGetAsEntry&&it.webkitGetAsEntry(); if(en)read(en); else { const f=it.getAsFile&&it.getAsFile(); if(f)files.push(f); } }
  done=true; check();
});}

}

}
function openFotoCar(id){ fotoState.car=id; renderFoto(); window.scrollTo(0,0); }
function fotoBack(){ fotoState.car=null; renderFoto(); window.scrollTo(0,0); }
function renderFotoCar(){ const v=V.find(x=>x.id===fotoState.car); if(!v){fotoState.car=null;return renderFotoList();}
  const n=adList(v.id).length;
  app.innerHTML=`<div class="back" onclick="fotoBack()">← Alle auto's</div>
    <div class="det-head"><div class="hero"><svg width="64" height="40" viewBox="0 0 24 24" fill="#aebfce">${carIcon().replace('width="20" height="13"','')}</svg></div>
      <div class="det-title" style="flex:1;min-width:260px"><h1>${v.merk} ${v.model}</h1><div class="sub">${v.uitv||''}</div>
        <div class="chips"><span class="chip"><b>Kenteken</b> ${v.kenteken}</span><span class="chip"><b>VIN</b> <span class="mono">${v.vin}</span></span><span class="chip"><b>Km</b> ${km(v.km)}</span></div></div></div>
    <div class="card"><h3>Advertentiefoto's <span class="muted" style="font-weight:500;font-size:12px">${n} foto${n===1?'':'’s'}</span></h3>
      <div class="card-body">${adGallery(v.id)}<div class="note" style="margin-top:10px">Maak of kies de foto's voor deze auto. Ze worden direct op de server bewaard.</div></div></div>`;
}

/* ===== Login & rollen ===== */
function renderLogin(err){
  app.innerHTML=`<div class="loginwrap"><div class="logincard">
    <div class="loginhead"><svg width="34" height="38" viewBox="0 0 60 68" aria-label="Prieva"><path d="M30 2.5 L53.9 16.3 V43.7 L30 57.5 L6.1 43.7 V16.3 Z" fill="#16232b"/><path d="M30 14.5 L43.2 22.1 V37.3 L30 44.9 L16.8 37.3 V22.1 Z" fill="#0d9ebf"/><circle cx="30" cy="29.7" r="4.3" fill="#ffffff"/></svg>
      <div class="lt">PRIEVA<small>VEHICLE PLATFORM</small></div></div>
    <div class="loginbody">
      <label>Gebruikersnaam</label><input id="lg-user" type="text" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label>Wachtwoord</label><input id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      ${err?`<div class="loginerr">${err}</div>`:''}
      <button class="btn btn-primary" style="width:100%;margin-top:16px;justify-content:center" onclick="doLogin()">Inloggen »</button>
    </div></div></div>`;
  setTimeout(()=>{const el=document.getElementById('lg-user'); if(el)el.focus();},40);
}
async function doLogin(){ const uu=document.getElementById('lg-user'), pp=document.getElementById('lg-pass'); if(!uu||!pp)return;
  const u=uu.value.trim(), p=pp.value; if(!u||!p){renderLogin('Vul gebruikersnaam en wachtwoord in.');return;}
  try{ const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
    if(r.ok){ const j=await r.json(); currentUser={name:j.name,role:j.role}; kanUitlezen=!!j.uitlezen; apiOk=true; startFor(); }
    else { renderLogin('Onjuiste gebruikersnaam of wachtwoord.'); }
  }catch(_){ renderLogin('Kan de server niet bereiken.'); }
}
async function logout(){ try{ await fetch("/api/logout",{method:"POST"}); }catch(_){} currentUser=null; location.reload(); }
async function loadStatusFoto(){ if(!apiOk)return; try{ const r=await fetch("/api/status",{cache:"no-store"}); if(r.ok){ const s=await r.json(); if(s&&s.vehicles){ V.forEach(v=>{ const d=s.vehicles[v.id]; if(d&&d.status)v.status=d.status; }); } } }catch(_){} }
async function startFor(){
  // Eerst de catalogus, dan pas de rest: loadState/loadTaxState/loadStatusFoto mappen hun gegevens op
  // bestaande rijen in V, dus een auto die er nog niet in staat zou zijn voortgang verliezen.
  // Boven de rolsplitsing, want alle drie de rollen gebruiken V.
  await loadVehicles();
  const foto=currentUser.role==='foto';
  const tax=currentUser.role==='taxateur';
  const cp=currentUser.role==='carport';
  const restricted=foto||tax||cp;
  const el=id=>document.getElementById(id);
  if(el('nav'))el('nav').style.display=restricted?'none':'';
  const sc=document.querySelector('.search'); if(sc)sc.style.display=restricted?'none':'';
  if(el('addTodoBtn'))el('addTodoBtn').style.display=restricted?'none':'';
  if(el('addCarBtn'))el('addCarBtn').style.display=restricted?'none':'';
  if(el('undoBtn'))el('undoBtn').style.display=restricted?'none':'';
  if(el('logoutBtn'))el('logoutBtn').style.display='';
  if(el('logboekBtn'))el('logboekBtn').style.display=(currentUser.role==='admin')?'':'none';
  const av=document.querySelector('.avatar'); if(av)av.textContent=(currentUser.name||'?').slice(0,2).toUpperCase();
  const db=document.querySelector('.demo-bar');
  if(db&&foto)db.textContent=(currentUser.name||'Fotograaf')+' · voeg per auto de advertentiefoto’s toe';
  if(db&&tax)db.textContent=(currentUser.name||'S-TAX')+' · auto’s op taxatie · bekijk foto’s en upload het BPM-rapport';
  if(db&&cp)db.textContent=(currentUser.name||'CarPort')+' · planning · werk af en meld een auto af zodra hij klaarstaat';
  if(foto){ state.view='foto'; loadAdphotos().then(loadStatusFoto).then(renderFoto); }
  else if(tax){ state.view='tax'; loadTaxState().then(loadBpm).then(renderTax); }
  else if(cp){ state.view='carport'; loadCarport().then(renderCarport); }
  else { Promise.all([loadState(),loadAdphotos(),loadBpm(),loadCarport(),loadGarantie(),loadInruil()]).then(()=>go('vandaag')); }
}
async function boot(){
  try{ const r=await fetch("/api/me",{cache:"no-store"});
    if(r.ok){ currentUser=await r.json(); kanUitlezen=!!currentUser.uitlezen; apiOk=true; startFor(); return; }
    if(r.status===401){ apiOk=true; renderLogin(); return; }
  }catch(_){ /* geen backend bereikbaar → demo/standalone */ }
  currentUser={name:'Demo',role:'team'}; apiOk=false; startFor();
}
/* ===== Blijven staan waar je stond =====
   Elke handeling — een vinkje, een foto die klaar is met uploaden, een taak die je afvinkt — tekent
   de pagina opnieuw. Dat gebeurde met een sprong naar de bovenkant, want de teken-functies riepen
   zelf window.scrollTo(0,0) aan. Bij tien foto's onderaan een auto betekende dat: vinkje, sprong,
   terugscrollen, volgende vinkje.
   Naar boven springen hoort bij NAVIGEREN, niet bij tekenen. Daarom wordt de positie bewaard zolang
   je op hetzelfde scherm blijft, en alleen losgelaten als het scherm verandert. */
let laatsteWeergave=null;
function scrollBewaard(fn){
  const y=window.scrollY||document.documentElement.scrollTop||0;
  const vorige=laatsteWeergave;
  fn();
  laatsteWeergave=state.view;
  // Anders scherm: bovenaan beginnen. Zelfde scherm: terug naar waar je stond. Het kan zijn dat de
  // pagina korter is geworden; de browser knipt dan vanzelf af op de nieuwe hoogte.
  if(state.view!==vorige) window.scrollTo(0,0);
  else if(y) window.scrollTo(0,y);
}

function rerender(){ scrollBewaard(rerenderNu); }
function rerenderNu(){
  // Kolom E t/m P past niet in 1160px. Alleen de drie boekpagina's gaan de breedte in; de rest
  // blijft leesbaar smal, want een formulier van 1560px breed leest niemand prettig.
  app.classList.toggle("breed",["komende","lopende","verkocht"].includes(state.view));
  if(state.view==="carport")return renderCarport();
  if(state.view==="vandaag")renderVandaag();
  else if(state.view==="komende")renderKomende();
  else if(state.view==="lopende")renderLopende();
  else if(state.view==="verkocht")renderVerkocht();
  else if(state.view==="logboek")renderLog();
  else if(state.view.startsWith("veh:"))openVehNu(state.view.split(":")[1]);
  updateUndoUI(); syncHistory();
}
function setNav(view){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));}
function go(view){state.view=view; if(["vandaag","komende","lopende","verkocht","carport","logboek"].includes(view))setNav(view); rerender(); window.scrollTo(0,0);}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>go(b.dataset.view));
document.getElementById("search").addEventListener("input",e=>{state.q=e.target.value; if(state.view.startsWith("veh:"))go("komende"); else rerender(); document.getElementById("search").focus();});
/* ===== In-app navigatie: browser terug/vooruit blijft binnen PVP ===== */
let lastRouteKey=null, popping=false;
function routeKey(){ if(currentUser&&currentUser.role==='carport')return 'carport'; if(currentUser&&currentUser.role==='foto')return 'foto:'+(fotoState.car||''); if(currentUser&&currentUser.role==='taxateur')return 'tax:'+(taxState.car||''); return state.view; }
function syncHistory(){ if(popping)return; const k=routeKey(); if(k===lastRouteKey)return; const first=lastRouteKey===null; lastRouteKey=k; try{ window.history[first?'replaceState':'pushState']({k},''); }catch(_){} }
function applyRoute(k){
  if(currentUser&&currentUser.role==='foto'){ fotoState.car=(k&&k.indexOf('foto:')===0)?(k.slice(5)||null):null; renderFoto(); }
  else if(currentUser&&currentUser.role==='taxateur'){ taxState.car=(k&&k.indexOf('tax:')===0)?(k.slice(4)||null):null; renderTax(); }
  else if(!k||["vandaag","komende","lopende","logboek"].includes(k)){ state.view=k||'vandaag'; setNav(state.view); rerender(); window.scrollTo(0,0); }
  else if(k.indexOf('veh:')===0){ state.view=k; openVeh(k.split(':')[1]); }
  else { state.view='vandaag'; rerender(); }
  lastRouteKey=routeKey();
}
window.addEventListener('popstate',e=>{ popping=true; try{ applyRoute(e.state&&e.state.k); }finally{ popping=false; } });
boot();
</script>
