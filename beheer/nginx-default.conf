server {
    server_name pvp.prieva.nl;
    root /var/www/html;
    index index.html;
    client_max_body_size 30m;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/html;
    }


    # index.html nooit uit de browsercache serveren. PVP is één bestand dat regelmatig verandert;
    # zonder dit werkt een collega door met een oude versie en zoek je fouten die al verholpen zijn.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        alias /var/pvp/uploads/;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pvp.prieva.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pvp.prieva.nl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = pvp.prieva.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pvp.prieva.nl;
    return 404; # managed by Certbot


}