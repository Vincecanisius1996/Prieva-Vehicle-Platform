server {
    server_name pvp.prieva.nl;
    root /var/www/html;
    index index.html;
    client_max_body_size 30m;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/html;
    }


    # index.html nooit uit de browsercache serveren. PVP is één bestand dat regelmatig verandert;
    # zonder dit werkt een collega door met een oude versie en zoek je fouten die al verholpen zijn.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /uploads/ loopt via de app, zodat de sessiecontrole niet overgeslagen wordt. Stond hier eerder
    # een kale `alias`, en dan gaf een fotoURL 200 zonder cookie — ook op een BPM-rapport of een
    # koopovereenkomst met persoonsgegevens erin.
    # De app controleert de cookie en antwoordt met X-Accel-Redirect; nginx levert daarna het bestand
    # af vanaf de interne locatie hieronder. Node stuurt dus geen bytes.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Alleen bereikbaar via X-Accel-Redirect vanuit de app: `internal` betekent dat nginx een verzoek
    # van buiten op dit pad met 404 beantwoordt.
    location /intern-uploads/ {
        internal;
        alias /var/pvp/uploads/;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pvp.prieva.nl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pvp.prieva.nl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = pvp.prieva.nl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name pvp.prieva.nl;
    return 404; # managed by Certbot


}